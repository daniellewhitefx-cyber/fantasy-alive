<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/contact.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contact - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.page-hero{
display:grid;
grid-template-columns: 1fr 1fr;
align-items:center;
height: 320px;
overflow: hidden;
}
.page-hero-content{
padding: 2rem 3rem 2rem 5.5rem;
text-align: center;
}
.page-hero .logo-img{ width:100%; max-width: 440px; height:auto; display:block; margin: 0 auto; }
.page-hero h1{
font-family: 'EB Garamond', serif;
font-weight: 500;
font-size: 3rem;
margin: 0.5rem 0 0;
color: var(--brown);
text-align: center;
}
.page-hero-image{
position:relative;
overflow:hidden;
height: 100%;
min-height: 320px;
}
.page-hero-image::after{
content:"";
position:absolute;
top:0; left:0;
width: 45%; height:100%;
background: linear-gradient(to left, rgba(236,225,205,0) 0%, var(--cream) 100%);
pointer-events: none;
}
.page-hero-image img{
width:100%; height:100%; object-fit:cover; display:block;
}

.contact-section{
padding: 3rem 3rem 4rem;
display:flex;
justify-content:center;
}
.contact-form-wrap{
width: 100%;
max-width: 700px;
box-shadow: 10px 10px 0 0 var(--gold);
border: 3px solid var(--gold);
background: var(--row-a);
padding: 2rem 2.2rem;
}
.contact-form-wrap p{
font-family: 'EB Garamond', serif;
font-size: 1.05rem;
line-height: 1.5;
color: var(--brown);
margin: 0 0 1.6rem;
}
.contact-field{
margin-bottom: 1.2rem;
}
.contact-field label{
display:block;
font-family: 'Cinzel', serif;
font-weight: 700;
font-size: 0.85rem;
letter-spacing: 0.03em;
color: var(--brown-dark);
margin-bottom: 0.4rem;
}
.contact-field input,
.contact-field select,
.contact-field textarea{
width: 100%;
font-family: 'EB Garamond', serif;
font-size: 1.05rem;
padding: 0.65rem 0.8rem;
border: 2px solid var(--gold-dark);
border-radius: 4px;
background: #fff;
color: var(--brown);
}
.contact-field textarea{
min-height: 140px;
resize: vertical;
}
.contact-submit{
font-family: 'Cinzel', serif;
font-weight: 700;
font-size: 1rem;
padding: 0.8rem 1.8rem;
background: var(--gold);
color: var(--ink);
border: 2px solid var(--gold-dark);
border-radius: 4px;
cursor: pointer;
}
.contact-submit:hover{ background: var(--gold-dark); }

@media (max-width: 900px){
.page-hero{ grid-template-columns: 1fr; }
.contact-section{ padding: 2rem 1.2rem 3rem; }
.contact-form-wrap{ padding: 1.5rem 1.4rem; }
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<section class="page-hero">
<div class="page-hero-content">
<img src="https://i.imgur.com/zcnx0lm.png" alt="Fantasy Alive" class="logo-img">
<h1>Contact</h1>
</div>
<div class="page-hero-image">
<img src="https://i.imgur.com/TOVYGcK.jpeg" alt="Ornate suit of plate armour">
</div>
</section>

<section class="contact-section">
<div class="contact-form-wrap">
<p>Our team will get back to you as soon as possible!</p>
<form id="contact-form">
<div class="contact-field">
<label for="contact-name">Name</label>
<input type="text" id="contact-name" required>
</div>
<div class="contact-field">
<label for="contact-email">Your Email</label>
<input type="email" id="contact-email" required>
</div>
<div class="contact-field">
<label for="contact-reason">What's this about?</label>
<select id="contact-reason">
<option>General Game Question</option>
<option>Plot</option>
<option>Character Info Update</option>
<option>Owners / Business</option>
<option>Rules</option>
<option>Lore</option>
<option>Player Relations</option>
<option>Conventions / Events</option>
<option>Other</option>
</select>
</div>
<div class="contact-field">
<label for="contact-message">Message</label>
<textarea id="contact-message" required></textarea>
</div>
<button type="submit" class="contact-submit">Send</button>
</form>
</div>
</section>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', function(e){
  e.preventDefault();
  var name = document.getElementById('contact-name').value.trim();
  var email = document.getElementById('contact-email').value.trim();
  var reason = document.getElementById('contact-reason').value;
  var message = document.getElementById('contact-message').value.trim();

  var subject = encodeURIComponent('Contact form: ' + reason);
  var body = encodeURIComponent('Name: ' + name + '\nEmail: ' + email + '\n\n' + message);
  window.location.href = 'mailto:logistics@fantasyalivelrp.com?subject=' + subject + '&body=' + body;
});
</script>
</body>
</html>
