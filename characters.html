<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Characters &mdash; Fantasy Alive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<!-- MAIN PANEL -->
<div>

<div class="char-switcher" id="chars-char-switcher"></div>

<div class="char-header">
<div class="char-tab" id="chars-char-tab-name">&nbsp;</div>
<div id="chars-register-status"><a href="register.html"><button class="btn-gold">Register for Next Event</button></a></div>
</div>

<div class="panel-shadow">
<div class="char-panel" id="chars-char-panel"></div>
</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/members-auth.js"></script>
<script src="js/registration-status.js"></script>
<script>
(function(){
const CHARACTERS = [
  {
    id:'lucifer',
    name:'Lucifer Ambrosias',
    race:'Curtainborn',
    charClass:'Yeoman',
    lifePoints:4,
    spiritualEnergy:14,
    resurrections:2,
    experience:'850/860 (10)',
    xpSpRatio:'15:1',
    skillPoints:'66/70 (4)',
    skills:[
      {name:'Spirit Sense', type:'Ability', focus:'', level:'', sp:0},
      {name:'Theology', type:'Academic', focus:'', level:'', sp:4},
      {name:'Clerical Investment', type:'Academic', focus:'Apenca', level:3, sp:18},
      {name:'Read & Write', type:'Academic', focus:'', level:'', sp:6},
      {name:'Spiritual Energy', type:'Academic', focus:'', level:8, sp:16},
      {name:'Physician', type:'Trade', focus:'', level:2, sp:9},
      {name:'Craftsman', type:'Trade', focus:'Glassblower', level:1, sp:3},
      {name:'Dodge', type:'Combat', focus:'', level:1, sp:10},
    ]
  },
  {
    id:'char2',
    name:'Character 2',
    race:'Elf',
    charClass:'Scholar',
    lifePoints:3,
    spiritualEnergy:0,
    resurrections:0,
    experience:'120/120 (0)',
    xpSpRatio:'15:1',
    skillPoints:'8/8 (0)',
    skills:[
      {name:'Read & Write', type:'Academic', focus:'', level:'', sp:6},
      {name:'Dodge', type:'Combat', focus:'', level:1, sp:10},
    ]
  }
];

let activeCharId = CHARACTERS[0].id;

function chars_selectChar(id){
  activeCharId = id;
  render();
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function updateRegisterStatus(character){
  const el = document.getElementById('chars-register-status');
  const defaultButton = `<a href="register.html"><button class="btn-gold">Register for Next Event</button></a>`;
  el.innerHTML = defaultButton;

  try{
    const user = await faGetCurrentUser();
    if(!user) return;
    const result = await faCheckRegistration(window.FA_NEXT_EVENT.label, 'character', character.name, user.email);
    // Only apply the result if the user hasn't switched characters since we asked
    if(result.registered && activeCharId === character.id){
      el.innerHTML = `<a href="register.html" class="chars-registered-badge">&#10003; You're Registered for ${escapeHtml(window.FA_NEXT_EVENT.label)}</a>`;
    }
  } catch(err){
    // fail open — leave the default Register button showing
  }
}

function render(){
  const c = CHARACTERS.find(ch => ch.id === activeCharId);

  const switcher = document.getElementById('chars-char-switcher');
  switcher.innerHTML = CHARACTERS.map(ch =>
    `<button class="${ch.id===activeCharId?'active':''}" onclick="chars_selectChar('${ch.id}')">${ch.name}</button>`
  ).join('');

  document.getElementById('chars-char-tab-name').textContent = c.name;
  updateRegisterStatus(c);

  document.getElementById('chars-char-panel').innerHTML = `
    <div class="stat-panel">
      <div class="stat-row"><span class="stat-label">Race:</span> ${c.race}</div>
      <div class="stat-row"><span class="stat-label">Class:</span> ${c.charClass}</div>
      <div class="stat-row"><span class="stat-label">Life Points:</span> ${c.lifePoints}</div>
      <div class="stat-row"><span class="stat-label">Spiritual Energy:</span> ${c.spiritualEnergy}</div>
      <div class="stat-row"><span class="stat-label">Resurrections:</span> ${c.resurrections}</div>
      <div class="stat-row"><span class="stat-label">Experience:</span> ${c.experience}</div>
      <div class="stat-row"><span class="stat-label">XP:SP Ratio:</span> ${c.xpSpRatio}</div>
      <div class="stat-row"><span class="stat-label">Skill Points:</span> ${c.skillPoints}</div>
    </div>
    <table class="data-table">
      <thead><tr><th>Skill</th><th>Type</th><th>Focus</th><th>Level</th><th>SP</th></tr></thead>
      <tbody>
        ${c.skills.map(s => `<tr><td>${s.name}</td><td>${s.type}</td><td>${s.focus}</td><td>${s.level}</td><td>${s.sp}</td></tr>`).join('')}
      </tbody>
    </table>
  `;
}

window.chars_selectChar = chars_selectChar;
render();
})();
</script>

</body>
</html>
