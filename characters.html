<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<div class="panel">
<div class="panel-head"><h2>Your Characters</h2></div>
<div class="panel-body">
<div class="char-header" style="margin-bottom:0;">
<div class="char-switcher" id="chars-char-switcher"></div>
<div id="chars-header-actions" style="display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap;">
<div id="chars-register-status"><a href="register.html"><button class="btn-gold">Register for Next Event</button></a></div>
<div id="chars-new-char-slot"></div>
</div>
</div>
</div>
</div>

<div class="panel-shadow">
<div class="char-panel" id="chars-char-panel">Loading&hellip;</div>
</div>

<div class="reg-section" id="chars-remort-area" style="margin-top:2.4rem;"></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/members-auth.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/xp-convert.js"></script>
<script>
(function(){
let CHARACTERS = [];
let activeCharId = null;
let remortByChar = {};
let xpByChar = {};
let showDatesLearned = false;

const RACE_STATS = {
  'Curtainborn': { baseLp: 4, maxLp: 10, baseResurrections: 2, baseSe: 5, baseMe: 0 },
  'D\'Shunn': { baseLp: 4, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Dwarf': { baseLp: 6, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Elf': { baseLp: 4, maxLp: 10, baseResurrections: 1, baseSe: 0, baseMe: 5 },
  'Gnome': { baseLp: 4, maxLp: 8, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Goblin': { baseLp: 4, maxLp: 8, baseResurrections: 3, baseSe: 0, baseMe: 0 },
  'Human': { baseLp: 5, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Lizardfolk': { baseLp: 6, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Malkin': { baseLp: 6, maxLp: 12, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Minotaur': { baseLp: 8, maxLp: 20, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Orc': { baseLp: 7, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 }
};
const MAX_RESURRECTIONS = 5;

function skillLevelTotal(skills, name){
  return skills
    .filter(s => s.name.trim().toLowerCase() === name.toLowerCase())
    .reduce((sum, s) => sum + (s.level || 0), 0);
}

function hasSkill(skills, name){
  return skills.some(s => s.name.trim().toLowerCase() === name.toLowerCase());
}

function deriveStats(c){
  const race = RACE_STATS[c.race] || { baseLp: 5, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 };
  const skills = c.skills || [];

  const lp = Math.min(race.baseLp + skillLevelTotal(skills, 'Physical Endurance'), race.maxLp);
  const resurrectionsLeft = Math.min(race.baseResurrections + skillLevelTotal(skills, 'Spiritual Endurance'), MAX_RESURRECTIONS);
  const se = race.baseSe + skillLevelTotal(skills, 'Spiritual Energy') + (hasSkill(skills, 'Theology') ? 1 : 0);
  const me = race.baseMe + skillLevelTotal(skills, 'Magical Energy') + (hasSkill(skills, 'Magery') ? 1 : 0);

  return { lp, se, me, resurrectionsLeft };
}

function chars_selectChar(id){
  activeCharId = id;
  render();
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(d){
  if(!d) return '-';
  return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

function chars_toggleDatesLearned(){
  showDatesLearned = !showDatesLearned;
  const c = CHARACTERS.find(ch => ch.id === activeCharId);
  if(c) renderCharPanel(c);
}

async function updateRegisterStatus(character){
  const el = document.getElementById('chars-register-status');
  const defaultButton = `<a href="register.html"><button class="btn-gold">Register for Next Event</button></a>`;
  el.innerHTML = defaultButton;

  try{
    const user = await faGetCurrentUser();
    if(!user) return;
    const result = await faCheckRegistration(window.FA_NEXT_EVENT.label, 'character', character.name, user.email);
    if(result.registered && activeCharId === character.id){
      el.innerHTML = `<a href="register.html" class="chars-registered-badge">&#10003; You're Registered for ${escapeHtml(window.FA_NEXT_EVENT.label)}</a>`;
    }
  } catch(err){
  }
}

function updateNewCharSlot(){
  const slot = document.getElementById('chars-new-char-slot');
  if(CHARACTERS.length < 2){
    slot.innerHTML = `<a href="character-creator.html"><button class="btn-outline">+ Create New Character</button></a>`;
  } else {
    slot.innerHTML = '';
  }
}

function render(){
  const c = CHARACTERS.find(ch => ch.id === activeCharId);
  updateNewCharSlot();

  const switcher = document.getElementById('chars-char-switcher');
  switcher.innerHTML = CHARACTERS.map(ch =>
    `<button class="${ch.id===activeCharId?'active':''}" onclick="chars_selectChar('${ch.id}')">${escapeHtml(ch.name)}</button>`
  ).join('');

  if(!c){
    document.getElementById('chars-char-panel').innerHTML = `
      <p class="page-subhead">You don't have a character yet.
      <a href="character-creator.html">Create one</a> to get started.</p>
    `;
    document.getElementById('chars-remort-area').innerHTML = '';
    return;
  }

  updateRegisterStatus(c);
  renderRemortArea(c);
  renderCharPanel(c);
}

function renderCharPanel(c){
  const spent = c.skills.reduce((sum, s) => sum + s.sp, 0);
  const experience = xpByChar[c.id] || 0;
  const conv = faConvertXpToSp(experience, c.startingSp, spent);
  const stats = deriveStats(c);

  document.getElementById('chars-char-panel').innerHTML = `
    <div>
      <div class="stat-panel">
        <div class="stat-row"><span class="stat-label">Race</span><span class="stat-value">${escapeHtml(c.race)}</span></div>
        <div class="stat-row"><span class="stat-label">Social Class</span><span class="stat-value">${c.socialClass ? escapeHtml(c.socialClass) : '-'}</span></div>
        <div class="stat-row"><span class="stat-label">Birthday</span><span class="stat-value">${c.birthday ? escapeHtml(c.birthday) : '-'}</span></div>
        <div class="stat-row"><span class="stat-label">Skill Points</span><span class="stat-value">${spent}/${conv.totalPool}</span></div>
        <div class="stat-row"><span class="stat-label">LP</span><span class="stat-value">${stats.lp}</span></div>
        <div class="stat-row"><span class="stat-label">SE/ME</span><span class="stat-value">${stats.se}/${stats.me}</span></div>
        <div class="stat-row"><span class="stat-label">Resurrections Left</span><span class="stat-value">${stats.resurrectionsLeft}</span></div>
        <div class="stat-row"><span class="stat-label">Experience</span><span class="stat-value">${conv.leftoverXp.toLocaleString()}</span></div>
        <div class="stat-row"><span class="stat-label">XP Converted</span><span class="stat-value">${(conv.xpConvertedSp * conv.rate).toLocaleString()} / ${conv.xpBalance.toLocaleString()} Exp</span></div>
        <div class="stat-row"><span class="stat-label">XP:SP Ratio</span><span class="stat-value">${conv.rate}:1</span></div>
      </div>
      <div class="reg-section" style="margin-top:1rem;">
        <div class="reg-section-label">Event Splash Page Privacy</div>
        <label style="display:flex; align-items:center; gap:0.5rem; margin-top:0.6rem; cursor:pointer;">
          <input type="checkbox" id="chars-privacy-anonymous" ${c.isAnonymous ? 'checked' : ''}>
          Show me as Anonymous on the roster
        </label>
        <label style="display:flex; align-items:center; gap:0.5rem; margin-top:0.5rem; cursor:pointer;">
          <input type="checkbox" id="chars-privacy-hide-trades" ${c.hideTrades ? 'checked' : ''}>
          Hide my trades from the roster
        </label>
        <button class="btn-outline" style="margin-top:0.8rem;" onclick="chars_savePrivacy('${c.id}')">Save Privacy Settings</button>
        <p class="reg-success-note" id="chars-privacy-success" style="display:none;"></p>
        <p class="reg-error-note" id="chars-privacy-error" style="display:none;"></p>
      </div>
    </div>
    <div>
      <div style="display:flex; justify-content:flex-end; margin-bottom:0.5rem;">
        <button class="btn-outline" style="font-size:0.8rem; padding:0.35rem 0.7rem;" onclick="chars_toggleDatesLearned()">${showDatesLearned ? 'Hide' : 'Show'} Dates Learned</button>
      </div>
      <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Skill</th><th>Type</th><th>Focus</th><th>Level</th><th>SP</th>${showDatesLearned ? '<th>Learned</th>' : ''}</tr></thead>
        <tbody>
          ${c.skills.length ? c.skills.map(s => `<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.type)}</td><td>${escapeHtml(s.focus)}</td><td>${s.level}</td><td>${s.sp}</td>${showDatesLearned ? `<td>${fmtDate(s.learnedAt)}</td>` : ''}</tr>`).join('')
            : `<tr><td colspan="${showDatesLearned ? 6 : 5}">No skills chosen yet.</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

async function chars_savePrivacy(charId){
  const successEl = document.getElementById('chars-privacy-success');
  const errorEl = document.getElementById('chars-privacy-error');
  successEl.style.display = 'none';
  errorEl.style.display = 'none';

  const isAnonymous = document.getElementById('chars-privacy-anonymous').checked;
  const hideTrades = document.getElementById('chars-privacy-hide-trades').checked;

  const { error } = await membersSupabase.rpc('character_set_privacy', {
    p_character_id: charId, p_is_anonymous: isAnonymous, p_hide_trades: hideTrades
  });
  if(error){ errorEl.textContent = error.message; errorEl.style.display = 'block'; return; }

  const c = CHARACTERS.find(ch => ch.id === charId);
  if(c){ c.isAnonymous = isAnonymous; c.hideTrades = hideTrades; }

  successEl.textContent = 'Privacy settings saved.';
  successEl.style.display = 'block';
}

function renderRemortArea(c){
  const el = document.getElementById('chars-remort-area');
  const req = remortByChar[c.id];

  if(!req || req.status === 'completed' || req.status === 'denied'){
    el.innerHTML = `<button class="btn-outline" onclick="chars_requestRemort('${c.id}')">Request Remort</button>`
      + (req && req.status === 'denied' ? ` <span class="page-subhead" style="display:inline;">Your last remort request for this character was denied. You can ask again.</span>` : '');
  } else if(req.status === 'pending'){
    el.innerHTML = `<p class="page-subhead" style="margin:0;">Remort requested - waiting on staff approval.</p>`;
  } else if(req.status === 'approved'){
    el.innerHTML = `<p class="page-subhead" style="margin:0;">Your remort was approved.
      <a href="character-edit.html?id=${c.id}"><button class="btn-gold" style="margin-left:0.5rem;">Edit This Character</button></a></p>`;
  }
}

async function chars_requestRemort(charId){
  const { error } = await membersSupabase.rpc('character_request_remort', { p_character_id: charId });
  if(error){ alert(error.message); return; }
  await loadRemortStatus();
  render();
}

async function loadRemortStatus(){
  if(CHARACTERS.length === 0){ remortByChar = {}; return; }
  const charIds = CHARACTERS.map(c => c.id);
  const { data } = await membersSupabase
    .from('character_remort_requests')
    .select('id, character_id, status, requested_at')
    .in('character_id', charIds)
    .order('requested_at', { ascending: false });

  remortByChar = {};
  (data || []).forEach(r => { if(!remortByChar[r.character_id]) remortByChar[r.character_id] = r; });
}

async function loadCharacters(){
  const { data: chars, error } = await membersSupabase
    .from('characters')
    .select('id, name, race, pronouns, birthday, starting_sp, social_class, created_at, is_anonymous, hide_trades')
    .eq('player_id', window.faCurrentUser.id)
    .order('created_at', { ascending: true });

  if(error || !chars){
    document.getElementById('chars-char-panel').innerHTML = `<p class="reg-error-note">Couldn't load your characters. Refresh to try again.</p>`;
    return;
  }

  const { data: skillRows } = await membersSupabase
    .from('character_skills')
    .select('character_id, category, skill_name, focus, level, sp_cost, created_at')
    .eq('player_id', window.faCurrentUser.id);

  CHARACTERS = chars.map(ch => ({
    id: ch.id,
    name: ch.name,
    race: ch.race,
    pronouns: ch.pronouns,
    birthday: ch.birthday,
    startingSp: ch.starting_sp,
    socialClass: ch.social_class,
    isAnonymous: !!ch.is_anonymous,
    hideTrades: !!ch.hide_trades,
    skills: (skillRows || [])
      .filter(sk => sk.character_id === ch.id)
      .map(sk => ({ name: sk.skill_name, type: sk.category, focus: sk.focus || '', level: sk.level, sp: sk.sp_cost, learnedAt: sk.created_at }))
  }));

  await Promise.all(CHARACTERS.map(async ch => {
    const { data: xp } = await membersSupabase.rpc('xp_my_character_balance', { p_character_id: ch.id });
    xpByChar[ch.id] = xp || 0;
  }));

  await loadRemortStatus();

  activeCharId = CHARACTERS.length ? CHARACTERS[0].id : null;
  render();
}

window.chars_selectChar = chars_selectChar;
window.chars_requestRemort = chars_requestRemort;
window.chars_toggleDatesLearned = chars_toggleDatesLearned;
window.chars_savePrivacy = chars_savePrivacy;

document.addEventListener('fa-members-ready', async () => {
  await loadCharacters();
});
})();
</script>

</body>
</html>
