<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spellbook - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Spellbook - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/spellbook.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Spellbook - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.sb-source-note{
  font-family: 'EB Garamond', serif;
  font-size: 0.85rem;
  font-style: italic;
  color: var(--brown-dark);
  margin: 0 0 0.9rem;
}
.sb-known-row{ opacity: 0.55; }

.sb-print-btn-wrap{ margin: -0.4rem 0 1.2rem; }

#sb-print-area{ display:none; }

.sb-print-title{
  font-family: 'Cinzel', serif;
  color: #000;
  text-align:center;
  margin: 0 0 0.3in;
}

.sb-print-grid{
  display:flex;
  flex-wrap:wrap;
  gap: 0.18in;
  justify-content:center;
}

.sb-spell-card{
  position:relative;
  width: 3.5in;
  height: 2in;
  box-sizing:border-box;
  padding: 0.3in 0.26in 0.13in;
  border: 1px solid var(--gold-dark);
  background: var(--cream);
  color: var(--brown-dark);
  font-family: 'EB Garamond', serif;
  break-inside: avoid;
  page-break-inside: avoid;
  overflow: hidden;
  display:flex;
  flex-direction:column;
}
.sb-corner{ position:absolute; width: 30px; height: 30px; }
.sb-corner-tl{ top: 0.07in; left: 0.07in; }
.sb-corner-tr{ top: 0.07in; right: 0.07in; }
.sb-corner-bl{ bottom: 0.07in; left: 0.07in; }
.sb-corner-br{ bottom: 0.07in; right: 0.07in; }

.sb-spell-card-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap: 0.4rem;
}
.sb-spell-card h3{
  font-family: 'Cinzel', serif;
  font-size: 0.92rem;
  margin: 0;
  line-height: 1.15;
  color: var(--brown-dark);
}
.sb-spell-card-level{
  font-family: 'Cinzel', serif;
  font-size: 0.56rem;
  font-weight:700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gold-dark);
  white-space:nowrap;
}
.sb-spell-card-incant{
  font-style: italic;
  font-size: 0.66rem;
  line-height: 1.15;
  margin: 0.1rem 0 0.2rem;
}
.sb-spell-card-stats{
  display:flex;
  flex-wrap:wrap;
  gap: 0.05rem 0.5rem;
  border-top: 1px dotted var(--gold-dark);
  border-bottom: 1px dotted var(--gold-dark);
  padding: 0.12rem 0;
  margin-bottom: 0.2rem;
}
.sb-spell-card-stats div{ font-size: 0.58rem; white-space:nowrap; }
.sb-spell-card-stats span{
  font-family: 'Cinzel', serif;
  font-size: 0.5rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-right: 0.15rem;
}
.sb-spell-card-desc{
  font-size: 0.6rem;
  line-height: 1.2;
  flex: 1;
  overflow: hidden;
}
.sb-spell-card-desc.sb-desc-md{ font-size: 0.5rem; line-height: 1.14; }
.sb-spell-card-desc.sb-desc-sm{ font-size: 0.42rem; line-height: 1.05; }

@media print{
  div[data-include="partials/header.html"],
  div[data-include="partials/members-sidebar.html"],
  div[data-include="partials/footer.html"],
  .page-title,
  #sb-char-switcher,
  .sb-print-btn-wrap,
  #sb-content{ display:none !important; }
  .dashboard{ display:block !important; }
  #sb-print-area{ display:block; width:100%; }
  @page{ margin: 0.3in; }
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<div class="char-switcher" id="sb-char-switcher"></div>

<h1 class="page-title">Spellbook</h1>

<div class="sb-print-btn-wrap" id="sb-print-btn-wrap" style="display:none;">
<button class="btn-outline" onclick="sb_printCards()">Print Spell Cards</button>
</div>

<div id="sb-content"></div>

<div id="sb-print-area"></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script src="js/spellbook-data.js"></script>
<script>
(function(){
let CHARACTERS = [];
let activeCharId = null;
let COMPENDIUM = null;
let DEITIES = null;
let LOAD_ERROR = null;
let MAGERY_FILTER = 'all';

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><path d="M12 2 3 6.5v6C3 17 7 21 12 22c5-1 9-5 9-9.5v-6L12 2Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 12h6M12 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function costLabel(spell, unit, surcharge){
  const total = (spell.energy || 0) + (surcharge || 0);
  return total + ' ' + unit;
}

// Four corner ornaments (eye / sunburst / orb / crescent moon) for the
// printable spell cards, each self-contained artwork oriented for its own
// corner so they can just be dropped in without any rotation math.
const SB_CORNER_TL = `
<svg class="sb-corner sb-corner-tl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<line x1="34" y1="9" x2="70" y2="9" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="34" y1="13" x2="70" y2="13" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="9" y1="34" x2="9" y2="70" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="13" y1="34" x2="13" y2="70" stroke="var(--gold-dark)" stroke-width="1.3"/>
<rect x="50.5" y="8.5" width="5" height="5" transform="rotate(45 53 11)" fill="var(--gold-dark)"/>
<rect x="8.5" y="50.5" width="5" height="5" transform="rotate(45 11 53)" fill="var(--gold-dark)"/>
<circle cx="21" cy="21" r="14.5" fill="var(--cream)" stroke="var(--gold-dark)" stroke-width="1.5"/>
<path d="M9 21 Q21 11 33 21 Q21 31 9 21 Z" fill="none" stroke="var(--gold-dark)" stroke-width="1.3"/>
<circle cx="21" cy="21" r="3.2" fill="var(--gold-dark)"/>
</svg>`;

const SB_CORNER_TR = `
<svg class="sb-corner sb-corner-tr" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<line x1="30" y1="9" x2="66" y2="9" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="30" y1="13" x2="66" y2="13" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="91" y1="34" x2="91" y2="70" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="87" y1="34" x2="87" y2="70" stroke="var(--gold-dark)" stroke-width="1.3"/>
<rect x="44.5" y="8.5" width="5" height="5" transform="rotate(45 47 11)" fill="var(--gold-dark)"/>
<rect x="86.5" y="50.5" width="5" height="5" transform="rotate(45 89 53)" fill="var(--gold-dark)"/>
<circle cx="79" cy="21" r="14.5" fill="var(--cream)" stroke="var(--gold-dark)" stroke-width="1.5"/>
<g stroke="var(--gold-dark)" stroke-width="1.3">
<line x1="79" y1="9.5" x2="79" y2="13.5"/>
<line x1="79" y1="28.5" x2="79" y2="32.5"/>
<line x1="67.5" y1="21" x2="71.5" y2="21"/>
<line x1="86.5" y1="21" x2="90.5" y2="21"/>
<line x1="70.2" y1="12.2" x2="73" y2="15"/>
<line x1="85" y1="27" x2="87.8" y2="29.8"/>
<line x1="87.8" y1="12.2" x2="85" y2="15"/>
<line x1="73" y1="27" x2="70.2" y2="29.8"/>
</g>
<circle cx="79" cy="21" r="3.6" fill="var(--gold-dark)"/>
</svg>`;

const SB_CORNER_BL = `
<svg class="sb-corner sb-corner-bl" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<line x1="34" y1="91" x2="70" y2="91" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="34" y1="87" x2="70" y2="87" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="9" y1="30" x2="9" y2="66" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="13" y1="30" x2="13" y2="66" stroke="var(--gold-dark)" stroke-width="1.3"/>
<rect x="50.5" y="86.5" width="5" height="5" transform="rotate(45 53 89)" fill="var(--gold-dark)"/>
<rect x="8.5" y="44.5" width="5" height="5" transform="rotate(45 11 47)" fill="var(--gold-dark)"/>
<circle cx="21" cy="79" r="14.5" fill="var(--brown-dark)" stroke="var(--gold-dark)" stroke-width="1.5"/>
</svg>`;

const SB_CORNER_BR = `
<svg class="sb-corner sb-corner-br" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<line x1="30" y1="91" x2="66" y2="91" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="30" y1="87" x2="66" y2="87" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="91" y1="30" x2="91" y2="66" stroke="var(--gold-dark)" stroke-width="1.3"/>
<line x1="87" y1="30" x2="87" y2="66" stroke="var(--gold-dark)" stroke-width="1.3"/>
<rect x="44.5" y="86.5" width="5" height="5" transform="rotate(45 47 89)" fill="var(--gold-dark)"/>
<rect x="86.5" y="44.5" width="5" height="5" transform="rotate(45 89 47)" fill="var(--gold-dark)"/>
<circle cx="79" cy="79" r="14.5" fill="var(--cream)" stroke="var(--gold-dark)" stroke-width="1.5"/>
<path d="M85.5 68.5a11.5 11.5 0 1 0 0 21 9 9 0 0 1 0-21Z" fill="var(--gold-dark)"/>
</svg>`;

// Every spell a character actually has -- Clerical Investment's automatic
// grants (tagged with their domain and SE surcharge) plus whatever they've
// marked known through Magery (ME) -- deduped so a spell reachable through
// both shows once, at its Clerical (free-er) source.
function sb_buildCardList(c){
  const cards = [];
  const seen = new Set();

  if(c.hasClerical && DEITIES[c.ciFocus]){
    window.spellbookClericalSpells(DEITIES, c.ciFocus, c.ciLevel).forEach(g => {
      const spell = COMPENDIUM[g.name.toLowerCase()];
      if(!spell || seen.has(spell.name.toLowerCase())) return;
      seen.add(spell.name.toLowerCase());
      const source = g.surcharge === 0 ? 'Home Domain'
        : (g.surcharge === window.SPELLBOOK_SHARED_DOMAIN_SURCHARGE ? 'Shared Domain' : 'Opposed Domain');
      cards.push({ spell, unit: 'SE', surcharge: g.surcharge, source });
    });
  }

  if(c.hasMagery){
    Object.values(COMPENDIUM).forEach(spell => {
      if(!c.knownSpells.has(spell.name.toLowerCase()) || seen.has(spell.name.toLowerCase())) return;
      seen.add(spell.name.toLowerCase());
      cards.push({ spell, unit: 'ME', surcharge: 0, source: 'Magery' });
    });
  }

  return cards.sort((a, b) => a.spell.level - b.spell.level || a.spell.name.localeCompare(b.spell.name));
}

// Most spell descriptions are a sentence or two and read fine at full
// size, but a handful (Resurrect, Command, Contingency...) run 500-750
// characters -- a fixed business-card size can't grow to fit those, so
// the description shrinks in tiers instead of silently truncating.
function sbDescSizeClass(desc){
  const len = (desc || '').length;
  if(len > 380) return 'sb-desc-sm';
  if(len > 220) return 'sb-desc-md';
  return '';
}

function sbCardHtml({ spell, unit, surcharge, source }){
  const cost = (spell.energy || 0) + (surcharge || 0);
  return `
    <div class="sb-spell-card">
      ${SB_CORNER_TL}${SB_CORNER_TR}${SB_CORNER_BL}${SB_CORNER_BR}
      <div class="sb-spell-card-head">
        <h3>${escapeHtml(spell.name)}</h3>
        <span class="sb-spell-card-level">Level ${spell.level}</span>
      </div>
      <p class="sb-spell-card-incant">&ldquo;${escapeHtml(spell.incant)}&rdquo;</p>
      <div class="sb-spell-card-stats">
        <div><span>Cost</span>${cost} ${unit}</div>
        <div><span>Source</span>${escapeHtml(source)}</div>
        <div><span>Duration</span>${escapeHtml(spell.duration || '-')}</div>
        <div><span>Category</span>${escapeHtml(spell.category || '-')}</div>
        <div><span>MEL</span>${escapeHtml(spell.mel || '0')}</div>
        <div><span>Mix</span>${escapeHtml(spell.mix || 'No')}</div>
      </div>
      <p class="sb-spell-card-desc ${sbDescSizeClass(spell.desc)}">${escapeHtml(spell.desc)}</p>
    </div>
  `;
}

function sb_printCards(){
  const c = CHARACTERS.find(ch => ch.id === activeCharId);
  if(!c) return;

  const cards = sb_buildCardList(c);
  document.getElementById('sb-print-area').innerHTML = `
    <h2 class="sb-print-title">${escapeHtml(c.name)}'s Spellbook</h2>
    <div class="sb-print-grid">${cards.map(sbCardHtml).join('')}</div>
  `;
  window.print();
}

function sb_selectChar(id){
  activeCharId = id;
  MAGERY_FILTER = 'all';
  render();
}

function sb_setMageryFilter(filter){
  MAGERY_FILTER = filter;
  render();
}

async function sb_learnSpell(characterId, spellName){
  const errorEl = document.getElementById('sb-error');
  const { error } = await membersSupabase.rpc('character_learn_spell', {
    p_character_id: characterId,
    p_spell_name: spellName
  });
  if(error){ if(errorEl){ errorEl.textContent = error.message; errorEl.style.display = 'block'; } return; }

  const c = CHARACTERS.find(ch => ch.id === characterId);
  if(c) c.knownSpells.add(spellName.toLowerCase());
  render();
}

async function sb_unlearnSpell(characterId, spellName){
  const errorEl = document.getElementById('sb-error');
  const { error } = await membersSupabase.rpc('character_unlearn_spell', {
    p_character_id: characterId,
    p_spell_name: spellName
  });
  if(error){ if(errorEl){ errorEl.textContent = error.message; errorEl.style.display = 'block'; } return; }

  const c = CHARACTERS.find(ch => ch.id === characterId);
  if(c) c.knownSpells.delete(spellName.toLowerCase());
  render();
}

function domainTag(source){
  if(source === 'home') return '<span class="status-pill approved">Home</span>';
  if(source === 'shared') return '<span class="status-pill pending">Shared Domain</span>';
  return '<span class="status-pill denied">Opposed Domain</span>';
}

function renderClericalPanel(c){
  const deity = c.ciFocus;
  const home = DEITIES[deity];
  if(!home){
    return `
      <div class="panel">
        <div class="panel-head"><h2>Clerical Spells</h2></div>
        <div class="panel-body">
          <p class="sb-source-note">Couldn't find a lore article for ${escapeHtml(deity || 'this character\'s deity')}. Ask Lore staff to check the deity name matches a published Deities article.</p>
        </div>
      </div>
    `;
  }

  const granted = window.spellbookClericalSpells(DEITIES, deity, c.ciLevel)
    .map(g => {
      const spell = COMPENDIUM[g.name.toLowerCase()];
      const source = g.surcharge === 0 ? 'home' : (g.surcharge === window.SPELLBOOK_SHARED_DOMAIN_SURCHARGE ? 'shared' : 'opposed');
      return { g, spell, source };
    })
    .filter(row => row.spell)
    .sort((a, b) => a.spell.level - b.spell.level || a.spell.name.localeCompare(b.spell.name));

  const rows = granted.map(({ g, spell, source }) => `
    <tr>
      <td>${escapeHtml(spell.name)}</td>
      <td>${spell.level}</td>
      <td>${escapeHtml(spell.incant)}</td>
      <td>${costLabel(spell, 'SE', g.surcharge)}</td>
      <td>${domainTag(source)}</td>
    </tr>
  `).join('');

  return `
    <div class="panel">
      <div class="panel-head"><h2>Clerical Spells</h2></div>
      <div class="panel-body">
        <p class="sb-source-note">Automatically granted by Clerical Investment (Level ${c.ciLevel}, worshipping ${escapeHtml(deity)}). Shared Domain costs +${window.SPELLBOOK_SHARED_DOMAIN_SURCHARGE} SE, Opposed Domain costs +${window.SPELLBOOK_OPPOSED_DOMAIN_SURCHARGE} SE.</p>
        ${granted.length ? `
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Spell</th><th>Level</th><th>Incant</th><th>Cost</th><th>Domain</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        ` : emptyState('No spells found for this deity yet.')}
      </div>
    </div>
  `;
}

function renderMageryPanel(c){
  const allSpells = Object.values(COMPENDIUM).sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
  const visible = allSpells.filter(spell => {
    const known = c.knownSpells.has(spell.name.toLowerCase());
    if(MAGERY_FILTER === 'known') return known;
    if(MAGERY_FILTER === 'unknown') return !known;
    return true;
  });

  const rows = visible.map(spell => {
    const known = c.knownSpells.has(spell.name.toLowerCase());
    const nameEsc = spell.name.replace(/'/g, "\\'");
    return `
      <tr class="${known ? 'sb-known-row' : ''}">
        <td>${escapeHtml(spell.name)}</td>
        <td>${spell.level}</td>
        <td>${escapeHtml(spell.incant)}</td>
        <td>${costLabel(spell, 'ME', 0)}</td>
        <td>${known
          ? `<button class="btn-outline" onclick="sb_unlearnSpell('${c.id}', '${nameEsc}')">Forget</button>`
          : `<button class="btn-gold" onclick="sb_learnSpell('${c.id}', '${nameEsc}')">Mark Known</button>`}
        </td>
      </tr>
    `;
  }).join('');

  return `
    <div class="panel">
      <div class="panel-head"><h2>Magery Spellbook</h2></div>
      <div class="panel-body">
        <p class="sb-source-note">Mark the spells this character personally knows from Magery.</p>
        <div class="day-toggle">
          <button class="${MAGERY_FILTER === 'all' ? 'active' : ''}" onclick="sb_setMageryFilter('all')">Show All</button>
          <button class="${MAGERY_FILTER === 'known' ? 'active' : ''}" onclick="sb_setMageryFilter('known')">Show Known</button>
          <button class="${MAGERY_FILTER === 'unknown' ? 'active' : ''}" onclick="sb_setMageryFilter('unknown')">Show Not Known</button>
        </div>
        ${visible.length ? `
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Spell</th><th>Level</th><th>Incant</th><th>Cost</th><th></th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        ` : emptyState('No spells match this filter.')}
      </div>
    </div>
  `;
}

function render(){
  const switcher = document.getElementById('sb-char-switcher');
  switcher.innerHTML = CHARACTERS.map(ch =>
    `<button class="${ch.id===activeCharId?'active':''}" onclick="sb_selectChar('${ch.id}')">${escapeHtml(ch.name)}</button>`
  ).join('');

  const content = document.getElementById('sb-content');
  const printBtnWrap = document.getElementById('sb-print-btn-wrap');
  const c = CHARACTERS.find(ch => ch.id === activeCharId);

  if(!c){
    printBtnWrap.style.display = 'none';
    content.innerHTML = `<div class="panel"><div class="panel-body">${emptyState('You have no characters yet.')}</div></div>`;
    return;
  }

  if(LOAD_ERROR){
    printBtnWrap.style.display = 'none';
    content.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-error-note">Couldn't load the Spellbook: ${escapeHtml(LOAD_ERROR)}</p></div></div>`;
    return;
  }

  if(!c.hasMagery && !c.hasClerical){
    printBtnWrap.style.display = 'none';
    content.innerHTML = `<div class="panel"><div class="panel-body">${emptyState('This character has no Magery or Clerical Investment yet.')}</div></div>`;
    return;
  }

  printBtnWrap.style.display = sb_buildCardList(c).length ? 'block' : 'none';

  let html = '';
  if(c.hasClerical) html += renderClericalPanel(c);
  if(c.hasMagery) html += renderMageryPanel(c);
  html += `<p class="reg-error-note" id="sb-error" style="display:none;"></p>`;

  content.innerHTML = html;
}

async function loadCharacterKnownSpells(c){
  const { data, error } = await membersSupabase
    .from('character_known_spells')
    .select('spell_name')
    .eq('character_id', c.id);
  c.knownSpells = new Set((error ? [] : (data || [])).map(r => r.spell_name.toLowerCase()));
}

async function loadCharacters(){
  const me = window.faCurrentUser.id;

  const [{ data: chars }, { data: skillRows }] = await Promise.all([
    membersSupabase.from('characters').select('id, name').eq('player_id', me).order('created_at', { ascending: true }),
    membersSupabase.from('character_skills').select('character_id, skill_name, focus, level').eq('player_id', me)
  ]);

  CHARACTERS = (chars || []).map(ch => {
    const skills = (skillRows || []).filter(sk => sk.character_id === ch.id);
    const magery = skills.find(sk => sk.skill_name === 'Magery');
    const clerical = skills.find(sk => sk.skill_name === 'Clerical Investment');
    return {
      id: ch.id,
      name: ch.name,
      hasMagery: !!magery,
      hasClerical: !!clerical,
      ciFocus: clerical ? clerical.focus : null,
      ciLevel: clerical ? clerical.level : 0,
      knownSpells: new Set()
    };
  });

  activeCharId = CHARACTERS.length ? CHARACTERS[0].id : null;

  await Promise.all(CHARACTERS.map(loadCharacterKnownSpells));

  render();
}

window.sb_selectChar = sb_selectChar;
window.sb_setMageryFilter = sb_setMageryFilter;
window.sb_learnSpell = sb_learnSpell;
window.sb_unlearnSpell = sb_unlearnSpell;
window.sb_printCards = sb_printCards;

document.addEventListener('fa-members-ready', async () => {
  try{
    const [compendium, deities] = await Promise.all([
      window.spellbookLoadCompendium(),
      window.spellbookLoadDeities()
    ]);
    COMPENDIUM = compendium;
    DEITIES = deities;
  } catch(err){
    LOAD_ERROR = err.message;
  }
  await loadCharacters();
});
})();
</script>
