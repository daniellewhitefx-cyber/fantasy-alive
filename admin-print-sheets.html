<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Sheets (Staff) - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Print Sheets (Staff) - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/admin-print-sheets.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Print Sheets (Staff) - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
#ps-print-area{ display:none; }

.print-sheet-page{
  font-family: 'EB Garamond', serif;
  color: #000;
  padding: 0.15in 0.1in;
}
.print-sheet-head{
  border-bottom: 1.5px solid #000;
  margin-bottom: 0.5rem;
  padding-bottom: 0.25rem;
}
.print-sheet-head h2{
  font-family: 'Cinzel', serif;
  font-size: 1.2rem;
  margin: 0 0 0.1rem;
  line-height: 1.1;
}
.print-sheet-player{
  font-style: italic;
  margin: 0;
  font-size: 0.8rem;
  line-height: 1.1;
}
.print-sheet-stats{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.25rem 0.8rem;
  margin-bottom: 0.6rem;
}
.print-sheet-stats div{
  display:flex;
  justify-content:space-between;
  border-bottom: 1px solid #ccc;
  padding-bottom: 0.1rem;
  font-size: 0.78rem;
  line-height: 1.2;
}
.print-sheet-stats span{ color:#444; }
.print-sheet-table{
  width:100%;
  border-collapse: collapse;
  font-size: 0.72rem;
}
.print-sheet-table th, .print-sheet-table td{
  border: 1px solid #ccc;
  padding: 0.15rem 0.35rem;
  text-align:left;
  line-height: 1.2;
}
.print-sheet-table th{ background:#eee; font-family:'Cinzel', serif; }
.print-sheet-skill-cols{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 0.5rem;
  align-items: start;
}

.kp-print-title{
  font-family: 'EB Garamond', serif;
  color: #000;
  padding: 0.15in 0.1in;
}
.kp-print-title h2{
  font-family: 'Cinzel', serif;
  font-size: 1.2rem;
  margin: 0 0 0.1rem;
  line-height: 1.1;
}
.kp-print-title p{
  font-style: italic;
  margin: 0 0 0.6rem;
  font-size: 0.8rem;
  line-height: 1.1;
}
.kp-print-table{
  width:100%;
  border-collapse: collapse;
  font-size: 0.75rem;
}
.kp-print-table th, .kp-print-table td{
  border: 1px solid #ccc;
  padding: 0.2rem 0.4rem;
  text-align:left;
  line-height: 1.2;
}
.kp-print-table th{ background:#eee; font-family:'Cinzel', serif; }
.kp-print-table td{ font-family: Arial, Helvetica, sans-serif; }
.kp-print-table td.kp-checkbox{ text-align:center; font-size: 1rem; }
.kp-print-table tr{ page-break-inside: avoid; }

@media print{
  @page{ margin: 0.25in; }
  div[data-include="partials/header.html"],
  div[data-include="partials/members-sidebar.html"],
  div[data-include="partials/footer.html"],
  .page-title,
  #ps-blocked-notice,
  #ps-wrap{ display:none !important; }
  .dashboard{ display:block !important; }
  #ps-print-area{ display:block; width:100%; }
  .print-sheet-page{ page-break-after: always; }
  .print-sheet-page:last-child{ page-break-after: auto; }
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Print Sheets</h1>

<div class="reg-already-registered" id="ps-blocked-notice" style="display:none;">
<h3>Staff access required</h3>
<p>This page is only available to site admins and Logistics.</p>
</div>

<div id="ps-wrap" style="display:none;">

<div class="panel">
<div class="panel-head"><h2>Print Setup</h2></div>
<div class="panel-body">
<label class="field-label" for="ps-event-select">Event</label>
<select id="ps-event-select" onchange="ps_onEventChange()"></select>
</div>
</div>

<div class="panel">
<div class="panel-head"><h2>Character Sheets</h2></div>
<div class="panel-body">
<div id="ps-char-summary"></div>
<button class="btn-gold" id="ps-print-btn" style="margin-top:1rem;" onclick="ps_printAll()" disabled>Print All Character Sheets</button>
</div>
</div>

<div class="panel">
<div class="panel-head"><h2>Meal Checklist</h2></div>
<div class="panel-body">
<div id="ps-kitchen-summary"></div>
<button class="btn-gold" id="ps-meals-print-btn" style="margin-top:1rem;" onclick="ps_printMeals()" disabled>Print Meal Checklist</button>
</div>
</div>

<div class="panel">
<div class="panel-head"><h2>Dietary Restrictions</h2></div>
<div class="panel-body">
<button class="btn-gold" id="ps-diet-print-btn" onclick="ps_printDietary()" disabled>Print Dietary Restrictions</button>
</div>
</div>

</div>

<div id="ps-print-area"></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let ROSTER = [];
let UNMATCHED = [];
let DINERS = [];
const MEAL_SLOTS = ['Saturday Breakfast', 'Saturday Lunch', 'Saturday Dinner', 'Sunday Breakfast'];

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function selectedEventLabel(){
  const sel = document.getElementById('ps-event-select');
  return sel.selectedOptions.length ? sel.selectedOptions[0].textContent : '';
}

function ps_doPrint(html){
  document.getElementById('ps-print-area').innerHTML = html;
  setTimeout(() => window.print(), 200);
}

/* ---------- character sheets ---------- */

const RACE_STATS = {
  'Curtainborn': { baseLp: 4, maxLp: 10, baseResurrections: 2, baseSe: 5, baseMe: 0 },
  'D\'Shunn': { baseLp: 4, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Dwarf': { baseLp: 6, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Elf': { baseLp: 4, maxLp: 10, baseResurrections: 1, baseSe: 0, baseMe: 5 },
  'Gnome': { baseLp: 4, maxLp: 8, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Goblin': { baseLp: 4, maxLp: 8, baseResurrections: 3, baseSe: 0, baseMe: 0 },
  'Human': { baseLp: 5, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Lizardfolk': { baseLp: 6, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Malkin': { baseLp: 6, maxLp: 12, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Minotaur': { baseLp: 8, maxLp: 20, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Orc': { baseLp: 7, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 }
};
const MAX_RESURRECTIONS = 5;

function skillLevelTotal(skills, name){
  return skills.filter(s => (s.name || '').trim().toLowerCase() === name.toLowerCase()).reduce((sum, s) => sum + (s.level || 0), 0);
}
function hasSkill(skills, name){
  return skills.some(s => (s.name || '').trim().toLowerCase() === name.toLowerCase());
}
function deriveStats(race, skills){
  const r = RACE_STATS[race] || { baseLp: 5, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 };
  const lp = Math.min(r.baseLp + skillLevelTotal(skills, 'Physical Endurance'), r.maxLp);
  const resurrectionsLeft = Math.min(r.baseResurrections + skillLevelTotal(skills, 'Spiritual Endurance'), MAX_RESURRECTIONS);
  const se = r.baseSe + skillLevelTotal(skills, 'Spiritual Energy') + (hasSkill(skills, 'Theology') ? 1 : 0);
  const me = r.baseMe + skillLevelTotal(skills, 'Magical Energy') + (hasSkill(skills, 'Magery') ? 1 : 0);
  return { lp, se, me, resurrectionsLeft };
}
function xpPerSp(currentSp){
  if(currentSp <= 40) return 10;
  if(currentSp <= 80) return 15;
  if(currentSp <= 150) return 20;
  if(currentSp <= 200) return 25;
  return 30;
}

function populateEventSelect(){
  const sel = document.getElementById('ps-event-select');
  sel.innerHTML = (window.FA_EVENTS || []).map(e => `<option value="${escapeHtml(e.value)}">${escapeHtml(e.longLabel)}</option>`).join('');
  if(window.FA_NEXT_EVENT) sel.value = window.FA_NEXT_EVENT.value;
}

function ps_onEventChange(){
  ps_loadRoster();
  ps_loadKitchen();
}

async function ps_loadRoster(){
  const summaryEl = document.getElementById('ps-char-summary');
  const printBtn = document.getElementById('ps-print-btn');
  printBtn.disabled = true;
  ROSTER = [];
  UNMATCHED = [];

  const eventSlug = document.getElementById('ps-event-select').value;
  const eventLabel = selectedEventLabel();
  if(!eventSlug) return;

  summaryEl.innerHTML = '<p class="reg-empty-note">Loading registrants&hellip;</p>';

  let registrants;
  try{
    const { data, error } = await membersSupabase.rpc('staff_event_registrations', { p_event_slug: eventSlug });
    if(error) throw new Error(error.message);
    registrants = (data || []).filter(r => r.who === 'character');
  } catch(err){
    summaryEl.innerHTML = `<p class="reg-error-note">Couldn't load the registration list: ${escapeHtml(err.message)}.</p>`;
    return;
  }

  if(registrants.length === 0){
    summaryEl.innerHTML = emptyState('No one is registered as a character for this event yet.');
    return;
  }

  registrants.forEach(r => {
    if(!r.character_id){ UNMATCHED.push(r); return; }
    if(!ROSTER.some(x => x.id === r.character_id)){
      ROSTER.push({ id: r.character_id, name: r.character_name, playerName: r.player_name });
    }
  });

  ROSTER.sort((a, b) => a.name.localeCompare(b.name));

  let summaryHtml = `<p><strong>${ROSTER.length}</strong> character${ROSTER.length === 1 ? '' : 's'} found for ${escapeHtml(eventLabel)}.</p>`;
  if(UNMATCHED.length){
    summaryHtml += `<p class="reg-error-note">${UNMATCHED.length} registrant${UNMATCHED.length === 1 ? '' : 's'} couldn't be matched to a character: ${UNMATCHED.map(r => escapeHtml(r.character_name || 'unknown') + ' (' + escapeHtml(r.player_name || 'unknown player') + ')').join(', ')}</p>`;
  }
  summaryEl.innerHTML = summaryHtml;
  printBtn.disabled = ROSTER.length === 0;
}

async function ps_printAll(){
  const printBtn = document.getElementById('ps-print-btn');
  printBtn.disabled = true;
  printBtn.textContent = 'Preparing…';

  const ids = ROSTER.map(r => r.id);
  const { data: sheets, error } = await membersSupabase.rpc('admin_character_sheets', { p_character_ids: ids });

  printBtn.disabled = false;
  printBtn.textContent = 'Print All Character Sheets';

  if(error){ alert('Could not load character sheets: ' + error.message); return; }

  const sheetById = {};
  (sheets || []).forEach(s => { sheetById[s.id] = s; });

  const html = ROSTER.map(r => {
    const s = sheetById[r.id];
    if(!s) return '';
    const skills = s.skills || [];
    const spent = skills.reduce((sum, sk) => sum + (sk.sp || 0), 0);
    const stats = deriveStats(s.race, skills);
    const ratio = xpPerSp(s.starting_sp) + ':1';
    return `
      <div class="print-sheet-page">
        <div class="print-sheet-head">
          <h2>${escapeHtml(s.name)}</h2>
          <p class="print-sheet-player">Played by ${escapeHtml(r.playerName)}</p>
        </div>
        <div class="print-sheet-stats">
          <div><span>Race</span><strong>${escapeHtml(s.race || '-')}</strong></div>
          <div><span>Social Class</span><strong>${escapeHtml(s.social_class || '-')}</strong></div>
          <div><span>Birthday</span><strong>${escapeHtml(s.birthday || '-')}</strong></div>
          <div><span>Skill Points</span><strong>${spent}/${s.starting_sp}</strong></div>
          <div><span>LP</span><strong>${stats.lp}</strong></div>
          <div><span>SE/ME</span><strong>${stats.se}/${stats.me}</strong></div>
          <div><span>Resurrections Left</span><strong>${stats.resurrectionsLeft}</strong></div>
          <div><span>Experience</span><strong>${s.xp}</strong></div>
          <div><span>XP:SP Ratio</span><strong>${ratio}</strong></div>
        </div>
        ${printSkillColumnsHtml(skills)}
      </div>
    `;
  }).join('');

  ps_doPrint(html);
}

// Skill/Focus/Level only (Type and SP dropped) split across two side-by-side
// tables instead of one tall single-column list, so a character with a full
// build fits in roughly half the vertical space on the printed sheet.
function printSkillColumnsHtml(skills){
  if(!skills.length) return '<p class="print-sheet-player">No skills chosen.</p>';

  const mid = Math.ceil(skills.length / 2);
  const columns = [skills.slice(0, mid), skills.slice(mid)];

  const tableHtml = col => `
    <table class="print-sheet-table">
      <thead><tr><th>Skill</th><th>Focus</th><th>Level</th></tr></thead>
      <tbody>
        ${col.map(sk => `<tr><td>${escapeHtml(sk.name)}</td><td>${escapeHtml(sk.focus || '')}</td><td>${sk.level}</td></tr>`).join('')}
      </tbody>
    </table>
  `;

  return `<div class="print-sheet-skill-cols">${columns.map(tableHtml).join('')}</div>`;
}

/* ---------- kitchen sheets ---------- */

async function ps_loadKitchen(){
  const summaryEl = document.getElementById('ps-kitchen-summary');
  const mealsBtn = document.getElementById('ps-meals-print-btn');
  const dietBtn = document.getElementById('ps-diet-print-btn');
  mealsBtn.disabled = true;
  dietBtn.disabled = true;
  DINERS = [];

  const eventSlug = document.getElementById('ps-event-select').value;
  const eventLabel = selectedEventLabel();
  if(!eventSlug) return;

  summaryEl.innerHTML = '<p class="reg-empty-note">Loading diners&hellip;</p>';

  try{
    const { data, error } = await membersSupabase.rpc('staff_event_registrations', { p_event_slug: eventSlug });
    if(error) throw new Error(error.message);
    DINERS = (data || [])
      .filter(r => r.meal_name)
      .map(r => ({ name: r.character_name, playerName: r.player_name, allergies: r.allergy_notes, meals: r.meal_slots }))
      .sort((a, b) => a.name.localeCompare(b.name));
  } catch(err){
    summaryEl.innerHTML = `<p class="reg-error-note">Couldn't load the kitchen list: ${escapeHtml(err.message)}.</p>`;
    return;
  }

  const dietCount = DINERS.filter(d => d.allergies && d.allergies.trim()).length;

  if(DINERS.length === 0){
    summaryEl.innerHTML = emptyState('No one has a meal plan for this event yet.');
    return;
  }

  summaryEl.innerHTML = `<p><strong>${DINERS.length}</strong> diner${DINERS.length === 1 ? '' : 's'} with a meal plan, <strong>${dietCount}</strong> with a dietary restriction noted, for ${escapeHtml(eventLabel)}.</p>`;
  mealsBtn.disabled = false;
  dietBtn.disabled = dietCount === 0;
}

function ps_printMeals(){
  const eventLabel = selectedEventLabel();
  const rows = DINERS.map(d => {
    const cells = MEAL_SLOTS.map(slot => `<td class="kp-checkbox">${d.meals && d.meals[slot] ? '&#9744;' : ''}</td>`).join('');
    return `<tr><td>${escapeHtml(d.name)}</td><td>${escapeHtml(d.playerName)}</td>${cells}</tr>`;
  }).join('');

  ps_doPrint(`
    <div class="kp-print-title">
      <h2>Meal Checklist</h2>
      <p>${escapeHtml(eventLabel)}</p>
    </div>
    <table class="kp-print-table">
      <thead><tr><th>Character / Cast</th><th>Player</th>${MEAL_SLOTS.map(s => `<th>${escapeHtml(s)}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `);
}

function ps_printDietary(){
  const eventLabel = selectedEventLabel();
  const withDiet = DINERS.filter(d => d.allergies && d.allergies.trim());
  const rows = withDiet.map(d => `<tr><td>${escapeHtml(d.name)}</td><td>${escapeHtml(d.playerName)}</td><td>${escapeHtml(d.allergies)}</td></tr>`).join('');

  ps_doPrint(`
    <div class="kp-print-title">
      <h2>Dietary Restrictions</h2>
      <p>${escapeHtml(eventLabel)}</p>
    </div>
    <table class="kp-print-table">
      <thead><tr><th>Character / Cast</th><th>Player</th><th>Dietary Restriction / Allergy</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `);
}

window.ps_onEventChange = ps_onEventChange;
window.ps_printAll = ps_printAll;
window.ps_printMeals = ps_printMeals;
window.ps_printDietary = ps_printDietary;

document.addEventListener('fa-members-ready', async () => {
  const { data: allowed, error } = await membersSupabase.rpc('fa_is_logistics_or_admin');
  if(error || !allowed){
    document.getElementById('ps-blocked-notice').style.display = 'block';
    return;
  }
  document.getElementById('ps-wrap').style.display = 'block';
  populateEventSelect();
  await Promise.all([ps_loadRoster(), ps_loadKitchen()]);
});
})();
</script>

</body>
</html>
