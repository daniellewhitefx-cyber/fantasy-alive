<style>
#ps-print-area{ display:none; }

.print-sheet-page{
  font-family: 'EB Garamond', serif;
  color: #000;
  padding: 0.5in;
}
.print-sheet-head{
  border-bottom: 2px solid #000;
  margin-bottom: 0.9rem;
  padding-bottom: 0.5rem;
}
.print-sheet-head h2{
  font-family: 'Cinzel', serif;
  font-size: 1.6rem;
  margin: 0 0 0.2rem;
}
.print-sheet-player{
  font-style: italic;
  margin: 0;
  font-size: 0.95rem;
}
.print-sheet-stats{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem 1.2rem;
  margin-bottom: 1.2rem;
}
.print-sheet-stats div{
  display:flex;
  justify-content:space-between;
  border-bottom: 1px solid #999;
  padding-bottom: 0.2rem;
  font-size: 0.92rem;
}
.print-sheet-stats span{ color:#444; }
.print-sheet-table{
  width:100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}
.print-sheet-table th, .print-sheet-table td{
  border: 1px solid #999;
  padding: 0.3rem 0.5rem;
  text-align:left;
}
.print-sheet-table th{ background:#eee; font-family:'Cinzel', serif; }

@media print{
  body *{ visibility:hidden; }
  #ps-print-area, #ps-print-area *{ visibility:visible; }
  #ps-print-area{
    display:block;
    position:absolute;
    top:0; left:0;
    width:100%;
  }
  .print-sheet-page{ page-break-after: always; }
  .print-sheet-page:last-child{ page-break-after: auto; }
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Print Character Sheets</h1>

<div class="reg-already-registered" id="ps-blocked-notice" style="display:none;">
<h3>Staff access required</h3>
<p>This page is only available to site admins and Logistics.</p>
</div>

<div id="ps-wrap" style="display:none;">

<div class="panel">
<div class="panel-head"><h2>Print Setup</h2></div>
<div class="panel-body">
<label class="field-label" for="ps-event-select">Event</label>
<select id="ps-event-select" onchange="ps_loadRoster()"></select>

<div id="ps-summary" style="margin-top:1rem;"></div>

<button class="btn-gold" id="ps-print-btn" style="margin-top:1rem;" onclick="ps_printAll()" disabled>Print All Character Sheets</button>
<p class="reg-empty-note" style="margin-top:0.6rem;">This opens your browser's print dialog with one page per character already laid out. Choose a printer, or "Save as PDF" to export it instead.</p>
</div>
</div>

</div>

<div id="ps-print-area"></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let ROSTER = [];
let UNMATCHED = [];

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

const RACE_STATS = {
  'Curtainborn': { baseLp: 4, maxLp: 10, baseResurrections: 2, baseSe: 5, baseMe: 0 },
  'D\'Shunn': { baseLp: 4, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Dwarf': { baseLp: 6, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Elf': { baseLp: 4, maxLp: 10, baseResurrections: 1, baseSe: 0, baseMe: 5 },
  'Gnome': { baseLp: 4, maxLp: 8, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Goblin': { baseLp: 4, maxLp: 8, baseResurrections: 3, baseSe: 0, baseMe: 0 },
  'Human': { baseLp: 5, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Lizardfolk': { baseLp: 6, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Malkin': { baseLp: 6, maxLp: 12, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Minotaur': { baseLp: 8, maxLp: 20, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Orc': { baseLp: 7, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 }
};
const MAX_RESURRECTIONS = 5;

function skillLevelTotal(skills, name){
  return skills.filter(s => (s.name || '').trim().toLowerCase() === name.toLowerCase()).reduce((sum, s) => sum + (s.level || 0), 0);
}
function hasSkill(skills, name){
  return skills.some(s => (s.name || '').trim().toLowerCase() === name.toLowerCase());
}
function deriveStats(race, skills){
  const r = RACE_STATS[race] || { baseLp: 5, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 };
  const lp = Math.min(r.baseLp + skillLevelTotal(skills, 'Physical Endurance'), r.maxLp);
  const resurrectionsLeft = Math.min(r.baseResurrections + skillLevelTotal(skills, 'Spiritual Endurance'), MAX_RESURRECTIONS);
  const se = r.baseSe + skillLevelTotal(skills, 'Spiritual Energy') + (hasSkill(skills, 'Theology') ? 1 : 0);
  const me = r.baseMe + skillLevelTotal(skills, 'Magical Energy') + (hasSkill(skills, 'Magery') ? 1 : 0);
  return { lp, se, me, resurrectionsLeft };
}
function xpPerSp(currentSp){
  if(currentSp <= 40) return 10;
  if(currentSp <= 80) return 15;
  if(currentSp <= 150) return 20;
  if(currentSp <= 200) return 25;
  return 30;
}

function populateEventSelect(){
  const sel = document.getElementById('ps-event-select');
  sel.innerHTML = (window.FA_EVENTS || []).map(e => `<option value="${escapeHtml(e.label)}">${escapeHtml(e.longLabel)}</option>`).join('');
  if(window.FA_NEXT_EVENT) sel.value = window.FA_NEXT_EVENT.label;
}

async function ps_loadRoster(){
  const summaryEl = document.getElementById('ps-summary');
  const printBtn = document.getElementById('ps-print-btn');
  printBtn.disabled = true;
  ROSTER = [];
  UNMATCHED = [];

  const eventLabel = document.getElementById('ps-event-select').value;
  if(!eventLabel || !window.FA_REGISTRATION_ENDPOINT) return;

  summaryEl.innerHTML = '<p class="reg-empty-note">Loading registrants&hellip;</p>';

  let registrants;
  try{
    const res = await fetch(window.FA_REGISTRATION_ENDPOINT + '?action=list&event=' + encodeURIComponent(eventLabel), { cache: 'no-store' });
    if(!res.ok) throw new Error('Registration list request failed (' + res.status + ')');
    const data = await res.json();
    registrants = (data.registrants || []).filter(r => r.who === 'character');
  } catch(err){
    summaryEl.innerHTML = `<p class="reg-error-note">Couldn't load the registration list: ${escapeHtml(err.message)}. The registration Sheet needs a "list" action added (see supabase/print-sheets-schema.sql for the expected request/response shape).</p>`;
    return;
  }

  if(registrants.length === 0){
    summaryEl.innerHTML = emptyState('No one is registered as a character for this event yet.');
    return;
  }

  const [{ data: players, error: playersErr }, { data: chars, error: charsErr }] = await Promise.all([
    membersSupabase.rpc('admin_list_players_with_email'),
    membersSupabase.from('character_names').select('id, name, player_id')
  ]);
  if(playersErr || charsErr){
    summaryEl.innerHTML = `<p class="reg-error-note">Couldn't load players or characters to match against.</p>`;
    return;
  }

  const playerByEmail = {};
  (players || []).forEach(p => { if(p.email) playerByEmail[p.email.trim().toLowerCase()] = p; });

  const charsByPlayer = {};
  (chars || []).forEach(c => {
    (charsByPlayer[c.player_id] = charsByPlayer[c.player_id] || []).push(c);
  });

  registrants.forEach(r => {
    const player = playerByEmail[(r.email || '').trim().toLowerCase()];
    const myChars = player ? (charsByPlayer[player.id] || []) : [];
    const match = myChars.find(c => c.name.trim().toLowerCase() === (r.characterName || '').trim().toLowerCase());
    if(!player || !match){ UNMATCHED.push(r); return; }
    if(!ROSTER.some(x => x.id === match.id)){
      ROSTER.push({ id: match.id, name: match.name, playerName: player.display_name });
    }
  });

  ROSTER.sort((a, b) => a.name.localeCompare(b.name));

  let summaryHtml = `<p><strong>${ROSTER.length}</strong> character${ROSTER.length === 1 ? '' : 's'} found for ${escapeHtml(eventLabel)}.</p>`;
  if(UNMATCHED.length){
    summaryHtml += `<p class="reg-error-note">${UNMATCHED.length} registrant${UNMATCHED.length === 1 ? '' : 's'} couldn't be matched to a character: ${UNMATCHED.map(r => escapeHtml(r.characterName || 'unknown') + ' (' + escapeHtml(r.email || 'no email') + ')').join(', ')}</p>`;
  }
  summaryEl.innerHTML = summaryHtml;
  printBtn.disabled = ROSTER.length === 0;
}

async function ps_printAll(){
  const printBtn = document.getElementById('ps-print-btn');
  printBtn.disabled = true;
  printBtn.textContent = 'Preparing…';

  const ids = ROSTER.map(r => r.id);
  const { data: sheets, error } = await membersSupabase.rpc('admin_character_sheets', { p_character_ids: ids });

  printBtn.disabled = false;
  printBtn.textContent = 'Print All Character Sheets';

  if(error){ alert('Could not load character sheets: ' + error.message); return; }

  const sheetById = {};
  (sheets || []).forEach(s => { sheetById[s.id] = s; });

  const printArea = document.getElementById('ps-print-area');
  printArea.innerHTML = ROSTER.map(r => {
    const s = sheetById[r.id];
    if(!s) return '';
    const skills = s.skills || [];
    const spent = skills.reduce((sum, sk) => sum + (sk.sp || 0), 0);
    const stats = deriveStats(s.race, skills);
    const ratio = xpPerSp(s.starting_sp) + ':1';
    return `
      <div class="print-sheet-page">
        <div class="print-sheet-head">
          <h2>${escapeHtml(s.name)}</h2>
          <p class="print-sheet-player">Played by ${escapeHtml(r.playerName)}</p>
        </div>
        <div class="print-sheet-stats">
          <div><span>Race</span><strong>${escapeHtml(s.race || '-')}</strong></div>
          <div><span>Social Class</span><strong>${escapeHtml(s.social_class || '-')}</strong></div>
          <div><span>Birthday</span><strong>${escapeHtml(s.birthday || '-')}</strong></div>
          <div><span>Skill Points</span><strong>${spent}/${s.starting_sp}</strong></div>
          <div><span>LP</span><strong>${stats.lp}</strong></div>
          <div><span>SE/ME</span><strong>${stats.se}/${stats.me}</strong></div>
          <div><span>Resurrections Left</span><strong>${stats.resurrectionsLeft}</strong></div>
          <div><span>Experience</span><strong>${s.xp}</strong></div>
          <div><span>XP:SP Ratio</span><strong>${ratio}</strong></div>
        </div>
        <table class="print-sheet-table">
          <thead><tr><th>Skill</th><th>Type</th><th>Focus</th><th>Level</th><th>SP</th></tr></thead>
          <tbody>
            ${skills.length ? skills.map(sk => `<tr><td>${escapeHtml(sk.name)}</td><td>${escapeHtml(sk.type || '')}</td><td>${escapeHtml(sk.focus || '')}</td><td>${sk.level}</td><td>${sk.sp}</td></tr>`).join('') : '<tr><td colspan="5">No skills chosen.</td></tr>'}
          </tbody>
        </table>
      </div>
    `;
  }).join('');

  setTimeout(() => window.print(), 200);
}

window.ps_loadRoster = ps_loadRoster;
window.ps_printAll = ps_printAll;

document.addEventListener('fa-members-ready', async () => {
  const { data: allowed, error } = await membersSupabase.rpc('fa_is_logistics_or_admin');
  if(error || !allowed){
    document.getElementById('ps-blocked-notice').style.display = 'block';
    return;
  }
  document.getElementById('ps-wrap').style.display = 'block';
  populateEventSelect();
  await ps_loadRoster();
});
})();
</script>

</body>
