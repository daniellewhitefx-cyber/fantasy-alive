<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Events - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Past Events - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/past-events.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Past Events - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Past Events</h1>

<div class="panel">
<div class="panel-body">
<div id="pe-list"><p class="reg-empty-note">Loading&hellip;</p></div>
</div>
</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

document.addEventListener('fa-members-ready', async () => {
  const events = window.FA_PAST_EVENTS || [];
  const list = document.getElementById('pe-list');

  if(events.length === 0){
    list.innerHTML = emptyState('No past events yet.');
    return;
  }

  const me = window.faCurrentUser;

  const details = await Promise.all(events.map(async e => {
    const [ocRes, trainingRes, shopRes] = await Promise.all([
      membersSupabase.rpc('event_log_oc_summary', { p_event_slug: e.value }),
      membersSupabase.from('event_log_training_purchases').select('skill_name, focus, level, is_relevel, prev_level')
        .eq('player_id', me.id).eq('event_slug', e.value).order('created_at', { ascending: true }),
      membersSupabase.from('shoppe_purchases').select('item_name, quantity')
        .eq('player_id', me.id).eq('event_slug', e.value).order('created_at', { ascending: true })
    ]);
    return {
      oc: ocRes.data || { xp_spent: 0, copper_spent: 0 },
      training: trainingRes.data || [],
      shop: shopRes.data || []
    };
  }));

  list.innerHTML = events.map((e, i) => {
    const d = details[i];
    const noSpend = !d.oc.xp_spent && !d.oc.copper_spent;
    const ocLine = noSpend ? 'No OC spent this event.' : `${d.oc.xp_spent} OC spent on XP, ${d.oc.copper_spent} OC spent on Copper.`;

    const trainingLine = d.training.length ? 'Trained: ' + d.training.map(t => {
      const name = escapeHtml(t.skill_name) + (t.focus ? ' (' + escapeHtml(t.focus) + ')' : '');
      return t.is_relevel ? `${name} ${t.prev_level} &rarr; ${t.level}` : `${name} (new)`;
    }).join(', ') : '';

    const shopLine = d.shop.length
      ? 'Bought: ' + d.shop.map(p => `${p.quantity}x ${escapeHtml(p.item_name)}`).join(', ')
      : '';

    return `
      <div class="submitted-item">
        <div class="who">${escapeHtml(e.longLabel)}</div>
        <div>${ocLine}</div>
        ${trainingLine ? `<div>${trainingLine}</div>` : ''}
        ${shopLine ? `<div>${shopLine}</div>` : ''}
      </div>
    `;
  }).join('');
});
})();
</script>

</body>
</html>
