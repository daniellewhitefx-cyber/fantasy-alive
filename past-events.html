<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Past Events</h1>

<div class="panel">
<div class="panel-body">
<div id="pe-list"><p class="reg-empty-note">Loading&hellip;</p></div>
</div>
</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

document.addEventListener('fa-members-ready', async () => {
  const events = window.FA_PAST_EVENTS || [];
  const list = document.getElementById('pe-list');

  if(events.length === 0){
    list.innerHTML = emptyState('No past events yet.');
    return;
  }

  const summaries = await Promise.all(events.map(e =>
    membersSupabase.rpc('event_log_oc_summary', { p_event_slug: e.value }).then(r => r.data)
  ));

  list.innerHTML = events.map((e, i) => {
    const s = summaries[i] || { xp_spent: 0, copper_spent: 0 };
    const noSpend = !s.xp_spent && !s.copper_spent;
    return `<div class="submitted-item"><div class="who">${escapeHtml(e.longLabel)}</div>${noSpend ? 'No OC spent this event.' : `${s.xp_spent} OC spent on XP, ${s.copper_spent} OC spent on Copper.`}</div>`;
  }).join('');
});
})();
</script>

</body>
</html>
