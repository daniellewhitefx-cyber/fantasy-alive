<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backstory - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Backstory - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/backstory.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Backstory - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.bs-note{
  font-family: 'EB Garamond', serif;
  font-size: 0.95rem;
  line-height: 1.55;
  color: var(--brown);
  margin: 0 0 1rem;
}
.bs-rubric-card{
  border: 2px solid var(--gold-dark);
  background: var(--row-a);
  padding: 1rem 1.2rem;
  margin-bottom: 1rem;
}
.bs-rubric-card h3{
  font-family: 'Cinzel', serif;
  font-size: 1.05rem;
  margin: 0 0 0.5rem;
  color: var(--brown-dark);
}
.bs-rubric-card ul{
  font-family: 'EB Garamond', serif;
  margin: 0.6rem 0 0;
  padding-left: 1.2rem;
}
.bs-rubric-card li{ margin-bottom: 0.5rem; line-height: 1.45; }
.bs-textarea{
  width: 100%;
  min-height: 260px;
  font-family: 'EB Garamond', serif;
  font-size: 1rem;
  line-height: 1.5;
  padding: 0.8rem;
  border: 2px solid var(--gold-dark);
  border-radius: 4px;
  background: #fff;
  color: var(--brown);
  box-sizing: border-box;
  resize: vertical;
}
.bs-history-item{
  border-bottom: 1px solid var(--line);
  padding: 0.9rem 0;
}
.bs-history-item:last-child{ border-bottom: none; }
.bs-history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 0.4rem;
}
.bs-history-date{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.85rem;
  color: var(--brown-dark);
}
.bs-history-body{
  font-family: 'EB Garamond', serif;
  font-size: 0.92rem;
  line-height: 1.5;
  white-space: pre-wrap;
  color: var(--brown);
  margin: 0 0 0.5rem;
}
.bs-history-notes{
  font-family: 'EB Garamond', serif;
  font-size: 0.9rem;
  font-style: italic;
  background: var(--row-b);
  border-left: 3px solid var(--gold-dark);
  padding: 0.5rem 0.8rem;
}
.bs-xp-tag{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--good);
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<div class="char-switcher" id="bs-char-switcher"></div>

<h1 class="page-title">Backstory</h1>

<div id="bs-content"></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let CHARACTERS = [];
let activeCharId = null;

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><path d="M4 3.5A1.5 1.5 0 0 1 5.5 2h9L20 7.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 20.5Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11h8M8 15h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function fmtDateTime(iso){
  return new Date(iso).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function statusLabel(status){
  if(status === 'revision_requested') return 'Revision Requested';
  return status.charAt(0).toUpperCase() + status.slice(1);
}

function statusClass(status){
  if(status === 'revision_requested') return 'revision';
  return status;
}

function kindLabel(kind){
  if(kind === 'remort') return 'Remort';
  if(kind === 'resubmission') return 'Revision';
  return 'First Submission';
}

function nextSubmissionKind(c){
  const approvals = c.submissions.filter(s => s.status === 'approved');
  if(!approvals.length) return 'first';
  const lastApprovedAt = approvals.reduce((max, s) => new Date(s.decided_at) > new Date(max) ? s.decided_at : max, approvals[0].decided_at);
  if(c.lastRemortAt && new Date(c.lastRemortAt) > new Date(lastApprovedAt)) return 'remort';
  return 'resubmission';
}

function bs_selectChar(id){
  activeCharId = id;
  render();
}

async function bs_submit(){
  const c = CHARACTERS.find(ch => ch.id === activeCharId);
  if(!c) return;

  const errorEl = document.getElementById('bs-error');
  const submitBtn = document.getElementById('bs-submit-btn');
  const textarea = document.getElementById('bs-body');
  errorEl.style.display = 'none';

  const body = textarea.value.trim();
  if(!body){
    errorEl.textContent = 'Please write your backstory before submitting.';
    errorEl.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  const { error } = await membersSupabase.rpc('character_submit_backstory', {
    p_character_id: c.id,
    p_body: body
  });

  submitBtn.disabled = false;
  submitBtn.textContent = 'Submit Backstory';

  if(error){
    errorEl.textContent = error.message;
    errorEl.style.display = 'block';
    return;
  }

  await loadSubmissions(c);
  render();
}

function rubricHtml(kind){
  if(kind === 'remort'){
    return `
      <p class="bs-note">Since your last approved backstory, this character has remorted into someone new. You can tell us who they are now, but since this character already earned backstory XP once, this submission won't earn XP again.</p>
      <p class="bs-note">This is purely for the Plot Team's benefit, so they know who your character is now and can better engage with them on the level of personalized plot. Write as much or as little as feels right for your new character's story.</p>
    `;
  }

  if(kind === 'first'){
    return `
      <p class="bs-note">By submitting a backstory to Fantasy Alive, you can earn up to 50 XP for your character. This backstory is intended to give you a place to start from in the world, and reflects your character's origins, history, and to encourage you to think about how your character came to be who they are today, and what they might hope to do in the future. It also can give the Plot Team some idea of your character's past and ambitions, and to allow them to better engage with your character on the level of personalized plot.</p>
      <p class="bs-note">In crafting your backstory, we encourage you to look at our public-facing setting materials, as well as the rulebook. Consider where your character was born, how they learned to do the things that they can do, and why they chose to come to the area in which the game is set. While your motivations may change over the course of play, as you interact with the game world and grow as a character, knowing where you're coming from can help to determine where you end up.</p>
      <p class="bs-note">Your character is exceptional, after all, not everyone ends up seeking adventure, or becoming a wise cleric, a powerful mage, an expert warrior or a skillful merchant or craftsperson. It is therefore possible and even likely that your character has had opportunities, and even small adventures that are unlike what the average person has had. Something to bear in mind however: opportunities for adventure abound when in-game, and your adventures as a player character should be more exciting than adventures that existed solely in your character history.</p>
      <p class="bs-note">If your character history is incompatible with the world-as-written, violates our Code of Conduct, or otherwise is in need of revision, we will reach out to you. LARP is an exercise in collaborative storytelling, and we want to give you every opportunity to succeed and thrive.</p>
      <p class="bs-note">Finally, we are not awarding marks for spelling or grammar, nor are we withholding them for that reason. Some of our players may have learned English as a second language, or may not be adept in writing as an art-form. As long as their story is coherent, we have no burning need for excellence of prose.</p>

      <div class="bs-rubric-card">
        <h3>Basic Points: /30</h3>
        <p class="bs-note" style="margin-bottom:0;">In order to get the 30 basic points for a character history, we would like you to consider the following questions in your background. You can even summarize your answer to this in a single paragraph if you wish to, but we urge you to give them due consideration.</p>
        <ul>
          <li>Where is your character coming from in life? This can include geographic location (nation, town, etc.), parentage/upbringing, and what your character considers to be their most important accomplishment to date.</li>
          <li>Why is your character coming to Yorik? There are any number of potential reasons, it's a town famous for its adventurers, heroes, and villains, and your character may be seeking their fortune, trying to stay hidden, or trying to earn a place in the growing legend of the area.</li>
          <li>How did your character acquire the skills on their character sheet? This doesn't have to be complicated, a melee fighter may have served in the army, been taught by a master, or learned from a relative. A scholarly character may have spent years in study, or been an apprentice in a merchant house. The main goal is to have some idea as to how you became the person you are today.</li>
        </ul>
      </div>

      <div class="bs-rubric-card">
        <h3>Bonus Points: /20</h3>
        <p class="bs-note" style="margin-bottom:0;">These points are discretionary, and are awarded for adding in details that can really bring your character to life! You don't have to select any of these in particular, but you can get up to 20 bonus points overall by considering any or all of the following ideas, or others that show character:</p>
        <ul>
          <li>What does your character most want to accomplish in life?</li>
          <li>Does your character consider themself to be a good person?</li>
          <li>What is your character afraid of?</li>
          <li>Is your character religious? (They don't need to be an invested cleric to follow a faith)</li>
          <li>Is there anyone in your character's history that deeply influenced them?</li>
          <li>Why will your character stay in a dangerous region of the kingdom?</li>
          <li>What makes your character angry?</li>
          <li>What does your character enjoy doing?</li>
          <li>What does your character believe?</li>
        </ul>
        <p class="bs-note" style="margin-bottom:0;">Answering these questions, or otherwise showing that you have put thought into your character's motivations, can help you to earn these 20 bonus points.</p>
      </div>
    `;
  }

  return `
    <p class="bs-note">Creating a character can be a lot of fun, starting from a blank canvas, coloured only by your imagination, a character's original backstory tells where they come from and what their hopes, dreams, and ambitions might come to be.</p>
    <p class="bs-note">As time moves on however, a character will grow and change. Exposed to new ideas, new experiences, and a world that might well be greater or worse than they would ever have imagined, they will have developed new traits and gone on new adventures. It can be helpful for the Plot Team to know what adventures were meaningful to that character, and how they changed as a result of their experiences.</p>
    <p class="bs-note">To this end, Fantasy Alive would like to offer the opportunity for players to update the record. This has the potential to allow for tailored plot that is specific to a character as-they-are-now, and to ensure that new achievements are recorded, for stories as yet untold to acknowledge. As a way to sweeten the deal, there's also a small OC bonus associated. Every eighteen months, a player may resubmit their backstory with additions and updates from time in-play. We strongly encourage you to take the time to think about who your character is, and who they are in the process of becoming. A character may earn up to 25 Ogre Chips following the rubric below.</p>

    <div class="bs-rubric-card">
      <h3>Basic Points: /5</h3>
      <p class="bs-note" style="margin-bottom:0;">You will receive a base of 5 points for including your original or previous backstory, or a summary of your original backstory, in your resubmission. This helps us to ensure that our records are up to date, and will give you an opportunity to refresh yourself on what has been important to your character up to this point.</p>
    </div>

    <div class="bs-rubric-card">
      <h3>Meaningful Adventures: /15</h3>
      <p class="bs-note" style="margin-bottom:0;">You will receive up to 15 points for describing experiences or adventures that have been meaningful to your character in your time in-game. Such descriptions should give a brief summary of events, and also include some description of how your character thought or felt about their experiences.</p>
    </div>

    <div class="bs-rubric-card">
      <h3>Bonus Points: /5</h3>
      <p class="bs-note" style="margin-bottom:0;">You don't have to select any of these in particular, but you can get up to 5 bonus points overall by considering any or all of the following ideas, or others that show character:</p>
      <ul>
        <li>What is your character's current ambition?</li>
        <li>What does your character regret?</li>
        <li>What is your character afraid of?</li>
        <li>Why has your character stayed in this dangerous region of the kingdom?</li>
        <li>What makes your character angry?</li>
        <li>What does your character enjoy doing?</li>
        <li>What does your character believe?</li>
      </ul>
      <p class="bs-note" style="margin-bottom:0;">Having this information can help our Plot Team to tailor your future adventures and experiences to the character that you have now, rather than the one you first submitted.</p>
    </div>
  `;
}

function historyHtml(c){
  if(!c.submissions.length) return '';

  const items = c.submissions.map(s => {
    const notes = s.lore_notes
      ? `<div class="bs-history-notes">Lore notes: ${escapeHtml(s.lore_notes)}</div>`
      : '';
    const xp = (s.status === 'approved' && s.xp_awarded != null)
      ? `<span class="bs-xp-tag">+${s.xp_awarded} XP</span>`
      : '';
    return `
      <div class="bs-history-item">
        <div class="bs-history-head">
          <div><span class="status-pill ${statusClass(s.status)}">${statusLabel(s.status)}</span> ${xp}</div>
          <div class="bs-history-date">${fmtDateTime(s.submitted_at)} &middot; ${kindLabel(s.kind)}</div>
        </div>
        <p class="bs-history-body">${escapeHtml(s.body)}</p>
        ${notes}
      </div>
    `;
  }).join('');

  return `
    <div class="panel">
      <div class="panel-head"><h2>Submission History</h2></div>
      <div class="panel-body">${items}</div>
    </div>
  `;
}

function render(){
  const switcher = document.getElementById('bs-char-switcher');
  switcher.innerHTML = CHARACTERS.map(ch =>
    `<button class="${ch.id===activeCharId?'active':''}" onclick="bs_selectChar('${ch.id}')">${escapeHtml(ch.name)}</button>`
  ).join('');

  const content = document.getElementById('bs-content');
  const c = CHARACTERS.find(ch => ch.id === activeCharId);

  if(!c){
    content.innerHTML = `<div class="panel"><div class="panel-body">${emptyState('You have no characters yet.')}</div></div>`;
    return;
  }

  if(c.loadError){
    content.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-error-note">Couldn't load Backstory: ${escapeHtml(c.loadError)}</p></div></div>`;
    return;
  }

  const pending = c.submissions.find(s => s.status === 'pending');
  const kind = nextSubmissionKind(c);
  const panelTitle = kind === 'remort' ? 'Remort Backstory' : (kind === 'resubmission' ? 'Resubmitting a Backstory' : 'Backstory Rubric');
  const formTitle = kind === 'remort' ? "Tell Us About Your New Character" : (kind === 'resubmission' ? 'Submit an Update' : 'Submit Your Backstory');
  const fieldLabel = kind === 'remort' ? "Your new character's story" : (kind === 'resubmission' ? 'Your updated backstory' : 'Your backstory');

  let html = `
    <div class="panel">
      <div class="panel-head"><h2>${panelTitle}</h2></div>
      <div class="panel-body">${rubricHtml(kind)}</div>
    </div>
  `;

  html += `
    <div class="panel">
      <div class="panel-head"><h2>${formTitle}</h2></div>
      <div class="panel-body">
        ${pending ? `
          <p class="bs-note">Your backstory for ${escapeHtml(c.name)} is awaiting Lore review. You'll see their decision here and in your Notifications once it's ready.</p>
        ` : `
          <label class="field-label" for="bs-body">${fieldLabel}</label>
          <textarea class="bs-textarea" id="bs-body" placeholder="Write your character's story here..."></textarea>
          <button class="btn-gold" id="bs-submit-btn" style="margin-top:1rem;" onclick="bs_submit()">Submit Backstory</button>
          <p class="reg-error-note" id="bs-error" style="display:none; margin-top:0.6rem;"></p>
        `}
      </div>
    </div>
  `;

  html += historyHtml(c);

  content.innerHTML = html;
}

async function loadSubmissions(c){
  const [bsRes, remortRes] = await Promise.all([
    membersSupabase
      .from('character_backstories')
      .select('id, body, status, kind, xp_awarded, lore_notes, submitted_at')
      .eq('character_id', c.id)
      .order('submitted_at', { ascending: false }),
    membersSupabase
      .from('character_remort_requests')
      .select('completed_at')
      .eq('character_id', c.id)
      .eq('status', 'completed')
      .order('completed_at', { ascending: false })
      .limit(1)
  ]);
  if(bsRes.error){ c.loadError = bsRes.error.message; c.submissions = []; return; }
  c.submissions = bsRes.data || [];
  c.lastRemortAt = (remortRes.data && remortRes.data[0]) ? remortRes.data[0].completed_at : null;
}

async function loadCharacters(){
  const me = window.faCurrentUser.id;

  const { data: chars } = await membersSupabase
    .from('characters')
    .select('id, name')
    .eq('player_id', me)
    .order('created_at', { ascending: true });

  CHARACTERS = (chars || []).map(ch => ({ id: ch.id, name: ch.name, submissions: [], lastRemortAt: null, loadError: null }));
  activeCharId = CHARACTERS.length ? CHARACTERS[0].id : null;

  if(CHARACTERS.length){
    await Promise.all(CHARACTERS.map(loadSubmissions));
  }

  render();
}

window.bs_selectChar = bs_selectChar;
window.bs_submit = bs_submit;

document.addEventListener('fa-members-ready', loadCharacters);
})();
</script>

</body>
</html>
