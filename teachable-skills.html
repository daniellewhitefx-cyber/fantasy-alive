<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachable Skills - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<div class="char-switcher" id="teach-char-switcher"></div>

<h1 class="page-title">Teachable Skills</h1>
<p class="page-subhead">Check any skill this character can teach to others. Teaching a skill cuts down how long it takes the other player to learn it.</p>

<div class="table-scroll">
<table class="data-table">
<thead><tr><th>Skill</th><th>Type</th><th>Focus</th><th>Level</th><th>Teachable</th></tr></thead>
<tbody id="teach-skills-body"></tbody>
</table>
</div>

<div class="save-row">
<button class="btn-gold" onclick="teach_saveTeachable()">Save Changes</button>
<span class="saved-note" id="teach-saved-note">Saved.</span>
</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let CHARACTERS = [];
let activeCharId = null;
let dirty = new Set();

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function teach_selectChar(id){
  activeCharId = id;
  dirty = new Set();
  document.getElementById('teach-saved-note').classList.remove('show');
  render();
}

function teach_toggleTeach(index){
  const c = CHARACTERS.find(ch => ch.id === activeCharId);
  c.skills[index].teachable = !c.skills[index].teachable;
  dirty.add(c.skills[index].id);
}

async function teach_saveTeachable(){
  const c = CHARACTERS.find(ch => ch.id === activeCharId);
  if(!c || dirty.size === 0){
    const note = document.getElementById('teach-saved-note');
    note.classList.add('show');
    setTimeout(() => note.classList.remove('show'), 1800);
    return;
  }

  const toSave = c.skills.filter(s => dirty.has(s.id));
  await Promise.all(toSave.map(s =>
    membersSupabase.rpc('character_set_skill_teachable', { p_skill_id: s.id, p_teachable: s.teachable })
  ));
  dirty = new Set();

  const note = document.getElementById('teach-saved-note');
  note.classList.add('show');
  setTimeout(() => note.classList.remove('show'), 1800);
}

function render(){
  const switcher = document.getElementById('teach-char-switcher');
  switcher.innerHTML = CHARACTERS.map(ch =>
    `<button class="${ch.id===activeCharId?'active':''}" onclick="teach_selectChar('${ch.id}')">${escapeHtml(ch.name)}</button>`
  ).join('');

  const c = CHARACTERS.find(ch => ch.id === activeCharId);
  document.getElementById('teach-skills-body').innerHTML = !c ? '' : (c.skills.length ? c.skills.map((s, i) => `
    <tr>
      <td>${escapeHtml(s.name)}</td>
      <td>${escapeHtml(s.type)}</td>
      <td>${escapeHtml(s.focus)}</td>
      <td>${s.level}</td>
      <td class="teach-cell"><input type="checkbox" ${s.teachable?'checked':''} onchange="teach_toggleTeach(${i})"></td>
    </tr>
  `).join('') : `<tr><td colspan="5">This character has no skills yet.</td></tr>`);
}

async function loadCharacters(){
  const { data: chars } = await membersSupabase
    .from('characters')
    .select('id, name')
    .order('created_at', { ascending: true });

  const { data: skillRows } = await membersSupabase
    .from('character_skills')
    .select('id, character_id, category, skill_name, focus, level, teachable');

  CHARACTERS = (chars || []).map(ch => ({
    id: ch.id,
    name: ch.name,
    skills: (skillRows || [])
      .filter(sk => sk.character_id === ch.id)
      .map(sk => ({ id: sk.id, name: sk.skill_name, type: sk.category, focus: sk.focus || '', level: sk.level, teachable: sk.teachable }))
  }));

  activeCharId = CHARACTERS.length ? CHARACTERS[0].id : null;
  render();
}

window.teach_selectChar = teach_selectChar;
window.teach_toggleTeach = teach_toggleTeach;
window.teach_saveTeachable = teach_saveTeachable;
document.addEventListener('fa-members-ready', loadCharacters);
})();
</script>

</body>
</html>
