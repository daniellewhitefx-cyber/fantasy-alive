<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.lore-page-hero{
  display:grid;
  grid-template-columns: 1fr 1fr;
  align-items:center;
  height: 320px;
  overflow: hidden;
}
.lore-page-hero-content{
  padding: 2rem 3rem 2rem 5.5rem;
  text-align: center;
}
.lore-page-hero-content img{
  width:100%; max-width: 440px; height:auto; display:block; margin: 0 auto;
}
.lore-page-hero-content h1{
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  font-size: 3rem;
  margin: 0.5rem 0 0;
  color: var(--brown);
  text-align: center;
}
.lore-page-hero-image{
  position:relative;
  overflow:hidden;
  height: 100%;
  min-height: 320px;
}
.lore-page-hero-image::after{
  content:"";
  position:absolute;
  top:0; left:0;
  width: 45%; height:100%;
  background: linear-gradient(to left, rgba(236,225,205,0) 0%, var(--cream) 100%);
  pointer-events: none;
}
.lore-page-hero-image img{
  width:100%; height:100%; object-fit:cover; display:block;
}

.lore-page{
  display:grid;
  grid-template-columns: 280px 1fr;
  gap: 2.5rem;
  padding: 2rem 3rem 4rem;
  align-items:start;
  max-width: 1300px;
  margin: 0 auto;
  background: var(--cream);
  color: var(--brown);
  font-family: 'Cinzel', serif;
}

.lore-sidebar{
  border: 2px solid var(--gold-dark);
  border-radius: 4px;
  overflow:hidden;
  position: sticky;
  top: 1.5rem;
}
.lore-cat{
  border-bottom: 1px solid var(--gold-dark);
}
.lore-cat:last-child{ border-bottom:none; }
.lore-cat-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  background: var(--ink);
  color: var(--gold);
  border:none;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.03em;
  padding: 0.7rem 1rem;
  cursor:pointer;
  text-align:left;
}
.lore-cat-header .chev{
  transition: transform 0.15s ease;
  font-size: 0.75rem;
}
.lore-cat.open .lore-cat-header .chev{ transform: rotate(90deg); }
.lore-cat-items{
  display:none;
  flex-direction: column;
}
.lore-cat.open .lore-cat-items{ display:flex; }
.lore-cat-items a{
  display:block;
  width:100%;
  text-align:left;
  text-decoration:none;
  background: var(--cream-deep);
  border: none;
  border-top: 1px dotted var(--gold-dark);
  color: var(--brown);
  font-family: 'Cinzel', serif;
  font-weight: 600;
  font-size: 0.9rem;
  padding: 0.65rem 1rem 0.65rem 1.4rem;
  cursor:pointer;
}
.lore-cat-items a.active{
  background: var(--gold);
  color: var(--ink);
}
.lore-cat-items a:not(.active):hover{ background: var(--gold-dark); color: var(--cream); }

.lore-mode-toggle{
  display:flex;
  align-items:center;
  gap: 0.6rem;
  padding: 0.7rem 0.9rem;
  background: var(--cream-deep);
  border-bottom: 2px solid var(--gold-dark);
  font-family: 'Cinzel', serif;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--brown);
}
.lore-toggle-switch{
  position:relative;
  width: 38px; height: 20px;
  background: #3a352a;
  border-radius: 10px;
  border: none;
  cursor:pointer;
  flex-shrink:0;
}
.lore-toggle-switch.on{ background: var(--gold); }
.lore-toggle-switch::after{
  content:"";
  position:absolute;
  top:2px; left:2px;
  width:16px; height:16px;
  border-radius:50%;
  background: #fff;
  transition: left 0.15s ease;
}
.lore-toggle-switch.on::after{ left: 20px; }

.lore-search{
  padding: 0.8rem;
  background: var(--ink);
  border-bottom: 3px solid var(--gold);
}
.lore-search input{
  width:100%;
  font-family: 'EB Garamond', serif;
  font-size: 0.95rem;
  padding: 0.55rem 0.8rem;
  border: 2px solid var(--gold);
  border-radius: 4px;
  background: #fff;
  color: var(--brown);
}
.lore-search-results{
  display:flex;
  flex-direction: column;
}
.lore-search-result{
  display:block;
  width:100%;
  text-align:left;
  text-decoration:none;
  background: var(--cream-deep);
  border: none;
  border-bottom: 1px dotted var(--gold-dark);
  color: var(--brown);
  padding: 0.7rem 1rem;
  cursor:pointer;
}
.lore-search-result:last-child{ border-bottom:none; }
.lore-search-result:hover{ background: var(--gold); }
.lore-search-result .lsr-title{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.9rem;
  margin-bottom: 0.15rem;
}
.lore-search-result .lsr-cat{
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 0.3rem;
}
.lore-search-result .lsr-excerpt{
  font-family: 'EB Garamond', serif;
  font-size: 0.88rem;
  line-height: 1.4;
  color: var(--brown-dark);
}
.lore-search-result mark{
  background: var(--gold);
  color: var(--ink);
  padding: 0 1px;
}
.lore-search-empty{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.9rem;
  color: var(--brown-dark);
  padding: 1rem;
}

.lore-article{
  background: #fff;
  border: 3px solid var(--gold);
  box-shadow: 10px 10px 0 0 var(--gold);
  padding: 2.2rem 2.6rem 2.6rem;
}
.lore-article h2{
  font-size: 1.7rem;
  font-weight: 700;
  margin: 0 0 1.4rem;
  color: var(--brown-dark);
}
.lore-article h3{
  font-family: 'Cinzel', serif;
  font-size: 1.25rem;
  font-weight: 700;
  margin: 1.8rem 0 0.9rem;
  padding-bottom: 0.4rem;
  border-bottom: 2px solid var(--gold);
  color: var(--brown-dark);
}
.lore-article h4{
  font-family: 'Cinzel', serif;
  font-size: 1.05rem;
  font-weight: 700;
  margin: 1.4rem 0 0.7rem;
  color: var(--gold-dark);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.lore-article .lore-quote{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--brown-dark);
  border-left: 3px solid var(--gold);
  padding: 0.4rem 0 0.4rem 1.1rem;
  margin: 0 0 1.6rem;
}
.lore-article .lore-quote cite{
  display:block;
  font-style: normal;
  font-size: 0.85rem;
  margin-top: 0.4rem;
  color: var(--gold-dark);
}
.lore-article blockquote{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--brown-dark);
  border-left: 3px solid var(--gold);
  padding: 0.4rem 0 0.4rem 1.1rem;
  margin: 0 0 1.6rem;
}
.lore-article blockquote p{ margin: 0 0 0.4rem; }
.lore-article blockquote p:last-child{ margin-bottom: 0; }
.lore-article p{
  font-family: 'EB Garamond', serif;
  font-size: 1.12rem;
  line-height: 1.75;
  margin: 0 0 1.1rem;
  color: #2e2415;
}
.lore-article p.lore-attribution{
  font-style: italic;
  font-size: 0.85rem;
  color: var(--gold-dark);
  margin-top: 1.8rem;
  padding-top: 1rem;
  border-top: 1px dotted var(--line);
}
.lore-article p.lore-citation{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.95rem;
  color: var(--gold-dark);
  margin: -0.6rem 0 1.1rem;
}
.lore-article ul, .lore-article ol{
  font-family: 'EB Garamond', serif;
  font-size: 1.12rem;
  line-height: 1.75;
  color: #2e2415;
  margin: 0 0 1.1rem;
  padding-left: 1.5rem;
}
.lore-article ul{ list-style: disc; }
.lore-article ol{ list-style: decimal; }
.lore-article li{ margin-bottom: 0.4rem; }
.lore-article li::marker{ color: var(--gold-dark); }
.lore-article a{
  color: var(--gold-dark);
  text-decoration: underline;
  cursor: pointer;
}
.lore-article a:hover{ color: var(--brown-dark); }
.lore-article img{
  display:block;
  max-width: 100%;
  height:auto;
  margin: 1.6rem auto;
  border: 3px solid var(--gold);
  box-shadow: 8px 8px 0 0 var(--gold);
}
.lore-article figure{
  margin: 1.6rem 0;
}
.lore-article figure img{ margin: 0 auto 0.6rem; }
.lore-article figcaption{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.92rem;
  color: var(--brown-dark);
  text-align:center;
}
.lore-article img.lore-img-float-left,
.lore-article figure.lore-img-float-left{
  float:left;
  max-width: 42%;
  margin: 0.3rem 1.6rem 1rem 0;
}
.lore-article img.lore-img-float-right,
.lore-article figure.lore-img-float-right{
  float:right;
  max-width: 42%;
  margin: 0.3rem 0 1rem 1.6rem;
}
.lore-article img.lore-img-small,
.lore-article figure.lore-img-small{
  max-width: 45%;
}
.lore-article figure.lore-img-float-left img,
.lore-article figure.lore-img-float-right img,
.lore-article figure.lore-img-small img{
  max-width:100%;
  margin: 0 auto 0.6rem;
}
.lore-article h3, .lore-article h4{ clear:both; }
@media (max-width: 700px){
  .lore-article img.lore-img-float-left,
  .lore-article img.lore-img-float-right,
  .lore-article figure.lore-img-float-left,
  .lore-article figure.lore-img-float-right{
    float:none;
    max-width:100%;
    margin: 1.6rem auto;
  }
}
.lore-article table{
  width:100%;
  border-collapse: collapse;
  background: var(--cream-deep);
  border: 3px solid var(--gold);
  margin: 1.6rem 0;
}
.lore-article th{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1rem;
  padding: 0.7rem 0.9rem;
  border-bottom: 4px solid var(--gold);
  text-align:left;
}
.lore-article th:not(:last-child),
.lore-article td:not(:last-child){
  border-right: 2px dotted var(--gold-dark);
}
.lore-article td{
  font-family: 'EB Garamond', serif;
  font-size: 1rem;
  padding: 0.6rem 0.9rem;
}
.lore-article tbody tr:nth-child(odd){ background: var(--cream); }
.lore-article tbody tr:nth-child(even){ background: var(--cream-deep); }
.lore-empty{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--brown-dark);
  padding: 2rem;
}

.lore-page.lore-dark{
  --lore-dbg: #1b1812;
  --lore-dpanel: #26221a;
  --lore-dtext: #e8ddc8;
  --lore-dtext-soft: #c9bda0;
}
.lore-page.lore-dark .lore-cat-items a{
  background: var(--lore-dpanel);
  color: var(--lore-dtext);
}
.lore-page.lore-dark .lore-cat-items a.active{
  background: var(--gold);
  color: var(--ink);
}
.lore-page.lore-dark .lore-cat-items a:not(.active):hover{
  background: var(--gold-dark);
  color: var(--ink);
}
.lore-page.lore-dark .lore-search-result{
  background: var(--lore-dpanel);
  color: var(--lore-dtext);
}
.lore-page.lore-dark .lore-search-result:hover{ background: var(--gold-dark); }
.lore-page.lore-dark .lore-search-result .lsr-excerpt{ color: var(--lore-dtext-soft); }
.lore-page.lore-dark .lore-search-empty{ color: var(--lore-dtext-soft); }
.lore-page.lore-dark .lore-article{
  background: var(--lore-dpanel);
}
.lore-page.lore-dark .lore-article h2,
.lore-page.lore-dark .lore-article h3{
  color: var(--lore-dtext);
}
.lore-page.lore-dark .lore-article h4{
  color: var(--gold);
}
.lore-page.lore-dark .lore-article p{
  color: var(--lore-dtext-soft);
}
.lore-page.lore-dark .lore-article ul,
.lore-page.lore-dark .lore-article ol{
  color: var(--lore-dtext-soft);
}
.lore-page.lore-dark .lore-article .lore-quote{
  color: var(--lore-dtext);
}
.lore-page.lore-dark .lore-article blockquote{
  color: var(--lore-dtext);
}
.lore-page.lore-dark .lore-article a{
  color: var(--gold);
}
.lore-page.lore-dark .lore-article a:hover{ color: var(--lore-dtext); }
.lore-page.lore-dark .lore-article figcaption{ color: var(--lore-dtext-soft); }
.lore-page.lore-dark .lore-article table{ background: var(--lore-dpanel); }
.lore-page.lore-dark .lore-article th{ color: var(--lore-dtext); }
.lore-page.lore-dark .lore-article td{ color: var(--lore-dtext-soft); }
.lore-page.lore-dark .lore-article tbody tr:nth-child(odd){ background: #201c15; }
.lore-page.lore-dark .lore-article tbody tr:nth-child(even){ background: var(--lore-dpanel); }
.lore-page.lore-dark .lore-empty{ color: var(--lore-dtext-soft); }

.lore-add-entry-wrap{
  padding: 0.7rem;
  background: var(--cream-deep);
  border-bottom: 2px solid var(--gold-dark);
}
.lore-add-entry-wrap:empty{ display:none; }
.lore-editor-btn{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 0.6rem 1rem;
  border: 2px solid var(--gold-dark);
  border-radius: 4px;
  background: #fff;
  color: var(--brown-dark);
  cursor: pointer;
}
.lore-editor-btn:hover{ background: var(--gold); border-color: var(--gold); }
.lore-editor-btn.add{
  background: var(--gold);
  border-color: var(--gold);
  color: var(--ink);
  width: 100%;
}
.lore-editor-btn.add:hover{ background: var(--gold-dark); }
.lore-editor-btn.danger{ border-color: var(--bad); color: var(--bad); }
.lore-editor-btn.danger:hover{ background: var(--bad); color: #fff; }

.lore-article-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.4rem;
}
.lore-article-head h2{ margin: 0; flex: 1; min-width: 200px; }
.lore-editor-controls{
  display:flex;
  gap: 0.6rem;
  flex-shrink:0;
}

.lore-editor-modal{
  position: fixed;
  inset: 0;
  z-index: 100;
}
.lore-modal-backdrop{
  position: absolute;
  inset: 0;
  background: rgba(20,18,15,0.6);
}
.lore-modal{
  position: relative;
  max-width: 640px;
  margin: 3rem auto;
  max-height: 85vh;
  overflow-y: auto;
  background: var(--cream);
  border: 3px solid var(--gold);
  box-shadow: 10px 10px 0 0 var(--gold);
  padding: 1.8rem 2rem 2rem;
  font-family: 'EB Garamond', serif;
  color: var(--brown);
}
.lore-modal h3{
  font-family: 'Cinzel', serif;
  color: var(--brown-dark);
  margin: 0 0 1.2rem;
}
.lore-field-label{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gold-dark);
  display:block;
  margin: 1rem 0 0.4rem;
}
.lore-modal input[type="text"]{
  width:100%;
  font-family: 'EB Garamond', serif;
  font-size: 1rem;
  padding: 0.6rem 0.8rem;
  border: 2px solid var(--gold);
  border-radius: 4px;
  background: #fff;
  color: var(--brown);
}
.lore-editor-help{
  font-size: 0.82rem;
  color: var(--brown-dark);
  background: var(--cream-deep);
  border-left: 3px solid var(--gold);
  padding: 0.5rem 0.8rem;
  margin: 0.4rem 0 0.6rem;
  line-height: 1.5;
}
.lore-editor-help code{
  background: rgba(0,0,0,0.06);
  padding: 0 0.25rem;
  border-radius: 3px;
}
#lore-edit-image-status{ font-size: 0.85rem; font-style: italic; color: var(--brown-dark); }
.lore-editor-error{
  color: var(--bad);
  font-size: 0.9rem;
  margin-top: 0.8rem;
}
.lore-modal-actions{
  display:flex;
  justify-content:flex-end;
  gap: 0.8rem;
  margin-top: 1.6rem;
}

.lore-modal-wide{ max-width: 820px; }

.lore-rich-toolbar{
  display:flex;
  flex-wrap: wrap;
  align-items:center;
  gap: 0.4rem;
  margin: 0.4rem 0 0.6rem;
  padding: 0.5rem;
  background: var(--cream-deep);
  border: 2px solid var(--gold-dark);
  border-radius: 4px;
}
.lore-rich-sep{
  width: 2px;
  align-self: stretch;
  background: var(--gold);
  opacity: 0.5;
  margin: 0 0.15rem;
}
.lore-rich-btn{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.78rem;
  padding: 0.4rem 0.6rem;
  border: 2px solid var(--gold-dark);
  border-radius: 4px;
  background: #fff;
  color: var(--brown-dark);
  cursor: pointer;
  white-space: nowrap;
}
.lore-rich-btn:hover{ background: var(--gold); border-color: var(--gold); }

.lore-rich-editor{
  min-height: 320px;
  max-height: 55vh;
  overflow-y: auto;
  overflow-x: hidden;
  font-family: 'EB Garamond', serif;
  font-size: 1rem;
  line-height: 1.6;
  padding: 0.9rem 1rem;
  border: 2px solid var(--gold);
  border-radius: 4px;
  background: #fff;
  color: var(--brown);
}
.lore-rich-editor:focus{ outline: 2px solid var(--gold-dark); outline-offset: 1px; }
.lore-rich-editor p{ margin: 0 0 0.9rem; }
.lore-rich-editor h3{ font-family: 'Cinzel', serif; color: var(--brown-dark); margin: 1.2rem 0 0.6rem; }
.lore-rich-editor h4{ font-family: 'Cinzel', serif; color: var(--gold-dark); margin: 1rem 0 0.5rem; }
.lore-rich-editor ul, .lore-rich-editor ol{ margin: 0 0 0.9rem; padding-left: 1.4rem; }
.lore-rich-editor li{ margin-bottom: 0.3rem; }
.lore-rich-editor blockquote,
.lore-rich-editor .lore-quote{
  font-style: italic;
  border-left: 3px solid var(--gold);
  padding: 0.3rem 0 0.3rem 1rem;
  margin: 0 0 0.9rem;
  color: var(--brown-dark);
}
.lore-rich-editor .lore-quote cite{
  display:block;
  font-style: normal;
  font-size: 0.85rem;
  margin-top: 0.3rem;
  color: var(--gold-dark);
}
.lore-rich-editor table{ border-collapse: collapse; width:100%; margin: 0 0 0.9rem; }
.lore-rich-editor th, .lore-rich-editor td{ border: 1px solid var(--gold-dark); padding: 0.4rem 0.6rem; text-align:left; }
.lore-rich-editor img{ height:auto; cursor: pointer; -webkit-user-drag: none; user-select: none; }
.lore-rich-editor img.lore-rich-img-selected{ outline: 3px solid var(--gold-dark); outline-offset: 2px; }
.lore-rich-editor a{ color: var(--gold-dark); }

.lore-rich-img-handle{
  display:none;
  position: fixed;
  width: 14px;
  height: 14px;
  background: var(--gold-dark);
  border: 2px solid #fff;
  border-radius: 50%;
  cursor: nwse-resize;
  z-index: 300;
  box-shadow: 0 0 0 1px var(--gold-dark);
}
.lore-rich-img-toolbar{
  display:none;
  position: fixed;
  gap: 0.35rem;
  background: var(--ink);
  border: 2px solid var(--gold);
  border-radius: 4px;
  padding: 0.35rem;
  z-index: 300;
}
.lore-rich-img-toolbar button{
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  font-weight: 700;
