<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Non-Combat Build - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/character-noncombat-build.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Non-Combat Build - Fantasy Alive">

<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Non-Combat Build</h1>

<div class="reg-already-registered" id="ncb-blocked-notice" style="display:none;">
<h3>This character couldn't be loaded</h3>
<p id="ncb-blocked-reason"></p>
<p><a href="characters.html">Back to your Characters</a></p>
</div>

<div id="ncb-form-wrap" style="display:none;">

<div class="reg-section">
<div class="reg-section-label">About Non-Combat Builds</div>
<p class="page-subhead" id="ncb-intro"></p>
</div>

<div class="reg-section">
<div class="reg-section-label">Choose Skills</div>
<p class="page-subhead" id="ncb-budget-line"></p>

<div id="ncb-skills-loading" class="page-subhead">Loading the skill list&hellip;</div>
<div id="ncb-skills-error" class="reg-error-note" style="display:none;">Couldn't load the skill list. Refresh to try again.</div>

<div id="ncb-skills-area" style="display:none;">
<div class="day-toggle" id="ncb-cat-tabs"></div>
<div class="skill-table-wrap-cc">
<table class="data-table">
<thead><tr><th>Skill</th><th>Cost</th><th>Focus / Level</th><th></th></tr></thead>
<tbody id="ncb-browser-body"></tbody>
</table>
</div>

<h3 style="margin:1.6rem 0 0.8rem;">Chosen Skills</h3>
<table class="data-table">
<thead><tr><th>Skill</th><th>Type</th><th>Focus</th><th>Level</th><th>SP</th><th></th></tr></thead>
<tbody id="ncb-chosen-body"></tbody>
</table>
<p class="page-subhead" id="ncb-chosen-empty" style="margin-top:0.8rem;">No skills chosen yet.</p>
</div>
</div>

<button class="btn-purple" onclick="ncb_save()">Save Non-Combat Build</button>
<p class="reg-success-note" id="ncb-success" style="display:none;"></p>
<p class="reg-error-note" id="ncb-error" style="display:none;"></p>

</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script src="js/skills-data.js"></script>
<script src="js/skills-catalog.js"></script>
<script src="js/character-stats.js"></script>
<script>
(function(){
const NONCOMBAT_CATEGORIES = ['Combat Skill', 'Weapon Skill'];

let allSkills = [];
let activeCategory = null;
let chosen = [];
let browseState = {};
let character = null;
let charId = null;

function currentStats(){
  if(!character) return null;
  return faDeriveStats(character.race, chosen.map(s => ({ name: s.title, level: s.level })));
}

function startingSP(){ return character ? character.starting_sp : 0; }
function spentSP(){ return chosen.reduce((sum, s) => sum + s.cost, 0); }

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateBudgetLine(){
  document.getElementById('ncb-budget-line').textContent =
    `Skill Points: ${spentSP()} / ${startingSP()} used - the same budget ${character ? character.name : 'this character'} would normally start with. Combat and Weapon skills aren't available here.`;
}

function ncb_selectCategory(cat){
  activeCategory = cat;
  renderTabs();
  renderBrowser();
}

function rowState(idx){
  const s = allSkills[idx];
  const key = skillKey(s);
  browseState[key] = browseState[key] || { level: 1, focus: '' };
  return { s, key, state: browseState[key] };
}

function existingChosenCost(s, race, focus){
  if(!isLeveledCost(s, race, focus)) return 0;
  const key = s.focusTypeId ? focus.trim() : '';
  const existing = chosen.find(c => c.title === s.title && c.focus === key);
  return existing ? existing.cost : 0;
}

function updateRowLive(idx){
  const { s, state } = rowState(idx);
  const race = character ? character.race : null;
  const isLeveled = isLeveledCost(s, race, state.focus);
  const level = isLeveled ? skillNextLevel(s, chosen, state.focus) : 1;
  const limit = skillsLevelLimit(s, race, state.focus);
  const atCap = isLeveled && limit != null && level > limit;
  const remaining = startingSP() - spentSP() + existingChosenCost(s, race, state.focus);
  const cost = atCap ? null : skillsCumulativeCost(s, level, race, state.focus);
  const canAdd = !atCap && cost !== null && cost <= remaining && !(s.focusTypeId && !state.focus.trim());

  const costEl = document.getElementById('ncb-cost-' + idx);
  if(costEl) costEl.textContent = atCap ? '-' : (cost === null ? '-' : cost + ' SP');

  const btn = document.getElementById('ncb-add-' + idx);
  if(btn) btn.disabled = !canAdd;
}

function ncb_updateFocus(idx, val){
  const { state } = rowState(idx);
  state.focus = val;
  updateRowLive(idx);
}

function ncb_addSkill(idx){
  const { s, key, state } = rowState(idx);
  const race = character ? character.race : null;
  const isLeveled = isLeveledCost(s, race, state.focus);
  const level = isLeveled ? skillNextLevel(s, chosen, state.focus) : 1;
  const limit = skillsLevelLimit(s, race, state.focus);
  if(limit != null && level > limit) return;
  const cost = skillsCumulativeCost(s, level, race, state.focus);
  if(cost === null) return;
  if(s.focusTypeId && !state.focus.trim()) return;
  if(spentSP() - existingChosenCost(s, race, state.focus) + cost > startingSP()) return;

  mergeChosenSkill(chosen, {
    category: s.category,
    title: s.title,
    focus: s.focusTypeId ? state.focus.trim() : '',
    level: isLeveled ? level : 1,
    cost: cost
  }, isLeveled);

  browseState[key] = { level: 1, focus: '' };

  renderChosen();
  renderBrowser();
  updateBudgetLine();
}

function ncb_removeSkill(i){
  chosen.splice(i, 1);
  renderChosen();
  renderBrowser();
  updateBudgetLine();
}

function renderTabs(){
  const categories = skillsOrderedCategories(allSkills);
  document.getElementById('ncb-cat-tabs').innerHTML = categories.map(cat =>
    `<button class="${cat === activeCategory ? 'active' : ''}" onclick="ncb_selectCategory('${cat.replace(/'/g, "\\'")}')">${escapeHtml(cat)}</button>`
  ).join('');
}

function focusFieldHtml(idx, s, state, isLeveled){
  const widthStyle = `style="max-width:${isLeveled ? 140 : 180}px;display:inline-block;${isLeveled ? 'margin-right:0.5rem;' : ''}"`;

  if(s.title === 'Clerical Investment'){
    const locked = clericalInvestmentLockedFocus(chosen);
    if(locked){
      state.focus = locked;
      return `<span ${widthStyle}>${escapeHtml(locked)}</span>`;
    }
  }

  const options = focusOptionsFor(s, chosen, character ? character.race : null) || [];
  return `<select onchange="ncb_updateFocus(${idx}, this.value)" ${widthStyle}>`
    + `<option value="">Choose&hellip;</option>`
    + options.map(o => `<option value="${escapeHtml(o)}" ${state.focus === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')
    + `</select>`;
}

function renderBrowser(){
  const stats = currentStats();
  const race = character ? character.race : null;

  const rows = allSkills
    .map((s, idx) => ({ s, idx }))
    .filter(({ s }) => {
      if(s.category !== activeCategory) return false;
      const state = browseState[skillKey(s)] || { level: 1, focus: '' };
      if(!isLeveledCost(s, race, state.focus) && skillFullyOwned(s, chosen)) return false;
      return true;
    });

  document.getElementById('ncb-browser-body').innerHTML = rows.map(({ s, idx }) => {
    const key = skillKey(s);
    const state = browseState[key] || { level: 1, focus: '' };
    const isLeveled = isLeveledCost(s, race, state.focus);
    const level = isLeveled ? skillNextLevel(s, chosen, state.focus) : 1;
    const limit = skillsLevelLimit(s, race, state.focus);
    const atCap = isLeveled && limit != null && level > limit;
    const cost = atCap ? null : skillsCumulativeCost(s, level, race, state.focus);
    const remaining = startingSP() - spentSP() + existingChosenCost(s, race, state.focus);
    const missing = unmetPrereqText(s, race, state.focus, chosen, stats);

    let focusCell = '-';
    if(s.focusTypeId && isLeveled){
      focusCell = focusFieldHtml(idx, s, state, true)
        + `<span>${atCap ? 'Max level' : 'Level ' + level}</span>`;
    } else if(s.focusTypeId){
      focusCell = focusFieldHtml(idx, s, state, false);
    } else if(isLeveled){
      focusCell = atCap ? 'Max level' : 'Level ' + level;
    }

    const canAdd = !missing && !atCap && cost !== null && cost <= remaining && !(s.focusTypeId && !state.focus.trim());
    const costLabel = atCap ? '-' : (cost === null ? '-' : cost + ' SP');
    const nameCell = escapeHtml(s.title) + (missing ? `<span class="skill-missing-prereq">Requires: ${escapeHtml(missing)}</span>` : '');

    return `
      <tr class="${missing ? 'skill-row-locked' : ''}">
        <td>${nameCell}</td>
        <td id="ncb-cost-${idx}">${escapeHtml(costLabel)}</td>
        <td>${focusCell}</td>
        <td><button class="btn-outline" id="ncb-add-${idx}" ${canAdd ? '' : 'disabled'} onclick="ncb_addSkill(${idx})">+ Add</button></td>
      </tr>
    `;
  }).join('');
}

function renderChosen(){
  const body = document.getElementById('ncb-chosen-body');
  const empty = document.getElementById('ncb-chosen-empty');
  if(chosen.length === 0){
    body.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  body.innerHTML = chosen.map((s, i) => `
    <tr>
      <td>${escapeHtml(s.title)}</td>
      <td>${escapeHtml(s.category)}</td>
      <td>${escapeHtml(s.focus)}</td>
      <td>${s.level}</td>
      <td>${s.cost}</td>
      <td><button class="btn-outline" onclick="ncb_removeSkill(${i})" title="Remove">&times;</button></td>
    </tr>
  `).join('');
}

async function ncb_save(){
  const successEl = document.getElementById('ncb-success');
  const errorEl = document.getElementById('ncb-error');
  successEl.style.display = 'none';
  errorEl.style.display = 'none';

  if(spentSP() > startingSP()){ errorEl.textContent = 'Chosen skills exceed this character\'s Skill Point budget.'; errorEl.style.display = 'block'; return; }

  const p_skills = chosen.map(s => ({
    category: s.category,
    skill_name: s.title,
    focus: s.focus || null,
    level: s.level,
    sp_cost: s.cost
  }));

  const { error } = await membersSupabase.rpc('character_noncombat_build_save', {
    p_character_id: charId,
    p_skills
  });

  if(error){ errorEl.textContent = error.message; errorEl.style.display = 'block'; return; }

  successEl.textContent = 'Non-Combat Build saved. You can pick Non-Combat for this character next time you register for an event.';
  successEl.style.display = 'block';
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  charId = params.get('id');
  const blocked = (reason) => {
    document.getElementById('ncb-blocked-reason').textContent = reason;
    document.getElementById('ncb-blocked-notice').style.display = 'block';
  };

  if(!charId){ blocked('No character was specified.'); return; }

  const { data: char } = await membersSupabase
    .from('characters')
    .select('id, name, race, starting_sp, noncombat_build_saved_at')
    .eq('id', charId)
    .maybeSingle();

  if(!char){ blocked('This character could not be found.'); return; }

  character = char;
  document.getElementById('ncb-form-wrap').style.display = 'block';
  document.getElementById('ncb-intro').textContent =
    `Set up a fixed, ready-to-go Non-Combat sheet for ${char.name} - the same ${char.starting_sp} SP budget, no combat or weapon skills, and no downtime hours needed to learn it. `
    + `Pick Non-Combat when you register for an event and this build becomes ${char.name}'s character sheet for that event.`;
  updateBudgetLine();

  const { data: skillRows } = await membersSupabase
    .from('character_noncombat_skills')
    .select('category, skill_name, focus, level, sp_cost')
    .eq('character_id', charId);

  chosen = (skillRows || []).map(sk => ({
    category: sk.category,
    title: sk.skill_name,
    focus: sk.focus || '',
    level: sk.level,
    cost: sk.sp_cost
  }));
  updateBudgetLine();

  try{
    const catalog = await skillsLoadCatalog();
    allSkills = catalog.filter(s => !NONCOMBAT_CATEGORIES.includes(s.category));
    document.getElementById('ncb-skills-loading').style.display = 'none';
    document.getElementById('ncb-skills-area').style.display = 'block';
    const categories = skillsOrderedCategories(allSkills);
    if(categories.length) activeCategory = categories[0];
    renderTabs();
    renderBrowser();
    renderChosen();
  } catch(err){
    document.getElementById('ncb-skills-loading').style.display = 'none';
    document.getElementById('ncb-skills-error').style.display = 'block';
  }
}

window.ncb_selectCategory = ncb_selectCategory;
window.ncb_updateFocus = ncb_updateFocus;
window.ncb_addSkill = ncb_addSkill;
window.ncb_removeSkill = ncb_removeSkill;
window.ncb_save = ncb_save;

document.addEventListener('fa-members-ready', init);
})();
</script>

</body>
</html>
