<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XP/OC Log - Fantasy Alive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">XP / OC Log</h1>
<p class="page-subhead">XP is earned per character. OC is shared across your whole account. Every entry below shows which character earned it, where applicable.</p>

<table class="data-table">
<thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Character</th><th>Note</th></tr></thead>
<tbody id="log-log-body"></tbody>
</table>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(iso){
  return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

async function init(){
  const me = window.faCurrentUser.id;

  const { data: myChars } = await membersSupabase.from('characters').select('id, name').eq('player_id', me);
  const charMap = {};
  (myChars || []).forEach(c => { charMap[c.id] = c.name; });
  const charIds = (myChars || []).map(c => c.id);

  const [xpResult, ocResult] = await Promise.all([
    charIds.length
      ? membersSupabase.from('xp_transactions').select('character_id, amount, note, created_at').in('character_id', charIds)
      : Promise.resolve({ data: [] }),
    membersSupabase.from('oc_transactions').select('amount, note, created_at').eq('player_id', me)
  ]);

  const log = [
    ...(xpResult.data || []).map(x => ({ date: x.created_at, type: 'XP', amount: x.amount, character: charMap[x.character_id] || '', note: x.note || '' })),
    ...(ocResult.data || []).map(o => ({ date: o.created_at, type: 'OC', amount: o.amount, character: '', note: o.note || '' }))
  ].sort((a, b) => new Date(b.date) - new Date(a.date));

  document.getElementById('log-log-body').innerHTML = log.length ? log.map(l => `
    <tr>
      <td>${fmtDate(l.date)}</td>
      <td><span class="log-type ${l.type.toLowerCase()}">${l.type}</span></td>
      <td>${l.amount}</td>
      <td>${l.character ? escapeHtml(l.character) : 'N/A'}</td>
      <td>${escapeHtml(l.note)}</td>
    </tr>
  `).join('') : `<tr><td colspan="5">No XP or OC entries yet.</td></tr>`;
}

document.addEventListener('fa-members-ready', init);
})();
</script>

</body>
</html>
