<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Event - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Current Event - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/current-event.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Current Event - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.ce-cols{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2rem;
  align-items: start;
}
.ce-event-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.ce-logging-as{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--brown-dark);
}
.ce-stats{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  margin-bottom: 1.2rem;
}
.ce-header-stats{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
}
.ce-stat{
  border: 2px solid var(--line);
  background: var(--row-b);
  padding: 0.9rem 1.1rem;
}
.ce-stat-label{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 0.3rem;
}
.ce-stat-value{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--ink);
}
@media (max-width: 800px){
  .ce-cols{ grid-template-columns: 1fr; }
}
@media (max-width: 600px){
  .ce-stats{ grid-template-columns: 1fr; }
}
.ce-info-item{
  border-bottom: 1px solid var(--line);
  padding: 0.8rem 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap: 0.8rem;
}
.ce-info-item:last-child{ border-bottom: none; }
.ce-info-item p{ margin: 0; white-space: pre-wrap; }
.shop-grid{
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 0.6rem;
  margin-top: 1rem;
}
.shop-card{
  border: 2px solid var(--line);
  background: var(--row-b);
  padding: 0.55rem 0.65rem;
  display:flex;
  flex-direction: column;
  gap: 0.35rem;
  transition: border-color 0.15s ease;
}
.shop-card:hover{
  border-color: var(--gold-dark);
}
.shop-card-name{
  font-family: 'Cinzel', serif;
  font-weight: 600;
  font-size: 0.82rem;
  color: var(--ink);
  line-height: 1.2;
}
.shop-card-price{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.72rem;
  color: var(--gold-dark);
  letter-spacing: 0.02em;
}
.shop-card-actions{
  display:flex;
  align-items:center;
  gap: 0.35rem;
  margin-top: auto;
}
.shop-qty{
  width: 40px;
  text-align: center;
  padding: 0.2rem;
  font-size: 0.8rem;
}
.shop-card-actions .btn-outline{
  font-size: 0.75rem;
  padding: 0.3rem 0.5rem;
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Current Event</h1>

<div id="ce-content"><p class="reg-empty-note">Loading&hellip;</p></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script src="js/xp-convert.js"></script>
<script src="js/skills-data.js"></script>
<script src="js/skills-catalog.js"></script>
<script src="js/character-stats.js"></script>
<script src="js/shoppe-data.js"></script>
<script>
(function(){
let EVENT = null;
let LOG_STATUS = null;
let REG_CHECKED = false;
let REG_ERROR = null;
let REGISTERED_AS = null;
let MY_CHARACTER = null;
let OC_BALANCE = 0;
let SPENT = { xp_spent: 0, copper_spent: 0 };
let ACTIVE_TAB = 'info';

let INFO_LOADED = false;
let INFO_ERROR = null;
let INFO_ROSTER = [];
let INFO_CAST_COUNT = 0;
let INFO_ITEMS = [];
let INFO_CAN_EDIT = false;

let SHOP_ALL_ITEMS = [];
let SHOP_CATEGORY = null;
let SHOP_QTY_STATE = {};
let SHOP_BANK_BALANCE = 0;
let SHOP_PURCHASES = [];
let SHOP_LOAD_ERROR = null;

let TRAIN_ALL_SKILLS = [];
let TRAIN_CATEGORY = null;
let TRAIN_KNOWN = [];
let TRAIN_STATS = null;
let TRAIN_PURCHASES = [];
let TRAIN_SUMMARY = { spendable_sp: 0, hours_spent: 0 };
let TRAIN_BUDGET = 0;
let TRAIN_BROWSE_STATE = {};
let TRAIN_LOAD_ERROR = null;

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function fmtDateTime(d){
  return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function clampAmount(v){
  let n = parseInt(v, 10);
  if(isNaN(n)) n = 0;
  return Math.max(0, Math.min(100, n));
}

function ocAmountOptions(selected, labelFor){
  let html = '';
  for(let n = 0; n <= 100; n++){
    html += `<option value="${n}" ${n === selected ? 'selected' : ''}>${escapeHtml(labelFor(n))}</option>`;
  }
  return html;
}

function showError(el, msg){
  el.textContent = msg;
  el.style.display = 'block';
}

function renderNoEvent(){
  document.getElementById('ce-content').innerHTML = `<div class="panel"><div class="panel-body">${emptyState('No upcoming event is scheduled yet.')}</div></div>`;
}

async function renderShell(){
  LOG_STATUS = window.faLogStatus(EVENT);

  document.getElementById('ce-content').innerHTML = `
    <div class="panel">
      <div class="panel-head ce-event-head">
        <h2>${escapeHtml(EVENT.longLabel)}</h2>
        <span class="ce-logging-as" id="ce-logging-as"></span>
      </div>
      <div class="panel-body" id="ce-header-stats">${renderHeaderStatsHtml()}</div>
    </div>
    <div class="day-toggle" id="ce-tabs"></div>
    <div id="ce-tab-body"></div>
  `;

  renderTabBar();
  await renderTabBody();

  await loadRegistration();
}

async function loadRegistration(){
  if(LOG_STATUS.state !== 'open'){
    REG_CHECKED = true;
    if(ACTIVE_TAB !== 'info') await renderTabBody();
    return;
  }

  const me = window.faCurrentUser;
  let registrants;
  try{
    const res = await fetch(window.FA_REGISTRATION_ENDPOINT + '?action=list&event=' + encodeURIComponent(EVENT.label), { cache: 'no-store' });
    if(!res.ok) throw new Error('Registration check failed (' + res.status + ')');
    const data = await res.json();
    registrants = data.registrants || [];
  } catch(err){
    REG_ERROR = err.message;
    REG_CHECKED = true;
    if(ACTIVE_TAB !== 'info') await renderTabBody();
    return;
  }

  const mine = registrants.find(r => (r.email || '').trim().toLowerCase() === (me.email || '').trim().toLowerCase());
  REGISTERED_AS = mine ? mine.who : null;
  MY_CHARACTER = null;

  if(mine && mine.who === 'character'){
    const { data: chars } = await membersSupabase.from('characters').select('id, name, race').eq('player_id', me.id);
    MY_CHARACTER = (chars || []).find(c => c.name.trim().toLowerCase() === (mine.characterName || '').trim().toLowerCase()) || null;
  }

  if(REGISTERED_AS) await loadOcAndTraining();

  REG_CHECKED = true;

  const loggingAsLabel = REGISTERED_AS === 'character' && MY_CHARACTER
    ? MY_CHARACTER.name
    : (REGISTERED_AS === 'cast' ? 'Cast' : '');
  document.getElementById('ce-logging-as').textContent = loggingAsLabel ? `Logging as ${loggingAsLabel}` : '';

  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
  if(ACTIVE_TAB !== 'info') await renderTabBody();
}

async function loadOcAndTraining(){
  const tasks = [
    membersSupabase.from('oc_transactions').select('amount').eq('player_id', window.faCurrentUser.id),
    membersSupabase.rpc('event_log_oc_summary', { p_event_slug: EVENT.value })
  ];
  if(REGISTERED_AS === 'character' && MY_CHARACTER){
    TRAIN_BUDGET = window.faTrainingHoursBudget(EVENT);
    tasks.push(refreshTrainingState());
  }

  const [{ data: ocRows }, { data: summary }] = await Promise.all(tasks);

  OC_BALANCE = (ocRows || []).reduce((sum, r) => sum + Number(r.amount || 0), 0);
  SPENT = summary || { xp_spent: 0, copper_spent: 0 };
}

function renderHeaderStatsHtml(){
  const trainingTiles = (REGISTERED_AS === 'character' && MY_CHARACTER) ? `
    <div class="ce-stat"><div class="ce-stat-label">Hours Remaining</div><div class="ce-stat-value">${Math.max(0, TRAIN_BUDGET - TRAIN_SUMMARY.hours_spent)} / ${TRAIN_BUDGET}</div></div>
    <div class="ce-stat"><div class="ce-stat-label">Spendable SP</div><div class="ce-stat-value">${TRAIN_SUMMARY.spendable_sp}</div></div>
  ` : '';

  return `
    <div class="ce-header-stats">
      <div class="ce-stat"><div class="ce-stat-label">Your Ogre Chips</div><div class="ce-stat-value">${OC_BALANCE}</div></div>
      ${trainingTiles}
    </div>
  `;
}

function renderTabBar(){
  document.getElementById('ce-tabs').innerHTML = `
    <button class="${ACTIVE_TAB === 'info' ? 'active' : ''}" onclick="ce_selectTab('info')">Event Info</button>
    <button class="${ACTIVE_TAB === 'oc' ? 'active' : ''}" onclick="ce_selectTab('oc')">Spend OC</button>
    <button class="${ACTIVE_TAB === 'training' ? 'active' : ''}" onclick="ce_selectTab('training')">Training</button>
    <button class="${ACTIVE_TAB === 'shoppe' ? 'active' : ''}" onclick="ce_selectTab('shoppe')">Shoppe</button>
  `;
}

async function ce_selectTab(tab){
  ACTIVE_TAB = tab;
  renderTabBar();
  await renderTabBody();
}

async function renderTabBody(){
  const body = document.getElementById('ce-tab-body');

  if(ACTIVE_TAB === 'info'){
    await renderInfoBody();
    return;
  }

  if(!REG_CHECKED){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Checking your registration&hellip;</p></div></div>`;
    return;
  }

  if(REG_ERROR){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-error-note">Couldn't check your registration: ${escapeHtml(REG_ERROR)}</p></div></div>`;
    return;
  }

  if(LOG_STATUS.state !== 'open'){
    const label = LOG_STATUS.state === 'not-open'
      ? `The log for ${escapeHtml(EVENT.longLabel)} opens ${fmtDateTime(LOG_STATUS.opensAt)}.`
      : `The log for ${escapeHtml(EVENT.longLabel)} closed ${fmtDateTime(LOG_STATUS.closesAt)}.`;
    body.innerHTML = `<div class="panel"><div class="panel-body">${emptyState(label)}</div></div>`;
    return;
  }

  if(!REGISTERED_AS){
    body.innerHTML = `
      <div class="panel">
        <div class="panel-body">
          ${emptyState("You're not registered for this event yet.")}
          <a href="register.html"><button class="btn-gold">Register for This Event</button></a>
        </div>
      </div>
    `;
    return;
  }

  if(ACTIVE_TAB === 'oc'){
    body.innerHTML = renderOcHtml();
    return;
  }

  if(ACTIVE_TAB === 'shoppe'){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading the shop&hellip;</p></div></div>`;
    await loadShopData();
    renderShopBody();
    return;
  }

  if(REGISTERED_AS === 'cast'){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>Training</h2></div><div class="panel-body">${emptyState("You're registered as Cast this event, so there's no character to train.")}</div></div>`;
    return;
  }
  if(REGISTERED_AS === 'character' && !MY_CHARACTER){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>Training</h2></div><div class="panel-body">${emptyState('We could not match your registered character to one of your characters. Contact staff for help.')}</div></div>`;
    return;
  }

  body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading the skill list&hellip;</p></div></div>`;
  await loadTrainingData();
  renderTrainingBody();
}

function renderOcHtml(){
  let xpSection;
  if(REGISTERED_AS === 'character' && MY_CHARACTER){
    xpSection = `
      <div class="panel">
        <div class="panel-head"><h2>Convert OC to EXP</h2></div>
        <div class="panel-body">
          <div class="ce-stats">
            <div class="ce-stat"><div class="ce-stat-label">OC Used</div><div class="ce-stat-value">${SPENT.xp_spent}</div></div>
            <div class="ce-stat"><div class="ce-stat-label">EXP Gained</div><div class="ce-stat-value">${SPENT.xp_spent}</div></div>
          </div>
          <div>
            <label class="field-label" for="ce-xp-amount">OC to convert</label>
            <select id="ce-xp-amount" onchange="ce_updateXp()">${ocAmountOptions(SPENT.xp_spent, n => `${n} OC = ${n} XP`)}</select>
          </div>
          <p class="reg-error-note" id="ce-xp-error" style="display:none; margin-top:0.6rem;"></p>
        </div>
      </div>
    `;
  } else if(REGISTERED_AS === 'character'){
    xpSection = `
      <div class="panel">
        <div class="panel-head"><h2>Convert OC to EXP</h2></div>
        <div class="panel-body">${emptyState('We could not match your registered character to one of your characters. Contact staff for help.')}</div>
      </div>
    `;
  } else {
    xpSection = `
      <div class="panel">
        <div class="panel-head"><h2>Convert OC to EXP</h2></div>
        <div class="panel-body">${emptyState("You're registered as Cast this event, so there's no character to gain XP.")}</div>
      </div>
    `;
  }

  const copperSection = `
    <div class="panel">
      <div class="panel-head"><h2>Convert OC to Copper</h2></div>
      <div class="panel-body">
        <div class="ce-stats">
          <div class="ce-stat"><div class="ce-stat-label">OC Used</div><div class="ce-stat-value">${SPENT.copper_spent}</div></div>
          <div class="ce-stat"><div class="ce-stat-label">Copper Gained</div><div class="ce-stat-value">${SPENT.copper_spent * 10}</div></div>
        </div>
        <div>
          <label class="field-label" for="ce-copper-amount">OC to convert</label>
          <select id="ce-copper-amount" onchange="ce_updateCopper()">${ocAmountOptions(SPENT.copper_spent, n => `${n} OC = ${n * 10} Copper`)}</select>
        </div>
        <p class="reg-error-note" id="ce-copper-error" style="display:none; margin-top:0.6rem;"></p>
      </div>
    </div>
  `;

  return `<div class="ce-cols">${xpSection}${copperSection}</div>`;
}

async function ce_updateXp(){
  const select = document.getElementById('ce-xp-amount');
  const errorEl = document.getElementById('ce-xp-error');
  errorEl.style.display = 'none';
  const amount = clampAmount(select.value);

  const { error } = await membersSupabase.rpc('event_log_set_oc_spend', {
    p_event_slug: EVENT.value, p_kind: 'xp', p_character_id: MY_CHARACTER.id, p_oc_amount: amount
  });
  if(error){ select.value = SPENT.xp_spent; showError(errorEl, error.message); return; }

  await refreshAfterOcChange();
}

async function ce_updateCopper(){
  const select = document.getElementById('ce-copper-amount');
  const errorEl = document.getElementById('ce-copper-error');
  errorEl.style.display = 'none';
  const amount = clampAmount(select.value);

  const { error } = await membersSupabase.rpc('event_log_set_oc_spend', {
    p_event_slug: EVENT.value, p_kind: 'copper', p_character_id: null, p_oc_amount: amount
  });
  if(error){ select.value = SPENT.copper_spent; showError(errorEl, error.message); return; }

  await refreshAfterOcChange();
}

async function refreshAfterOcChange(){
  await loadOcAndTraining();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
  await renderTabBody();
}

// --- Event Info tab ---

async function renderInfoBody(){
  const body = document.getElementById('ce-tab-body');
  if(!INFO_LOADED){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading event info&hellip;</p></div></div>`;
    await loadInfoData();
  }
  renderInfoHtml();
}

async function loadInfoData(){
  INFO_ERROR = null;
  try{
    const [rosterRes, itemsResult, canEditResult] = await Promise.all([
      fetch(window.FA_REGISTRATION_ENDPOINT + '?action=list&event=' + encodeURIComponent(EVENT.label), { cache: 'no-store' })
        .then(res => { if(!res.ok) throw new Error('Roster check failed (' + res.status + ')'); return res.json(); }),
      membersSupabase.from('event_info_items').select('id, body, created_at').eq('event_slug', EVENT.value).order('created_at', { ascending: false }),
      membersSupabase.rpc('fa_is_plot_or_admin')
    ]);

    const registrants = rosterRes.registrants || [];
    const characterNames = registrants.filter(r => r.who === 'character').map(r => r.characterName).filter(Boolean);
    INFO_CAST_COUNT = registrants.filter(r => r.who === 'cast').length;

    INFO_ROSTER = characterNames.length
      ? (await membersSupabase.rpc('event_splash_roster', { p_character_names: characterNames })).data || []
      : [];
    INFO_ITEMS = itemsResult.data || [];
    INFO_CAN_EDIT = !!canEditResult.data;
  } catch(err){
    INFO_ERROR = err.message;
  }
  INFO_LOADED = true;
}

function renderInfoHtml(){
  const body = document.getElementById('ce-tab-body');

  if(INFO_ERROR){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-error-note">Couldn't load event info: ${escapeHtml(INFO_ERROR)}</p></div></div>`;
    return;
  }

  const rosterRows = INFO_ROSTER.map(r => {
    const trades = r.trades || [];
    const tradesLabel = trades.length
      ? trades.map(t => `${escapeHtml(t.name)}${t.focus ? ' (' + escapeHtml(t.focus) + ')' : ''} - Level ${t.level}`).join(', ')
      : (r.hide_trades ? 'Hidden' : 'None');
    return `<tr><td>${escapeHtml(r.character_name)}</td><td>${tradesLabel}</td></tr>`;
  }).join('');

  const rosterSection = `
    <div class="panel">
      <div class="panel-head"><h2>Who's Coming</h2></div>
      <div class="panel-body">
        ${INFO_ROSTER.length ? `
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>Character</th><th>Trades</th></tr></thead>
              <tbody>${rosterRows}</tbody>
            </table>
          </div>
        ` : emptyState('No one has registered for this event yet.')}
        ${INFO_CAST_COUNT ? `<p class="page-subhead" style="margin-top:0.8rem;">Plus ${INFO_CAST_COUNT} Cast member${INFO_CAST_COUNT === 1 ? '' : 's'}.</p>` : ''}
      </div>
    </div>
  `;

  const itemsHtml = INFO_ITEMS.length ? INFO_ITEMS.map(item => `
    <div class="ce-info-item">
      <p>${escapeHtml(item.body)}</p>
      ${INFO_CAN_EDIT ? `<button class="btn-outline" onclick="ce_infoDelete('${item.id}')">Delete</button>` : ''}
    </div>
  `).join('') : emptyState('No updates posted yet.');

  const infoSection = `
    <div class="panel">
      <div class="panel-head"><h2>Event Updates</h2></div>
      <div class="panel-body">
        ${INFO_CAN_EDIT ? `
          <div style="margin-bottom:1rem;">
            <label class="field-label" for="ce-info-new-body">Post an Update</label>
            <textarea id="ce-info-new-body" placeholder="Anything players should know about this event"></textarea>
            <button class="btn-gold" style="margin-top:0.6rem;" onclick="ce_infoPost()">Post Update</button>
            <p class="reg-error-note" id="ce-info-post-error" style="display:none; margin-top:0.6rem;"></p>
          </div>
        ` : ''}
        <div id="ce-info-items">${itemsHtml}</div>
      </div>
    </div>
  `;

  body.innerHTML = `<div class="ce-cols">${rosterSection}${infoSection}</div>`;
}

async function ce_infoPost(){
  const textarea = document.getElementById('ce-info-new-body');
  const errorEl = document.getElementById('ce-info-post-error');
  errorEl.style.display = 'none';
  const body = textarea.value.trim();
  if(!body){ showError(errorEl, 'Update cannot be empty.'); return; }

  const { error } = await membersSupabase.rpc('event_info_post', { p_event_slug: EVENT.value, p_body: body });
  if(error){ showError(errorEl, error.message); return; }

  INFO_LOADED = false;
  await renderInfoBody();
}

async function ce_infoDelete(id){
  const { error } = await membersSupabase.rpc('event_info_delete', { p_id: id });
  if(error){ alert(error.message); return; }

  INFO_LOADED = false;
  await renderInfoBody();
}

// --- Shoppe tab ---

async function loadShopData(){
  SHOP_LOAD_ERROR = null;
  try{
    if(!SHOP_ALL_ITEMS.length){
      SHOP_ALL_ITEMS = await shoppeLoadFromSheet();
      const categories = shoppeOrderedCategories(SHOP_ALL_ITEMS);
      SHOP_CATEGORY = categories.length ? categories[0] : null;
    }
    const [{ data: balance }, { data: purchases }] = await Promise.all([
      membersSupabase.rpc('bank_my_balance'),
      membersSupabase.from('shoppe_purchases').select('id, category, item_name, unit_cost_copper, quantity, total_cost_copper')
        .eq('player_id', window.faCurrentUser.id).eq('event_slug', EVENT.value).order('created_at', { ascending: true })
    ]);
    SHOP_BANK_BALANCE = balance || 0;
    SHOP_PURCHASES = purchases || [];
  } catch(err){
    SHOP_LOAD_ERROR = err.message;
  }
}

    <tr>

  `).join('');

  return `
    <div class="panel">
      <div class="panel-head"><h2>Purchased This Event</h2></div>
      <div class="panel-body">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Cost</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderShopBody(){
  const body = document.getElementById('ce-tab-body');

  if(SHOP_LOAD_ERROR){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>Shoppe</h2></div><div class="panel-body"><p class="reg-error-note">Couldn't load the shop: ${escapeHtml(SHOP_LOAD_ERROR)}</p></div></div>`;
    return;
  }

  body.innerHTML = `
    ${renderShopPurchasesHtml()}
    <div class="panel">
      <div class="panel-head ce-event-head">
        <h2>The Shoppe</h2>
        <span class="ce-logging-as">Your Copper: ${SHOP_BANK_BALANCE}</span>
      </div>
      <div class="panel-body">
        <div class="day-toggle" id="ce-shop-cat-tabs"></div>
        <div class="shop-grid" id="ce-shop-grid"></div>
        <p class="reg-error-note" id="ce-shop-error" style="display:none; margin-top:0.6rem;"></p>
      </div>
    </div>
  `;

  renderShopGrid();
}

function renderShopCatTabs(){
  const categories = shoppeOrderedCategories(SHOP_ALL_ITEMS);
  document.getElementById('ce-shop-cat-tabs').innerHTML = categories.map(cat =>
    `<button class="${cat === SHOP_CATEGORY ? 'active' : ''}" onclick="ce_shopSelectCategory('${cat.replace(/'/g, "\\'")}')">${escapeHtml(cat)}</button>`
  ).join('');
}

function ce_shopSelectCategory(cat){
  SHOP_CATEGORY = cat;
  renderShopCatTabs();
  renderShopGrid();
}

function renderShopGrid(){
  const items = SHOP_ALL_ITEMS.filter(i => i.category === SHOP_CATEGORY);

  document.getElementById('ce-shop-grid').innerHTML = items.length ? items.map(item => {
    const key = item.category + '::' + item.name;
    SHOP_QTY_STATE[key] = SHOP_QTY_STATE[key] || 1;
    const qty = SHOP_QTY_STATE[key];
    const total = item.costCopper * qty;
    const canAfford = total <= SHOP_BANK_BALANCE;
    const keyEsc = key.replace(/'/g, "\\'");

    return `
      <div class="shop-card">
        <div class="shop-card-name">${escapeHtml(item.name)}</div>
        <div class="shop-card-price">${item.costCopper} Copper</div>
        <div class="shop-card-actions">
          <input type="number" min="1" value="${qty}" class="shop-qty" onchange="ce_shopUpdateQty('${keyEsc}', this.value)">
          <button class="btn-outline" style="flex:1;" ${canAfford ? '' : 'disabled'} onclick="ce_shopBuy('${item.category.replace(/'/g, "\\'")}', '${item.name.replace(/'/g, "\\'")}', ${item.costCopper})">Buy (${total})</button>
        </div>
      </div>
    `;
  }).join('') : `<p class="reg-empty-note">Nothing in this category yet.</p>`;
}

function ce_shopUpdateQty(key, val){
  let n = parseInt(val, 10);
  if(isNaN(n) || n < 1) n = 1;
  SHOP_QTY_STATE[key] = n;
  renderShopGrid();
}

async function ce_shopBuy(category, itemName, unitCost){
  const errorEl = document.getElementById('ce-shop-error');
  errorEl.style.display = 'none';
  const key = category + '::' + itemName;
  const qty = SHOP_QTY_STATE[key] || 1;

  const { error } = await membersSupabase.rpc('shoppe_buy_item', {
    p_event_slug: EVENT.value,
    p_character_id: (REGISTERED_AS === 'character' && MY_CHARACTER) ? MY_CHARACTER.id : null,
    p_category: category,
    p_item_name: itemName,
    p_unit_cost_copper: unitCost,
    p_quantity: qty
  });
  if(error){ showError(errorEl, error.message); return; }

  delete SHOP_QTY_STATE[key];
  await loadShopData();
  renderShopBody();
}

async function ce_shopCancel(purchaseId){
  const { error } = await membersSupabase.rpc('shoppe_cancel_purchase', { p_purchase_id: purchaseId });
  if(error){ alert(error.message); return; }

  await loadShopData();
  renderShopBody();
}

// --- Training tab ---

async function ensureTrainingCatalogLoaded(){
  if(TRAIN_ALL_SKILLS.length) return;
  TRAIN_ALL_SKILLS = await skillsLoadFromSheet();
  const categories = skillsOrderedCategories(TRAIN_ALL_SKILLS);
  TRAIN_CATEGORY = categories.length ? categories[0] : null;
}

async function refreshTrainingState(){
  const [{ data: skillRows }, { data: summary }, { data: purchases }] = await Promise.all([
    membersSupabase.from('character_skills').select('id, category, skill_name, focus, level, sp_cost').eq('character_id', MY_CHARACTER.id),
    membersSupabase.rpc('event_log_training_summary', { p_event_slug: EVENT.value, p_character_id: MY_CHARACTER.id }),
    membersSupabase.from('event_log_training_purchases').select('id, category, skill_name, focus, level, sp_cost, hours_cost, is_relevel, prev_level')
      .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value).order('created_at', { ascending: true })
  ]);
  TRAIN_KNOWN = (skillRows || []).map(sk => ({ id: sk.id, category: sk.category, title: sk.skill_name, focus: sk.focus || '', level: sk.level, spCost: sk.sp_cost }));
  TRAIN_STATS = faDeriveStats(MY_CHARACTER.race, TRAIN_KNOWN.map(k => ({ name: k.title, level: k.level })));
  TRAIN_SUMMARY = summary || { spendable_sp: 0, hours_spent: 0 };
  TRAIN_PURCHASES = purchases || [];
  TRAIN_BUDGET = window.faTrainingHoursBudget(EVENT);
}

async function loadTrainingData(){
  TRAIN_LOAD_ERROR = null;
  try{
    await ensureTrainingCatalogLoaded();
    await refreshTrainingState();
  } catch(err){
    TRAIN_LOAD_ERROR = err.message;
  }
}

function ce_trainFindKnown(category, title, focus){
  const norm = s => (s || '').trim().toLowerCase();
  return TRAIN_KNOWN.find(k => norm(k.category) === norm(category) && norm(k.title) === norm(title) && norm(k.focus) === norm(focus)) || null;
}

function renderLearningListHtml(){
  if(!TRAIN_PURCHASES.length) return '';
  const rows = TRAIN_PURCHASES.map(p => {
    const levelLabel = p.is_relevel ? `${p.prev_level} &rarr; ${p.level}` : `${p.level}`;
    const costLabel = p.is_relevel ? `+${p.sp_cost} SP (+${p.hours_cost} hrs)` : `${p.sp_cost} SP (${p.hours_cost} hrs)`;
    return `
      <tr>
        <td>${escapeHtml(p.skill_name)}${p.focus ? ' (' + escapeHtml(p.focus) + ')' : ''}</td>
        <td>${escapeHtml(p.category)}</td>
        <td>${levelLabel}</td>
        <td>${costLabel}</td>
        <td><button class="btn-outline" onclick="ce_trainCancel('${p.id}')" title="Cancel this training">&times;</button></td>
      </tr>
    `;
  }).join('');

  return `
    <div class="panel">
      <div class="panel-head"><h2>Learning Skills</h2></div>
      <div class="panel-body">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Skill</th><th>Type</th><th>Level</th><th>Cost</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderTrainingBody(){
  const body = document.getElementById('ce-tab-body');

  if(TRAIN_LOAD_ERROR){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>Training</h2></div><div class="panel-body"><p class="reg-error-note">Couldn't load the skill list: ${escapeHtml(TRAIN_LOAD_ERROR)}</p></div></div>`;
    return;
  }

  body.innerHTML = `
    ${renderLearningListHtml()}
    <div class="panel">
      <div class="panel-head"><h2>Training</h2></div>
      <div class="panel-body">
        <div class="day-toggle" id="ce-train-cat-tabs"></div>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Skill</th><th>Cost</th><th>Focus / Level</th><th></th></tr></thead>
            <tbody id="ce-train-browser-body"></tbody>
          </table>
        </div>
        <p class="reg-error-note" id="ce-train-error" style="display:none; margin-top:0.6rem;"></p>
      </div>
    </div>
  `;

  renderTrainCatTabs();
  renderTrainBrowser();
}

function renderTrainCatTabs(){
  const categories = skillsOrderedCategories(TRAIN_ALL_SKILLS);
  document.getElementById('ce-train-cat-tabs').innerHTML = categories.map(cat =>
    `<button class="${cat === TRAIN_CATEGORY ? 'active' : ''}" onclick="ce_trainSelectCategory('${cat.replace(/'/g, "\\'")}')">${escapeHtml(cat)}</button>`
  ).join('');
}

function ce_trainSelectCategory(cat){
  TRAIN_CATEGORY = cat;
  renderTrainCatTabs();
  renderTrainBrowser();
}

function ce_trainRowState(idx){
  const s = TRAIN_ALL_SKILLS[idx];
  const key = skillKey(s);
  TRAIN_BROWSE_STATE[key] = TRAIN_BROWSE_STATE[key] || { focus: '' };
  return { s, key, state: TRAIN_BROWSE_STATE[key] };
}

function trainFocusFieldHtml(idx, s, state, isLeveled, focusLocked){
  const parts = skillNameParts(s.title);
  const widthStyle = `style="max-width:${isLeveled ? 140 : 180}px;display:inline-block;${isLeveled ? 'margin-right:0.5rem;' : ''}"`;

  if(focusLocked) return `<span ${widthStyle}>${escapeHtml(focusLocked)}</span>`;

  const options = focusOptionsFor(s, TRAIN_ALL_SKILLS, TRAIN_KNOWN);

  if(options){
    return `<select onchange="ce_trainUpdateFocus(${idx}, this.value)" ${widthStyle}>`
      + `<option value="">Choose&hellip;</option>`
      + options.map(o => `<option value="${escapeHtml(o)}" ${state.focus === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')
      + `</select>`;
  }
  return `<input type="text" placeholder="${escapeHtml(parts.placeholder)}" value="${escapeHtml(state.focus)}" oninput="ce_trainUpdateFocus(${idx}, this.value)" ${widthStyle}>`;
}

// Resolves everything needed to render or act on one browse row: the
// matching known skill (if any), whether acting on it is a relevel,
// the level to act on (auto-detected: the next level up from whatever
// is already known, or level 1 if it isn't known at all), and the
// delta cost in SP/Hours (the delta equals the full cost for a
// brand-new skill, since there's nothing to subtract).
function ce_trainRowInfo(idx){
  const { s, state } = ce_trainRowState(idx);
  const parts = skillNameParts(s.title);
  const isLeveled = isLeveledCost(s.cost);

  const focusLocked = parts.base === 'Clerical Investment' ? clericalInvestmentLockedFocus(TRAIN_KNOWN) : null;
  if(focusLocked) state.focus = focusLocked;
  const focusVal = focusLocked || (parts.placeholder ? state.focus.trim() : '');

  const known = (parts.placeholder && !focusVal) ? null : ce_trainFindKnown(s.category, parts.base, focusVal);
  const isRelevel = isLeveled && !!known;

  const level = isLeveled ? (known ? known.level + 1 : 1) : 1;

  const hoursRemaining = Math.max(0, TRAIN_BUDGET - TRAIN_SUMMARY.hours_spent);
  const spendableSp = TRAIN_SUMMARY.spendable_sp;

  const cost = skillsParseCost(s.cost, level);
  const deltaSp = cost === null ? null : (isRelevel ? cost - known.spCost : cost);
  const deltaHours = deltaSp === null ? null : deltaSp * 5;

  const missing = unmetPrereqText(s.prereq, TRAIN_KNOWN, TRAIN_STATS);
  const alreadyKnownFlat = !isLeveled && !!known;
  const canAct = !missing && deltaSp !== null && deltaSp > 0 && deltaSp <= spendableSp && deltaHours <= hoursRemaining
    && !(parts.placeholder && !focusVal) && !alreadyKnownFlat;

  return { s, parts, state, isLeveled, focusVal, focusLocked, known, isRelevel, level, cost, deltaSp, deltaHours, missing, alreadyKnownFlat, canAct };
}

function trainCostLabel(info){
  if(info.alreadyKnownFlat) return '-';
  if(info.deltaSp === null) return info.s.cost;
  return info.isRelevel ? `+${info.deltaSp} SP (+${info.deltaHours} hrs)` : `${info.deltaSp} SP (${info.deltaHours} hrs)`;
}

function renderTrainBrowser(){
  const rows = TRAIN_ALL_SKILLS
    .map((s, idx) => ({ s, idx }))
    .filter(({ s }) => s.category === TRAIN_CATEGORY)
    .filter(({ s }) => {
      const parts = skillNameParts(s.title);
      if(parts.placeholder || isLeveledCost(s.cost)) return true;
      return !ce_trainFindKnown(s.category, parts.base, '');
    });

  document.getElementById('ce-train-browser-body').innerHTML = rows.length ? rows.map(({ idx }) => {
    const info = ce_trainRowInfo(idx);
    const { s, parts, state, isLeveled } = info;

    let focusCell = '-';
    if(parts.placeholder && isLeveled){
      focusCell = trainFocusFieldHtml(idx, s, state, true, info.focusLocked) + `<span style="margin-left:0.5rem;">Level ${info.level}</span>`;
    } else if(parts.placeholder){
      focusCell = trainFocusFieldHtml(idx, s, state, false, info.focusLocked);
    } else if(isLeveled){
      focusCell = `Level ${info.level}`;
    }

    const nameLabel = escapeHtml(parts.base)
      + (info.isRelevel ? ` <span class="reg-empty-note" style="display:inline;">(currently level ${info.known.level})</span>` : '')
      + (info.missing ? `<span class="skill-missing-prereq">Requires: ${escapeHtml(info.missing)}</span>` : '');
    const actionLabel = info.alreadyKnownFlat ? 'Known' : (info.isRelevel ? 'Level Up' : 'Learn');

    return `
      <tr class="${info.missing ? 'skill-row-locked' : ''}">
        <td>${nameLabel}</td>
        <td id="ce-train-cost-${idx}">${escapeHtml(trainCostLabel(info))}</td>
        <td>${focusCell}</td>
        <td><button class="btn-outline" id="ce-train-learn-${idx}" ${info.canAct ? '' : 'disabled'} onclick="ce_trainAct(${idx})">${actionLabel}</button></td>
      </tr>
    `;
  }).join('') : `<tr><td colspan="4">Nothing left to learn in this category.</td></tr>`;
}

function ce_trainUpdateRowLive(idx){
  const info = ce_trainRowInfo(idx);

  const costEl = document.getElementById('ce-train-cost-' + idx);
  if(costEl) costEl.textContent = trainCostLabel(info);

  const btn = document.getElementById('ce-train-learn-' + idx);
  if(btn){
    btn.disabled = !info.canAct;
    btn.textContent = info.alreadyKnownFlat ? 'Known' : (info.isRelevel ? 'Level Up' : 'Learn');
  }
}

function ce_trainUpdateFocus(idx, val){
  const { state } = ce_trainRowState(idx);
  state.focus = val;
  ce_trainUpdateRowLive(idx);
}

async function ce_trainAct(idx){
  const errorEl = document.getElementById('ce-train-error');
  errorEl.style.display = 'none';
  const info = ce_trainRowInfo(idx);
  if(!info.canAct) return;
  const { s, parts, isRelevel, known, level, cost, focusVal } = info;
  const { key } = ce_trainRowState(idx);

  const { error } = isRelevel
    ? await membersSupabase.rpc('event_log_relevel_skill', {
        p_event_slug: EVENT.value,
        p_character_id: MY_CHARACTER.id,
        p_hours_budget: TRAIN_BUDGET,
        p_character_skill_id: known.id,
        p_new_level: level,
        p_new_sp_cost: cost
      })
    : await membersSupabase.rpc('event_log_train_skill', {
        p_event_slug: EVENT.value,
        p_character_id: MY_CHARACTER.id,
        p_hours_budget: TRAIN_BUDGET,
        p_category: s.category,
        p_skill_name: parts.base,
        p_focus: parts.placeholder ? focusVal : null,
        p_level: isLeveledCost(s.cost) ? level : 1,
        p_sp_cost: cost
      });

  if(error){ showError(errorEl, error.message); return; }

  delete TRAIN_BROWSE_STATE[key];
  await refreshTrainingState();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
  renderTrainingBody();
}

async function ce_trainCancel(purchaseId){
  const { error } = await membersSupabase.rpc('event_log_cancel_training', { p_purchase_id: purchaseId });
  if(error){ alert(error.message); return; }

  await refreshTrainingState();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
  renderTrainingBody();
}
