<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current Event - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Current Event - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/current-event.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Current Event - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.ce-cols{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.2rem;
  align-items: start;
}
.ce-event-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.ce-logging-as{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--brown-dark);
}
.ce-allowance-note{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--gold-dark);
  margin: 0 0 0.8rem;
}
.ce-stats{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  margin-bottom: 1.2rem;
}
.ce-header-stats{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
}
.ce-register-cta{
  text-align: center;
  padding: 0.5rem 0;
}
.ce-register-cta p{
  margin: 0 0 0.8rem;
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--brown-dark);
}
.ce-register-btn{
  font-size: 1.15rem;
  padding: 0.9rem 2.2rem;
}
.ce-stat{
  border: 2px solid var(--line);
  background: var(--row-b);
  padding: 0.9rem 1.1rem;
}
.ce-stat-label{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 0.3rem;
}
.ce-stat-value{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--ink);
}
@media (max-width: 800px){
  .ce-cols{ grid-template-columns: 1fr; }
}
@media (max-width: 600px){
  .ce-stats{ grid-template-columns: 1fr; }
}
.ce-info-item{
  border-bottom: 1px solid var(--line);
  padding: 0.8rem 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap: 0.8rem;
}
.ce-info-item:last-child{ border-bottom: none; }
.ce-info-item p{ margin: 0; white-space: pre-wrap; }
.shop-item-name{ text-align: left; }
.shop-qty{
  width: 50px;
  text-align: center;
  padding: 0.25rem;
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Current Event</h1>

<div id="ce-content"><p class="reg-empty-note">Loading&hellip;</p></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script src="js/xp-convert.js"></script>
<script src="js/skills-data.js"></script>
<script src="js/skills-catalog.js"></script>
<script src="js/character-stats.js"></script>
<script src="js/shoppe-data.js"></script>
<script src="js/crafting-data.js"></script>
<script>
(function(){
let EVENT = null;
let LOG_STATUS = null;
let REG_CHECKED = false;
let REG_ERROR = null;
let REGISTERED_AS = null;
let MY_CHARACTER = null;
let OC_BALANCE = 0;
let COPPER_BALANCE = 0;
let OC_CAP = 100;
let SPENT = { xp_spent: 0, copper_spent: 0 };
let ALLOWANCE_JUST_GRANTED = null;
let ACTIVE_TAB = 'info';

let INFO_LOADED = false;
let INFO_ERROR = null;
let INFO_ROSTER = [];
let INFO_CAST_COUNT = 0;
let INFO_ITEMS = [];
let INFO_CAN_EDIT = false;
let INFO_TAGS_OWED = [];
let INFO_TAGS_RECEIVING = [];

let SHOP_ALL_ITEMS = [];
let SHOP_CATEGORY = null;
let SHOP_SEARCH = '';
let SHOP_QTY_STATE = {};
let SHOP_BANK_BALANCE = 0;
let SHOP_MERCHANT_LEVEL = 0;
let SHOP_PURCHASES = [];
let SHOP_LOAD_ERROR = null;
let SHOP_PRICE_TIERS = [];
let SHOP_SALES = [];
let SHOP_TRIPS = new Set();
let SHOP_INVENTORY = [];
let SELL_QTY_STATE = {};
let INV_SELL_QTY_STATE = {};

let TRAIN_ALL_SKILLS = [];
let TRAIN_CATEGORY = null;
let TRAIN_KNOWN = [];
let TRAIN_STATS = null;
let TRAIN_PURCHASES = [];
let TRAIN_SUMMARY = { spendable_sp: 0, hours_spent: 0 };
let TRAIN_BUDGET = 0;
let TRAIN_BROWSE_STATE = {};
let TRAIN_LOAD_ERROR = null;
let TRAIN_TAUGHT = new Set();

let WORK_SESSIONS = [];
let WORK_LOAD_ERROR = null;

let CRAFT_ALL_ITEMS = [];
let CRAFT_TRADE = null;
let CRAFT_SEARCH = '';
let CRAFT_LOG = [];
let CRAFT_INVENTORY = [];
let CRAFT_TAG_STATE = {};
let CRAFT_LOAD_ERROR = null;

let LUX_ITEMS = [];
let LUX_OWNED = new Set();
let LUX_LOAD_ERROR = null;

let OTHER_TASK_LOG = [];
let OTHER_TASK_LOAD_ERROR = null;
let OTHER_TASK_DESC = '';
let OTHER_TASK_HOURS = '';

let UPKEEP_LOG = [];
let UPKEEP_DESC = '';
let UPKEEP_COST = '';
let UPKEEP_REPEATING = false;

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function fmtDateTime(d){
  return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function clampAmount(v){
  let n = parseInt(v, 10);
  if(isNaN(n)) n = 0;
  return Math.max(0, Math.min(OC_CAP, n));
}

function ocAmountOptions(selected, labelFor){
  let html = '';
  for(let n = 0; n <= OC_CAP; n++){
    html += `<option value="${n}" ${n === selected ? 'selected' : ''}>${escapeHtml(labelFor(n))}</option>`;
  }
  return html;
}

function showError(el, msg){
  el.textContent = msg;
  el.style.display = 'block';
}

function renderNoEvent(){
  document.getElementById('ce-content').innerHTML = `<div class="panel"><div class="panel-body">${emptyState('No upcoming event is scheduled yet.')}</div></div>`;
}

async function renderShell(){
  LOG_STATUS = window.faLogStatus(EVENT);

  document.getElementById('ce-content').innerHTML = `
    <div class="panel">
      <div class="panel-head ce-event-head">
        <h2>${escapeHtml(EVENT.longLabel)}</h2>
        <span class="ce-logging-as" id="ce-logging-as"></span>
      </div>
      <div class="panel-body" id="ce-header-stats">${renderHeaderStatsHtml()}</div>
    </div>
    <div class="day-toggle" id="ce-tabs"></div>
    <div id="ce-tab-body"></div>
  `;

  renderTabBar();
  await renderTabBody();

  await loadRegistration();
}

async function loadRegistration(){
  if(LOG_STATUS.state !== 'open'){
    REG_CHECKED = true;
    if(ACTIVE_TAB !== 'info') await renderTabBody();
    return;
  }

  const me = window.faCurrentUser;
  let registrants;
  try{
    const { data, error } = await membersSupabase.rpc('event_roster', { p_event_slug: EVENT.value });
    if(error) throw new Error(error.message);
    registrants = data || [];
  } catch(err){
    REG_ERROR = err.message;
    REG_CHECKED = true;
    if(ACTIVE_TAB !== 'info') await renderTabBody();
    return;
  }

  const mine = registrants.find(r => r.player_id === me.id);
  REGISTERED_AS = mine ? mine.who : null;
  MY_CHARACTER = null;

  if(mine && mine.who === 'character'){
    const { data: chars } = await membersSupabase.from('characters').select('id, name, race, social_class').eq('player_id', me.id);
    MY_CHARACTER = (chars || []).find(c => c.id === mine.character_id) || null;
  }

  if(REGISTERED_AS) await loadOcAndTraining();

  REG_CHECKED = true;

  const loggingAsLabel = REGISTERED_AS === 'character' && MY_CHARACTER
    ? MY_CHARACTER.name
    : (REGISTERED_AS === 'cast' ? 'Cast' : '');
  document.getElementById('ce-logging-as').textContent = loggingAsLabel ? `Logging as ${loggingAsLabel}` : '';

  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
  if(ACTIVE_TAB !== 'info'){
    await renderTabBody();
  } else if(REGISTERED_AS === 'character' && MY_CHARACTER){
    await loadEventInfoTags();
    renderInfoHtml();
  }
}

async function loadOcAndTraining(){
  const tasks = [
    membersSupabase.from('oc_transactions').select('amount').eq('player_id', window.faCurrentUser.id),
    membersSupabase.rpc('event_log_oc_summary', { p_event_slug: EVENT.value }),
    membersSupabase.rpc('flex_pass_my_balance')
  ];
  if(REGISTERED_AS === 'character' && MY_CHARACTER){
    TRAIN_BUDGET = window.faTrainingHoursBudget(EVENT);
    tasks.push(refreshTrainingState());
    tasks.push(claimAllowance());
  }

  const [{ data: ocRows }, { data: summary }, { data: flexBalance }] = await Promise.all(tasks);

  OC_BALANCE = (ocRows || []).reduce((sum, r) => sum + Number(r.amount || 0), 0);
  SPENT = summary || { xp_spent: 0, copper_spent: 0 };
  const flex = (flexBalance && flexBalance[0]) || { event_credits: 0, meal_credits: 0 };
  OC_CAP = (flex.event_credits > 0 || flex.meal_credits > 0) ? 150 : 100;

  // Fetched after claimAllowance() (above) has already settled, so a
  // just-granted allowance is reflected in this total, not one request
  // behind it.
  const { data: copperBalance } = await membersSupabase.rpc('bank_my_balance');
  COPPER_BALANCE = Number(copperBalance || 0);
}

// A Social Class allowance is a standing entitlement, not something a
// player opts into, so it's claimed automatically (once per character
// per event) rather than needing its own tab or button.
async function claimAllowance(){
  const { data } = await membersSupabase.rpc('event_log_claim_allowance', {
    p_event_slug: EVENT.value, p_character_id: MY_CHARACTER.id
  });
  ALLOWANCE_JUST_GRANTED = (data === null || data === undefined) ? null : Number(data);
}

function renderHeaderStatsHtml(){
  if(LOG_STATUS.state === 'open' && REG_CHECKED && !REGISTERED_AS){
    return `
      <div class="ce-register-cta">
        <p>You're not registered for this event yet.</p>
        <a href="register.html"><button class="btn-gold ce-register-btn">Register for This Event</button></a>
      </div>
    `;
  }

  const trainingTiles = (REGISTERED_AS === 'character' && MY_CHARACTER) ? `
    <div class="ce-stat"><div class="ce-stat-label">Hours Remaining</div><div class="ce-stat-value">${Math.max(0, TRAIN_BUDGET - TRAIN_SUMMARY.hours_spent)} / ${TRAIN_BUDGET}</div></div>
    <div class="ce-stat"><div class="ce-stat-label">Spendable SP</div><div class="ce-stat-value">${TRAIN_SUMMARY.spendable_sp}</div></div>
  ` : '';

  const allowanceNote = ALLOWANCE_JUST_GRANTED
    ? `<p class="ce-allowance-note">${escapeHtml(MY_CHARACTER.name)} received ${ALLOWANCE_JUST_GRANTED} Copper as their ${escapeHtml(MY_CHARACTER.social_class || 'Yeoman')} allowance for this event.</p>`
    : '';

  const adjustment = (REGISTERED_AS === 'character' && MY_CHARACTER) ? (TRAIN_SUMMARY.hours_adjustment || 0) : 0;
  const hoursAdjustmentNote = adjustment
    ? `<p class="ce-allowance-note">Logistics ${adjustment > 0 ? 'added' : 'removed'} ${Math.abs(adjustment)} downtime Hours for this event.</p>`
    : '';

  return `
    ${allowanceNote}
    ${hoursAdjustmentNote}
    <div class="ce-header-stats">
      <div class="ce-stat"><div class="ce-stat-label">Your Ogre Chips</div><div class="ce-stat-value">${OC_BALANCE}</div></div>
      <div class="ce-stat"><div class="ce-stat-label">Your Copper</div><div class="ce-stat-value">${COPPER_BALANCE}</div></div>
      ${trainingTiles}
    </div>
  `;
}

function renderTabBar(){
  document.getElementById('ce-tabs').innerHTML = `
    <button class="${ACTIVE_TAB === 'info' ? 'active' : ''}" onclick="ce_selectTab('info')">Event Info</button>
    <button class="${ACTIVE_TAB === 'oc' ? 'active' : ''}" onclick="ce_selectTab('oc')">Spend OC</button>
    <button class="${ACTIVE_TAB === 'training' ? 'active' : ''}" onclick="ce_selectTab('training')">Training</button>
    <button class="${ACTIVE_TAB === 'work' ? 'active' : ''}" onclick="ce_selectTab('work')">Work</button>
    <button class="${ACTIVE_TAB === 'crafting' ? 'active' : ''}" onclick="ce_selectTab('crafting')">Crafting</button>
    <button class="${ACTIVE_TAB === 'other' ? 'active' : ''}" onclick="ce_selectTab('other')">Other Task</button>
    <button class="${ACTIVE_TAB === 'shoppe' ? 'active' : ''}" onclick="ce_selectTab('shoppe')">Shoppe</button>
    <button class="${ACTIVE_TAB === 'luxuries' ? 'active' : ''}" onclick="ce_selectTab('luxuries')">Luxuries</button>
  `;
}

async function ce_selectTab(tab){
  ACTIVE_TAB = tab;
  renderTabBar();
  await renderTabBody();
}

async function renderTabBody(){
  const body = document.getElementById('ce-tab-body');

  if(ACTIVE_TAB === 'info'){
    await renderInfoBody();
    return;
  }

  if(!REG_CHECKED){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Checking your registration&hellip;</p></div></div>`;
    return;
  }

  if(REG_ERROR){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-error-note">Couldn't check your registration: ${escapeHtml(REG_ERROR)}</p></div></div>`;
    return;
  }

  if(LOG_STATUS.state !== 'open'){
    const label = LOG_STATUS.state === 'not-open'
      ? `The log for ${escapeHtml(EVENT.longLabel)} opens ${fmtDateTime(LOG_STATUS.opensAt)}.`
      : `The log for ${escapeHtml(EVENT.longLabel)} closed ${fmtDateTime(LOG_STATUS.closesAt)}.`;
    body.innerHTML = `<div class="panel"><div class="panel-body">${emptyState(label)}</div></div>`;
    return;
  }

  if(!REGISTERED_AS){
    body.innerHTML = `
      <div class="panel">
        <div class="panel-body">
          ${emptyState("You're not registered for this event yet.")}
          <a href="register.html"><button class="btn-gold">Register for This Event</button></a>
        </div>
      </div>
    `;
    return;
  }

  if(ACTIVE_TAB === 'oc'){
    body.innerHTML = renderOcHtml();
    return;
  }

  if(ACTIVE_TAB === 'shoppe'){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading the shop&hellip;</p></div></div>`;
    await loadShopData();
    renderShopBody();
    return;
  }

  const tabLabel = ACTIVE_TAB === 'work' ? 'Work' : (ACTIVE_TAB === 'crafting' ? 'Crafting' : (ACTIVE_TAB === 'luxuries' ? 'Luxuries' : (ACTIVE_TAB === 'other' ? 'Other Task' : 'Training')));
  const tabVerb = ACTIVE_TAB === 'work' ? 'work' : (ACTIVE_TAB === 'crafting' ? 'craft' : (ACTIVE_TAB === 'luxuries' ? 'declare Luxuries for' : (ACTIVE_TAB === 'other' ? 'log a task for' : 'train')));
  if(REGISTERED_AS === 'cast'){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>${tabLabel}</h2></div><div class="panel-body">${emptyState(`You're registered as Cast this event, so there's no character to ${tabVerb}.`)}</div></div>`;
    return;
  }
  if(REGISTERED_AS === 'character' && !MY_CHARACTER){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>${tabLabel}</h2></div><div class="panel-body">${emptyState('We could not match your registered character to one of your characters. Contact staff for help.')}</div></div>`;
    return;
  }

  if(ACTIVE_TAB === 'work'){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading&hellip;</p></div></div>`;
    await loadWorkData();
    renderWorkHtml();
    return;
  }

  if(ACTIVE_TAB === 'crafting'){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading&hellip;</p></div></div>`;
    await loadCraftData();
    renderCraftHtml();
    return;
  }

  if(ACTIVE_TAB === 'luxuries'){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading&hellip;</p></div></div>`;
    await loadLuxuriesData();
    renderLuxuriesHtml();
    return;
  }

  if(ACTIVE_TAB === 'other'){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading&hellip;</p></div></div>`;
    await loadOtherTaskData();
    renderOtherTaskHtml();
    return;
  }

  body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading the skill list&hellip;</p></div></div>`;
  await loadTrainingData();
  renderTrainingBody();
}

function renderOcHtml(){
  let xpSection;
  if(REGISTERED_AS === 'character' && MY_CHARACTER){
    xpSection = `
      <div class="panel">
        <div class="panel-head"><h2>Convert OC to EXP</h2></div>
        <div class="panel-body">
          <div class="ce-stats">
            <div class="ce-stat"><div class="ce-stat-label">OC Used</div><div class="ce-stat-value">${SPENT.xp_spent}</div></div>
            <div class="ce-stat"><div class="ce-stat-label">EXP Gained</div><div class="ce-stat-value">${SPENT.xp_spent}</div></div>
          </div>
          <div>
            <label class="field-label" for="ce-xp-amount">OC to convert</label>
            <select id="ce-xp-amount" onchange="ce_updateXp()">${ocAmountOptions(SPENT.xp_spent, n => `${n} OC = ${n} XP`)}</select>
          </div>
          <p class="reg-error-note" id="ce-xp-error" style="display:none; margin-top:0.6rem;"></p>
        </div>
      </div>
    `;
  } else if(REGISTERED_AS === 'character'){
    xpSection = `
      <div class="panel">
        <div class="panel-head"><h2>Convert OC to EXP</h2></div>
        <div class="panel-body">${emptyState('We could not match your registered character to one of your characters. Contact staff for help.')}</div>
      </div>
    `;
  } else {
    xpSection = `
      <div class="panel">
        <div class="panel-head"><h2>Convert OC to EXP</h2></div>
        <div class="panel-body">${emptyState("You're registered as Cast this event, so there's no character to gain XP.")}</div>
      </div>
    `;
  }

  const copperSection = `
    <div class="panel">
      <div class="panel-head"><h2>Convert OC to Copper</h2></div>
      <div class="panel-body">
        <div class="ce-stats">
          <div class="ce-stat"><div class="ce-stat-label">OC Used</div><div class="ce-stat-value">${SPENT.copper_spent}</div></div>
          <div class="ce-stat"><div class="ce-stat-label">Copper Gained</div><div class="ce-stat-value">${SPENT.copper_spent * 10}</div></div>
        </div>
        <div>
          <label class="field-label" for="ce-copper-amount">OC to convert</label>
          <select id="ce-copper-amount" onchange="ce_updateCopper()">${ocAmountOptions(SPENT.copper_spent, n => `${n} OC = ${n * 10} Copper`)}</select>
        </div>
        <p class="reg-error-note" id="ce-copper-error" style="display:none; margin-top:0.6rem;"></p>
      </div>
    </div>
  `;

  return `<div class="ce-cols">${xpSection}${copperSection}</div>`;
}

async function ce_updateXp(){
  const select = document.getElementById('ce-xp-amount');
  const errorEl = document.getElementById('ce-xp-error');
  errorEl.style.display = 'none';
  const amount = clampAmount(select.value);

  const { error } = await membersSupabase.rpc('event_log_set_oc_spend', {
    p_event_slug: EVENT.value, p_kind: 'xp', p_character_id: MY_CHARACTER.id, p_oc_amount: amount
  });
  if(error){ select.value = SPENT.xp_spent; showError(errorEl, error.message); return; }

  await refreshAfterOcChange();
}

async function ce_updateCopper(){
  const select = document.getElementById('ce-copper-amount');
  const errorEl = document.getElementById('ce-copper-error');
  errorEl.style.display = 'none';
  const amount = clampAmount(select.value);

  const { error } = await membersSupabase.rpc('event_log_set_oc_spend', {
    p_event_slug: EVENT.value, p_kind: 'copper', p_character_id: null, p_oc_amount: amount
  });
  if(error){ select.value = SPENT.copper_spent; showError(errorEl, error.message); return; }

  await refreshAfterOcChange();
}

async function refreshAfterOcChange(){
  await loadOcAndTraining();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
  await renderTabBody();
}

// --- Event Info tab ---

async function renderInfoBody(){
  const body = document.getElementById('ce-tab-body');
  if(!INFO_LOADED){
    body.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-empty-note">Loading event info&hellip;</p></div></div>`;
    await loadInfoData();
  }
  renderInfoHtml();
}

async function loadInfoData(){
  INFO_ERROR = null;
  try{
    const [rosterRes, itemsResult, canEditResult] = await Promise.all([
      membersSupabase.rpc('event_roster', { p_event_slug: EVENT.value }),
      membersSupabase.from('event_info_items').select('id, body, created_at').eq('event_slug', EVENT.value).order('created_at', { ascending: false }),
      membersSupabase.rpc('fa_is_plot_or_admin')
    ]);
    if(rosterRes.error) throw new Error(rosterRes.error.message);

    const registrants = rosterRes.data || [];
    const characterNames = registrants.filter(r => r.who === 'character').map(r => r.character_name).filter(Boolean);
    INFO_CAST_COUNT = registrants.filter(r => r.who === 'cast').length;

    INFO_ROSTER = characterNames.length
      ? (await membersSupabase.rpc('event_splash_roster', { p_character_names: characterNames })).data || []
      : [];
    INFO_ITEMS = itemsResult.data || [];
    INFO_CAN_EDIT = !!canEditResult.data;
  } catch(err){
    INFO_ERROR = err.message;
  }
  await loadEventInfoTags();
  INFO_LOADED = true;
}

// Tags Owed to Logistics: materials consumed by crafts this event where
// the player promised to cover them with physical tags instead of
// having them on hand (see craft_item's p_tag_turned_in). Tags You'll
// Receive: every item crafted this event (each needs a freshly printed
// tag) plus anything explicitly requested via the Inventory page for
// this event.
async function loadEventInfoTags(){
  INFO_TAGS_OWED = [];
  INFO_TAGS_RECEIVING = [];
  if(!(REGISTERED_AS === 'character' && MY_CHARACTER)) return;

  try{
    const { data: craftRows } = await membersSupabase.from('crafting_log')
      .select('id, item_name, qty_produced, tag_turned_in')
      .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value);

    const rows = craftRows || [];
    const owedCraftIds = rows.filter(r => r.tag_turned_in).map(r => r.id);

    const [consumedRes, requestRes, soldRes] = await Promise.all([
      owedCraftIds.length
        ? membersSupabase.from('crafting_materials_consumed').select('material_name, quantity').in('crafting_log_id', owedCraftIds)
        : Promise.resolve({ data: [] }),
      membersSupabase.from('character_tag_requests').select('item_name, quantity')
        .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value).eq('status', 'pending'),
      membersSupabase.from('shoppe_sales').select('item_name, quantity')
        .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value).eq('tag_turned_in', true)
    ]);

    const owedMap = {};
    (consumedRes.data || []).forEach(r => {
      const key = r.material_name.trim();
      owedMap[key] = (owedMap[key] || 0) + r.quantity;
    });
    (soldRes.data || []).forEach(r => {
      const key = r.item_name.trim();
      owedMap[key] = (owedMap[key] || 0) + r.quantity;
    });
    INFO_TAGS_OWED = Object.entries(owedMap).map(([name, qty]) => ({ name, qty })).sort((a, b) => a.name.localeCompare(b.name));

    const receivingMap = {};
    rows.forEach(r => {
      const key = r.item_name.trim();
      receivingMap[key] = (receivingMap[key] || 0) + r.qty_produced;
    });
    (requestRes.data || []).forEach(r => {
      const key = r.item_name.trim();
      receivingMap[key] = (receivingMap[key] || 0) + r.quantity;
    });
    INFO_TAGS_RECEIVING = Object.entries(receivingMap).map(([name, qty]) => ({ name, qty })).sort((a, b) => a.name.localeCompare(b.name));
  } catch(err){
    // Fail soft -- the tags boxes just stay empty rather than breaking the whole Info tab.
  }
}

async function loadShopData(){
  SHOP_LOAD_ERROR = null;
  try{
    if(!SHOP_ALL_ITEMS.length){
      SHOP_ALL_ITEMS = await shoppeLoadFromSheet();
      const categories = shoppeOrderedCategories(SHOP_ALL_ITEMS);
      SHOP_CATEGORY = categories.length ? categories[0] : null;
    }
    if(!SHOP_PRICE_TIERS.length){
      SHOP_PRICE_TIERS = await shoppeLoadPriceTiers();
    }
    const tasks = [
      membersSupabase.rpc('bank_my_balance'),
      membersSupabase.from('shoppe_purchases').select('id, category, item_name, unit_cost_copper, quantity, total_cost_copper')
        .eq('player_id', window.faCurrentUser.id).eq('event_slug', EVENT.value).order('created_at', { ascending: true })
    ];
    if(REGISTERED_AS === 'character' && MY_CHARACTER){
      tasks.push(membersSupabase.from('character_skills').select('level')
        .eq('character_id', MY_CHARACTER.id).eq('category', 'Trade Skill').ilike('skill_name', 'Merchant'));
      tasks.push(membersSupabase.from('shoppe_sales').select('id, category, item_name, quantity, total_copper_received, from_inventory, tag_turned_in')
        .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value).order('created_at', { ascending: true }));
      tasks.push(membersSupabase.from('event_log_shopping_trips').select('category')
        .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value));
      tasks.push(membersSupabase.rpc('character_material_inventory', { p_character_id: MY_CHARACTER.id }));
      tasks.push(refreshTrainingState());
    }
    const [{ data: balance }, { data: purchases }, merchantRes, salesRes, tripsRes, invRes] = await Promise.all(tasks);
    SHOP_BANK_BALANCE = balance || 0;
    COPPER_BALANCE = SHOP_BANK_BALANCE;
    SHOP_PURCHASES = purchases || [];
    SHOP_MERCHANT_LEVEL = merchantRes ? (merchantRes.data || []).reduce((max, r) => Math.max(max, r.level), 0) : 0;
    SHOP_SALES = salesRes ? (salesRes.data || []) : [];
    SHOP_TRIPS = new Set(tripsRes ? (tripsRes.data || []).map(r => r.category) : []);
    SHOP_INVENTORY = invRes ? (invRes.data || []) : [];
  } catch(err){
    SHOP_LOAD_ERROR = err.message;
  }
}

function renderShopInventoryHtml(){
  if(!(REGISTERED_AS === 'character' && MY_CHARACTER)) return '';
  if(!SHOP_INVENTORY.length) return '';
  const pct = shoppeMerchantPct(SHOP_PRICE_TIERS, SHOP_MERCHANT_LEVEL);

  const rows = SHOP_INVENTORY.map(item => {
    const catalogItem = shoppeFindCatalogItem(item.material_name);
    const key = 'inv::' + item.material_name;
    INV_SELL_QTY_STATE[key] = Math.min(INV_SELL_QTY_STATE[key] || 1, item.balance);
    const qty = INV_SELL_QTY_STATE[key];
    const nameEsc = item.material_name.replace(/'/g, "\\'");

    if(!catalogItem){
      return `<tr><td>${escapeHtml(item.material_name)}</td><td>${item.balance}</td><td colspan="3"><span class="reg-empty-note">Not in the catalog, can't sell here</span></td></tr>`;
    }

    const sellUnit = Math.floor(catalogItem.costCopper * pct.sell_pct / 100);
    return `
      <tr>
        <td>${escapeHtml(item.material_name)}</td>
        <td>${item.balance}</td>
        <td>${sellUnit} Copper</td>
        <td><input type="number" min="1" max="${item.balance}" value="${qty}" class="shop-qty" onchange="ce_invSellUpdateQty('${nameEsc}', ${item.balance}, this.value)"></td>
        <td><button class="btn-outline" onclick="ce_shopSellFromInventory('${catalogItem.category.replace(/'/g, "\\'")}', '${nameEsc}', ${catalogItem.costCopper}, ${catalogItem.availabilityTier})">Sell (${sellUnit * qty})</button></td>
      </tr>
    `;
  }).join('');

  return `
    <div class="panel">
      <div class="panel-head"><h2>Sell From Your Inventory</h2></div>
      <div class="panel-body">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Item</th><th>On Hand</th><th>Sell For</th><th>Qty</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderShopGrid(){
  const query = SHOP_SEARCH.trim().toLowerCase();
  const items = query
    ? SHOP_ALL_ITEMS.filter(i => i.name.toLowerCase().includes(query))
    : SHOP_ALL_ITEMS.filter(i => i.category === SHOP_CATEGORY);
  const gated = REGISTERED_AS === 'character' && MY_CHARACTER;
  const pct = gated ? shoppeMerchantPct(SHOP_PRICE_TIERS, SHOP_MERCHANT_LEVEL) : { buy_pct: 100, sell_pct: 25 };

  document.getElementById('ce-shop-grid').innerHTML = items.length ? items.map(item => {
    const key = item.category + '::' + item.name;
    SHOP_QTY_STATE[key] = SHOP_QTY_STATE[key] || 1;
    const qty = SHOP_QTY_STATE[key];
    const buyUnit = Math.ceil(item.costCopper * pct.buy_pct / 100);
    const total = buyUnit * qty;
    const canAfford = total <= SHOP_BANK_BALANCE;
    const locked = gated && item.availabilityTier > SHOP_MERCHANT_LEVEL;
    const keyEsc = key.replace(/'/g, "\\'");
    const catEsc = item.category.replace(/'/g, "\\'");
    const nameEsc = item.name.replace(/'/g, "\\'");

    let sellCells = '';
    if(gated){
      const sellUnit = Math.floor(item.costCopper * pct.sell_pct / 100);
      const sellQty = SELL_QTY_STATE[key] || 1;
      sellCells = `
        <td>${sellUnit} Copper</td>
        <td><input type="number" min="1" value="${sellQty}" class="shop-qty" onchange="ce_sellUpdateQty('${keyEsc}', this.value)"></td>
        <td><button class="btn-outline" onclick="ce_shopSell('${catEsc}', '${nameEsc}', ${item.costCopper}, ${item.availabilityTier})">Sell (${sellUnit * sellQty})</button></td>
      `;
    }

    return `
      <tr class="${locked ? 'skill-row-locked' : ''}">
        <td class="shop-item-name">${escapeHtml(item.name)}${locked ? `<span class="skill-missing-prereq">Requires Merchant ${item.availabilityTier}</span>` : ''}</td>
        <td>${buyUnit} Copper</td>
        <td><input type="number" min="1" value="${qty}" class="shop-qty" onchange="ce_shopUpdateQty('${keyEsc}', this.value)"></td>
        <td><button class="btn-outline" ${(canAfford && !locked) ? '' : 'disabled'} onclick="ce_shopBuy('${catEsc}', '${nameEsc}', ${item.costCopper}, ${item.availabilityTier})">Buy (${total})</button></td>
        ${sellCells}
      </tr>
    `;
  }).join('') : `<tr><td colspan="7">${query ? `No items match &ldquo;${escapeHtml(SHOP_SEARCH)}&rdquo;.` : 'Nothing in this category yet.'}</td></tr>`;
}

function ce_shopUpdateQty(key, val){
  let n = parseInt(val, 10);
  if(isNaN(n) || n < 1) n = 1;
  SHOP_QTY_STATE[key] = n;
  renderShopGrid();
}

function ce_sellUpdateQty(key, val){
  let n = parseInt(val, 10);
  if(isNaN(n) || n < 1) n = 1;
  SELL_QTY_STATE[key] = n;
  renderShopGrid();
}

function ce_invSellUpdateQty(name, max, val){
  let n = parseInt(val, 10);
  if(isNaN(n) || n < 1) n = 1;
  if(n > max) n = max;
  INV_SELL_QTY_STATE['inv::' + name] = n;
  renderShopBody();
}

  errorEl.style.display = 'none';
  const key = category + '::' + itemName;
  const qty = SHOP_QTY_STATE[key] || 1;
  const asCharacter = REGISTERED_AS === 'character' && MY_CHARACTER;

  const { error } = await membersSupabase.rpc('shoppe_buy_item', {
    p_event_slug: EVENT.value,
    p_character_id: asCharacter ? MY_CHARACTER.id : null,
    p_category: category,
    p_item_name: itemName,
    p_availability_tier: availabilityTier,
    p_unit_cost_copper: unitCost,
    p_quantity: qty,
    p_hours_budget: asCharacter ? TRAIN_BUDGET : null

  await loadShopData();
  renderShopBody();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
}

function taughtKey(category, skillName, focus){
  return [category, skillName, focus].map(v => (v || '').trim().toLowerCase()).join('|');
}

async function refreshTrainingState(){
  const [{ data: skillRows }, { data: summary }, { data: purchases }, { data: teachRows }] = await Promise.all([
    membersSupabase.from('character_skills').select('id, category, skill_name, focus, level, sp_cost').eq('character_id', MY_CHARACTER.id),
    membersSupabase.rpc('event_log_training_summary', { p_event_slug: EVENT.value, p_character_id: MY_CHARACTER.id }),
    membersSupabase.from('event_log_training_purchases').select('id, category, skill_name, focus, level, sp_cost, hours_cost, is_relevel, prev_level')
      .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value).order('created_at', { ascending: true }),
    membersSupabase.from('character_teach_requests').select('category, skill_name, focus')
      .eq('student_character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value).eq('status', 'approved')
  ]);
  TRAIN_KNOWN = (skillRows || []).map(sk => ({ id: sk.id, category: sk.category, title: sk.skill_name, focus: sk.focus || '', level: sk.level, spCost: sk.sp_cost }));
  TRAIN_STATS = faDeriveStats(MY_CHARACTER.race, TRAIN_KNOWN.map(k => ({ name: k.title, level: k.level })));
  TRAIN_SUMMARY = summary || { spendable_sp: 0, hours_spent: 0 };
  TRAIN_PURCHASES = purchases || [];
  TRAIN_BUDGET = window.faTrainingHoursBudget(EVENT) + (TRAIN_SUMMARY.hours_adjustment || 0);
  TRAIN_TAUGHT = new Set((teachRows || []).map(r => taughtKey(r.category, r.skill_name, r.focus)));
}

  TRAIN_LOAD_ERROR = null;

}

function ce_trainFindKnown(category, title, focus){
  const norm = s => (s || '').trim().toLowerCase();
  return TRAIN_KNOWN.find(k => norm(k.category) === norm(category) && norm(k.title) === norm(title) && norm(k.focus) === norm(focus)) || null;
}

function ce_trainRowState(idx){
  const s = TRAIN_ALL_SKILLS[idx];
  const key = skillKey(s);
  TRAIN_BROWSE_STATE[key] = TRAIN_BROWSE_STATE[key] || { focus: '' };
  return { s, key, state: TRAIN_BROWSE_STATE[key] };
}

function trainFocusFieldHtml(idx, s, state, isLeveled, focusLocked){
  const widthStyle = `style="max-width:${isLeveled ? 140 : 180}px;display:inline-block;${isLeveled ? 'margin-right:0.5rem;' : ''}"`;

  if(focusLocked) return `<span ${widthStyle}>${escapeHtml(focusLocked)}</span>`;

  const options = focusOptionsFor(s, TRAIN_KNOWN, MY_CHARACTER.race) || [];
  return `<select onchange="ce_trainUpdateFocus(${idx}, this.value)" ${widthStyle}>`
    + `<option value="">Choose&hellip;</option>`
    + options.map(o => `<option value="${escapeHtml(o)}" ${state.focus === o ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('')
    + `</select>`;
}

// Resolves everything needed to render or act on one browse row: the
// matching known skill (if any), whether acting on it is a relevel,
// the level to act on (auto-detected: the next level up from whatever
// is already known, or level 1 if it isn't known at all), and the full
// SP/Hours cost of that level -- leveling up is a fresh full-price
// purchase of the new level, not just the increase over what's already
// been paid. This applies to flat-cost skills too -- some (Dodge, Iron
// Will, Master Dodge, ...) are meant to be bought multiple times, each
// purchase adding another rank at the same flat cost -- so a skill
// already known isn't blocked, it's just aimed at the next rank up.
function ce_trainRowInfo(idx){
  const { s, state } = ce_trainRowState(idx);
  const race = MY_CHARACTER.race;

  const focusLocked = s.title === 'Clerical Investment' ? clericalInvestmentLockedFocus(TRAIN_KNOWN) : null;
  if(focusLocked) state.focus = focusLocked;
  const focusVal = focusLocked || (s.focusTypeId ? state.focus.trim() : '');

  const isLeveled = isLeveledCost(s, race, focusVal);

  const known = (s.focusTypeId && !focusVal) ? null : ce_trainFindKnown(s.category, s.title, focusVal);
  const isRelevel = !!known;

  const level = known ? known.level + 1 : 1;

  const hoursRemaining = Math.max(0, TRAIN_BUDGET - TRAIN_SUMMARY.hours_spent);
  const spendableSp = TRAIN_SUMMARY.spendable_sp;

  const cost = skillsParseCost(s, level, race, focusVal);
  const taught = TRAIN_TAUGHT.has(taughtKey(s.category, s.title, focusVal));
  const hoursCost = cost === null ? null : (taught ? Math.ceil(cost * 2.5) : cost * 5);

  const missing = unmetPrereqText(s, race, focusVal, TRAIN_KNOWN, TRAIN_STATS);
  const canAct = !missing && cost !== null && cost > 0 && cost <= spendableSp && hoursCost <= hoursRemaining
    && !(s.focusTypeId && !focusVal);

  return { s, state, isLeveled, focusVal, focusLocked, known, isRelevel, level, cost, hoursCost, taught, missing, canAct };
}

function trainCostLabel(info){
  if(info.cost === null) return '-';
  return `${info.cost} SP (${info.hoursCost} hrs${info.taught ? ', taught' : ''})`;
}

function renderTrainBrowser(){
  const rows = TRAIN_ALL_SKILLS
    .map((s, idx) => ({ s, idx }))
    .filter(({ s }) => s.category === TRAIN_CATEGORY);

  document.getElementById('ce-train-browser-body').innerHTML = rows.length ? rows.map(({ idx }) => {
    const info = ce_trainRowInfo(idx);
    const { s, state, isLeveled } = info;

    let focusCell = '-';
    if(s.focusTypeId && isLeveled){
      focusCell = trainFocusFieldHtml(idx, s, state, true, info.focusLocked) + `<span style="margin-left:0.5rem;">Level ${info.level}</span>`;
    } else if(s.focusTypeId){
      focusCell = trainFocusFieldHtml(idx, s, state, false, info.focusLocked);
    } else if(isLeveled){
      focusCell = `Level ${info.level}`;
    }

    const nameLabel = escapeHtml(s.title)
      + (info.isRelevel ? ` <span class="reg-empty-note" style="display:inline;">(currently level ${info.known.level})</span>` : '')
      + (info.missing ? `<span class="skill-missing-prereq">Requires: ${escapeHtml(info.missing)}</span>` : '');
    const actionLabel = info.isRelevel ? 'Level Up' : 'Learn';

    return `
      <tr class="${info.missing ? 'skill-row-locked' : ''}">
        <td>${nameLabel}</td>
        <td id="ce-train-cost-${idx}">${escapeHtml(trainCostLabel(info))}</td>
        <td>${focusCell}</td>
        <td><button class="btn-outline" id="ce-train-learn-${idx}" ${info.canAct ? '' : 'disabled'} onclick="ce_trainAct(${idx})">${actionLabel}</button></td>
      </tr>
    `;
  }).join('') : `<tr><td colspan="4">Nothing left to learn in this category.</td></tr>`;
}

function ce_trainUpdateRowLive(idx){
  const info = ce_trainRowInfo(idx);

  const costEl = document.getElementById('ce-train-cost-' + idx);
  if(costEl) costEl.textContent = trainCostLabel(info);

  const btn = document.getElementById('ce-train-learn-' + idx);
  if(btn){
    btn.disabled = !info.canAct;
    btn.textContent = info.isRelevel ? 'Level Up' : 'Learn';
  }
}

function ce_trainUpdateFocus(idx, val){
  const { state } = ce_trainRowState(idx);
  state.focus = val;
  ce_trainUpdateRowLive(idx);
}

async function ce_trainAct(idx){
  const errorEl = document.getElementById('ce-train-error');
  errorEl.style.display = 'none';
  const info = ce_trainRowInfo(idx);
  if(!info.canAct) return;
  const { s, isRelevel, known, level, cost, focusVal } = info;
  const { key } = ce_trainRowState(idx);

  const { error } = isRelevel
    ? await membersSupabase.rpc('event_log_relevel_skill', {
        p_event_slug: EVENT.value,
        p_character_id: MY_CHARACTER.id,
        p_hours_budget: TRAIN_BUDGET,
        p_character_skill_id: known.id,
        p_new_level: level,
        p_new_sp_cost: cost
      })
    : await membersSupabase.rpc('event_log_train_skill', {
        p_event_slug: EVENT.value,
        p_character_id: MY_CHARACTER.id,
        p_hours_budget: TRAIN_BUDGET,
        p_category: s.category,
        p_skill_name: s.title,
        p_focus: s.focusTypeId ? focusVal : null,
        p_level: isLeveledCost(s, MY_CHARACTER.race, focusVal) ? level : 1,
        p_sp_cost: cost
      });

  if(error){ showError(errorEl, error.message); return; }

  delete TRAIN_BROWSE_STATE[key];
  await refreshTrainingState();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
  renderTrainingBody();
}

async function ce_trainCancel(purchaseId){
  const { error } = await membersSupabase.rpc('event_log_cancel_training', { p_purchase_id: purchaseId });
  if(error){ alert(error.message); return; }

  await refreshTrainingState();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
  renderTrainingBody();
}

// Copper earned scales proportionally to a full 8 hour shift (5 Copper
// per level of the skill used) and rounds up to the nearest whole Copper,
// so working any number of hours is never worth less than a straight
// 8-hour fraction would suggest.
function ce_workCopperFor(hours, level){
  return Math.ceil((hours * 5 * level) / 8);
}

  return opts;
}

    ? `Working ${hours} hour${hours === 1 ? '' : 's'} as a level ${skill.level} ${skill.title} earns ${copper} Copper.`
    : '';

// A character can hold more than one focus of the same trade (e.g.
// Craftsman: Blacksmith and Craftsman: Mason as two separate skill
// rows), so matching by trade name alone isn't enough -- a recipe that
// names a required focus only unlocks for the matching discipline.
function findTradeSkillFor(trade, focusRequired){
  const candidates = TRAIN_KNOWN.filter(k => k.category === 'Trade Skill' && k.title.trim().toLowerCase() === trade.trim().toLowerCase());
  if(!candidates.length) return null;
  if(!focusRequired) return candidates[0];
  return candidates.find(k => (k.focus || '').trim().toLowerCase() === focusRequired.trim().toLowerCase()) || null;
}

function renderCraftGrid(){
  const query = CRAFT_SEARCH.trim().toLowerCase();
  const items = query
    ? CRAFT_ALL_ITEMS.filter(i => i.name.toLowerCase().includes(query))
    : CRAFT_ALL_ITEMS.filter(i => i.trade === CRAFT_TRADE);
  const hoursRemaining = Math.max(0, TRAIN_BUDGET - TRAIN_SUMMARY.hours_spent);

  document.getElementById('ce-craft-grid').innerHTML = items.length ? items.map(item => {
    const key = item.trade + '::' + item.name;
    const keyEsc = key.replace(/'/g, "\\'");
    const tagChecked = !!CRAFT_TAG_STATE[key];
    const knownSkill = findTradeSkillFor(item.trade, item.focusRequired);
    const tradeLabel = item.focusRequired ? `${item.trade} (${item.focusRequired} focus)` : item.trade;

    const levelOk = !!knownSkill && knownSkill.level >= item.levelRequired;
    const missingMaterials = tagChecked ? [] : item.materials.filter(m => craftInventoryBalance(m.name) < m.qty);
    const hoursKnown = item.hours !== null;
    const hoursOk = hoursKnown && item.hours <= hoursRemaining;
    const locked = !levelOk;
    const canCraft = levelOk && hoursKnown && hoursOk && missingMaterials.length === 0;

    let lockedNote = '';
    if(!knownSkill) lockedNote = `Requires ${escapeHtml(tradeLabel)}`;
    else if(!levelOk) lockedNote = `Requires ${escapeHtml(tradeLabel)} level ${item.levelRequired} (this character has level ${knownSkill.level})`;

    const materialsNote = missingMaterials.length
      ? `<span class="skill-missing-prereq">Missing: ${missingMaterials.map(m => `${m.qty} ${escapeHtml(m.name)}`).join(', ')}</span>`
      : (tagChecked ? `<span class="reg-empty-note" style="display:inline;">Materials covered by tags owed next event</span>` : '');
    const requirementNote = item.note
      ? `<div class="reg-empty-note" style="margin-top:0.2rem;">Also requires ${escapeHtml(item.note)}</div>`
      : '';

    const hoursLabel = hoursKnown ? `${item.hours} hrs` : `<span class="skill-missing-prereq">TBD</span>`;

    return `
      <tr class="${locked ? 'skill-row-locked' : ''}">
        <td class="shop-item-name">${escapeHtml(item.name)}${lockedNote ? `<span class="skill-missing-prereq">${lockedNote}</span>` : ''}${materialsNote}${requirementNote}</td>
        <td>${escapeHtml(item.category)}</td>
        <td>${item.levelRequired}</td>
        <td>${hoursLabel}</td>
        <td>${escapeHtml(item.materialsText || 'none')}</td>
        <td>${item.qtyProduced}</td>
        <td><input type="checkbox" ${tagChecked ? 'checked' : ''} onchange="ce_craftToggleTag('${keyEsc}', this.checked)"></td>
        <td><button class="btn-outline" ${canCraft ? '' : 'disabled'} onclick="ce_craftMake('${item.trade.replace(/'/g, "\\'")}', '${item.name.replace(/'/g, "\\'")}')">Craft</button></td>
      </tr>
    `;
  }).join('') : `<tr><td colspan="8">${query ? `No items match &ldquo;${escapeHtml(CRAFT_SEARCH)}&rdquo;.` : 'Nothing in this trade yet.'}</td></tr>`;
}

function ce_craftToggleTag(key, checked){
  CRAFT_TAG_STATE[key] = checked;
  renderCraftGrid();
}

async function ce_craftMake(trade, itemName){
  const errorEl = document.getElementById('ce-craft-error');
  errorEl.style.display = 'none';
  const item = CRAFT_ALL_ITEMS.find(i => i.trade === trade && i.name === itemName);
  if(!item) return;
  const knownSkill = findTradeSkillFor(item.trade, item.focusRequired);
  if(!knownSkill) return;
  const key = trade + '::' + itemName;

  const { error } = await membersSupabase.rpc('craft_item', {
    p_event_slug: EVENT.value,
    p_character_id: MY_CHARACTER.id,
    p_hours_budget: TRAIN_BUDGET,
    p_character_skill_id: knownSkill.id,
    p_item_name: item.name,
    p_category: item.category,
    p_level_required: item.levelRequired,
    p_focus_required: item.focusRequired,
    p_hours: item.hours,
    p_qty_produced: item.qtyProduced,
    p_materials: item.materials.map(m => ({ name: m.name, qty: m.qty })),
    p_tag_turned_in: !!CRAFT_TAG_STATE[key]
  });
  if(error){ showError(errorEl, error.message); return; }

  delete CRAFT_TAG_STATE[key];
  INFO_LOADED = false;
  await loadCraftData();
  renderCraftHtml();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
}

async function ce_craftCancel(logId){
  const { error } = await membersSupabase.rpc('cancel_craft', { p_crafting_log_id: logId });
  if(error){ alert(error.message); return; }

  INFO_LOADED = false;
  await loadCraftData();
  renderCraftHtml();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
}

// --- Other Task tab ---
// A catch-all for in-game downtime actions that don't fit Training,
// Work, Crafting, or Shopping -- a free-text description plus how many
// hours it takes, drawing from the same shared Hours budget.

async function loadOtherTaskData(){
  OTHER_TASK_LOAD_ERROR = null;
  try{
    await refreshTrainingState();

    // Continues any of this character's repeating Upkeep costs into
    // this event before loading the list, the same way the Social
    // Class allowance auto-grants itself on page load.
    await membersSupabase.rpc('event_log_apply_repeating_upkeep', {
      p_event_slug: EVENT.value, p_character_id: MY_CHARACTER.id
    });

    const [{ data, error }, { data: upkeepRows, error: upkeepError }, { data: copperBalance }] = await Promise.all([
      membersSupabase.from('event_log_other_tasks')
        .select('id, description, hours, created_at')
        .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value)
        .order('created_at', { ascending: true }),
      membersSupabase.from('event_log_upkeep_costs')
        .select('id, description, copper_cost, repeating, created_at')
        .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value)
        .order('created_at', { ascending: true }),
      membersSupabase.rpc('bank_my_balance')
    ]);
    if(error) throw new Error(error.message);
    if(upkeepError) throw new Error(upkeepError.message);
    OTHER_TASK_LOG = data || [];
    UPKEEP_LOG = upkeepRows || [];
    COPPER_BALANCE = Number(copperBalance || 0);
  } catch(err){
    OTHER_TASK_LOAD_ERROR = err.message;
  }
}

function renderOtherTaskHtml(){
  const body = document.getElementById('ce-tab-body');

  if(OTHER_TASK_LOAD_ERROR){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>Other Task</h2></div><div class="panel-body"><p class="reg-error-note">Couldn't load: ${escapeHtml(OTHER_TASK_LOAD_ERROR)}</p></div></div>`;
    return;
  }

  const hoursRemaining = Math.max(0, TRAIN_BUDGET - TRAIN_SUMMARY.hours_spent);

  const logHtml = OTHER_TASK_LOG.length ? `
    <div class="panel">
      <div class="panel-head"><h2>Logged This Event</h2></div>
      <div class="panel-body">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Description</th><th>Hours</th><th></th></tr></thead>
            <tbody>${OTHER_TASK_LOG.map(l => `
              <tr>
                <td>${escapeHtml(l.description)}</td>
                <td>${l.hours} hrs</td>
                <td><button class="btn-outline" onclick="ce_otherTaskCancel('${l.id}')" title="Undo this entry">&times;</button></td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>
  ` : '';

  const upkeepLogHtml = UPKEEP_LOG.length ? `
    <div class="panel">
      <div class="panel-head"><h2>Upkeep Logged This Event</h2></div>
      <div class="panel-body">
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Description</th><th>Copper</th><th>Repeating</th><th></th></tr></thead>
            <tbody>${UPKEEP_LOG.map(u => `
              <tr>
                <td>${escapeHtml(u.description)}</td>
                <td>${u.copper_cost}</td>
                <td>${u.repeating
                  ? `Yes <button class="btn-outline" onclick="ce_upkeepStopRepeat('${u.id}')" title="Stop this from repeating next event">Stop Repeating</button>`
                  : 'No'}</td>
                <td><button class="btn-outline" onclick="ce_upkeepCancel('${u.id}')" title="Undo and refund this entry">&times;</button></td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>
      </div>
    </div>
  ` : '';

  body.innerHTML = `
    ${logHtml}
    <div class="panel">
      <div class="panel-head ce-event-head">
        <h2>Log an In-Game Action</h2>
        <span class="ce-logging-as">Hours Remaining: ${hoursRemaining} / ${TRAIN_BUDGET}</span>
      </div>
      <div class="panel-body">
        <p class="page-subhead">For downtime actions that don't fit Training, Work, Crafting, or Shopping -- describe what your character is doing and how many hours it takes.</p>
        <div style="display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:0.9rem;">
          <div style="width:320px; max-width:100%;">
            <label class="field-label" for="ce-other-task-desc">Description</label>
            <input type="text" id="ce-other-task-desc" value="${escapeHtml(OTHER_TASK_DESC)}" oninput="ce_otherTaskUpdateDesc(this.value)" placeholder="What is your character doing?">
          </div>
          <div>
            <label class="field-label" for="ce-other-task-hours">Hours</label>
            <input type="number" id="ce-other-task-hours" min="1" step="1" value="${escapeHtml(OTHER_TASK_HOURS)}" oninput="ce_otherTaskUpdateHours(this.value)" style="width:80px; max-width:80px;">
          </div>
        </div>
        <button class="btn-gold" onclick="ce_otherTaskSubmit()">Log It</button>
        <p class="reg-error-note" id="ce-other-task-error" style="display:none; margin-top:0.6rem;"></p>
      </div>
    </div>
    ${upkeepLogHtml}
    <div class="panel">
      <div class="panel-head ce-event-head">
        <h2>Log an Upkeep Cost</h2>
        <span class="ce-logging-as">Your Copper: ${COPPER_BALANCE}</span>
      </div>
      <div class="panel-body">
        <p class="page-subhead">For an in-game cost that comes out of your Copper -- maintaining a horse, a shrine, a forge, and so on. Mark it Repeating to have the same cost automatically deducted again at every future event until you stop it.</p>
        <div style="display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap; margin-bottom:0.9rem;">
          <div style="width:320px; max-width:100%;">
            <label class="field-label" for="ce-upkeep-desc">Description</label>
            <input type="text" id="ce-upkeep-desc" value="${escapeHtml(UPKEEP_DESC)}" oninput="ce_upkeepUpdateDesc(this.value)" placeholder="What is this cost for?">
          </div>
          <div>
            <label class="field-label" for="ce-upkeep-cost">Copper</label>
            <input type="number" id="ce-upkeep-cost" min="1" step="1" value="${escapeHtml(UPKEEP_COST)}" oninput="ce_upkeepUpdateCost(this.value)" style="width:90px; max-width:90px;">
          </div>
          <label style="display:flex; align-items:center; gap:0.4rem; font-family:'EB Garamond', serif;">
            <input type="checkbox" ${UPKEEP_REPEATING ? 'checked' : ''} onchange="ce_upkeepToggleRepeating(this.checked)">
            Repeating
          </label>
        </div>
        <button class="btn-gold" onclick="ce_upkeepSubmit()">Log It</button>
        <p class="reg-error-note" id="ce-upkeep-error" style="display:none; margin-top:0.6rem;"></p>
      </div>
    </div>
  `;
}

function ce_otherTaskUpdateDesc(val){ OTHER_TASK_DESC = val; }
function ce_otherTaskUpdateHours(val){ OTHER_TASK_HOURS = val; }

async function ce_otherTaskSubmit(){
  const errorEl = document.getElementById('ce-other-task-error');
  errorEl.style.display = 'none';

  const description = OTHER_TASK_DESC.trim();
  const hours = parseInt(OTHER_TASK_HOURS, 10);

  if(!description){ showError(errorEl, 'Enter a description.'); return; }
  if(!hours || hours < 1){ showError(errorEl, 'Enter a positive number of hours.'); return; }

  const { error } = await membersSupabase.rpc('event_log_log_other_task', {
    p_event_slug: EVENT.value,
    p_character_id: MY_CHARACTER.id,
    p_description: description,
    p_hours: hours,
    p_hours_budget: TRAIN_BUDGET
  });
  if(error){ showError(errorEl, error.message); return; }

  OTHER_TASK_DESC = '';
  OTHER_TASK_HOURS = '';
  await loadOtherTaskData();
  renderOtherTaskHtml();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
}

async function ce_otherTaskCancel(id){
  const { error } = await membersSupabase.rpc('event_log_cancel_other_task', { p_id: id });
  if(error){ alert(error.message); return; }

  await loadOtherTaskData();
  renderOtherTaskHtml();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
}

function ce_upkeepUpdateDesc(val){ UPKEEP_DESC = val; }
function ce_upkeepUpdateCost(val){ UPKEEP_COST = val; }
function ce_upkeepToggleRepeating(val){ UPKEEP_REPEATING = val; }

async function ce_upkeepSubmit(){
  const errorEl = document.getElementById('ce-upkeep-error');
  errorEl.style.display = 'none';

  const description = UPKEEP_DESC.trim();
  const cost = parseFloat(UPKEEP_COST);

  if(!description){ showError(errorEl, 'Enter a description.'); return; }
  if(!cost || cost <= 0){ showError(errorEl, 'Enter a positive Copper cost.'); return; }

  const { error } = await membersSupabase.rpc('event_log_log_upkeep', {
    p_event_slug: EVENT.value,
    p_character_id: MY_CHARACTER.id,
    p_description: description,
    p_copper_cost: cost,
    p_repeating: UPKEEP_REPEATING
  });
  if(error){ showError(errorEl, error.message); return; }

  UPKEEP_DESC = '';
  UPKEEP_COST = '';
  UPKEEP_REPEATING = false;
  await loadOtherTaskData();
  renderOtherTaskHtml();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
}

async function ce_upkeepCancel(id){
  const { error } = await membersSupabase.rpc('event_log_cancel_upkeep', { p_id: id });
  if(error){ alert(error.message); return; }

  await loadOtherTaskData();
  renderOtherTaskHtml();
  document.getElementById('ce-header-stats').innerHTML = renderHeaderStatsHtml();
}

async function ce_upkeepStopRepeat(id){
  const { error } = await membersSupabase.rpc('event_log_stop_upkeep_repeat', { p_id: id });
  if(error){ alert(error.message); return; }

  await loadOtherTaskData();
  renderOtherTaskHtml();
}

// --- Luxuries tab ---
// A per-event checklist, not a purchase -- matches how the old site
// tracked Luxuries (labs, forges, a horse, ammunition, bandages, and so
// on) as boxes a character checked off each event, rather than a
// one-time Copper purchase.

async function loadLuxuriesData(){
  LUX_LOAD_ERROR = null;
  try{
    const [items, { data: owned }] = await Promise.all([
      LUX_ITEMS.length ? Promise.resolve(LUX_ITEMS) : shoppeLoadLuxuries(),
      membersSupabase.from('event_log_luxuries').select('item_id')
        .eq('character_id', MY_CHARACTER.id).eq('event_slug', EVENT.value)
    ]);
    LUX_ITEMS = items;
    LUX_OWNED = new Set((owned || []).map(r => r.item_id));
  } catch(err){
    LUX_LOAD_ERROR = err.message;
  }
}

function renderLuxuriesHtml(){
  const body = document.getElementById('ce-tab-body');

  if(LUX_LOAD_ERROR){
    body.innerHTML = `<div class="panel"><div class="panel-head"><h2>Luxuries</h2></div><div class="panel-body"><p class="reg-error-note">Couldn't load Luxuries: ${escapeHtml(LUX_LOAD_ERROR)}</p></div></div>`;
    return;
  }

  const rows = LUX_ITEMS.map(item => {
    const checked = LUX_OWNED.has(item.id);
    return `
      <tr>
        <td><label style="display:flex; align-items:center; gap:0.6rem; cursor:pointer;">
          <input type="checkbox" ${checked ? 'checked' : ''} onchange="ce_luxToggle(${item.id}, this.checked)">
          ${escapeHtml(item.name)}
        </label></td>
        <td>${item.costCopper} Copper</td>
        <td>${escapeHtml(item.skillText || '-')}</td>
        <td>${escapeHtml(item.ingredientsText || '-')}</td>
        <td>${escapeHtml(item.craftHours || '-')}</td>
        <td>${escapeHtml(item.effectText || '-')}</td>
      </tr>
    `;
  }).join('');

  body.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Luxuries</h2></div>
      <div class="panel-body">
        <p class="reg-empty-note" style="margin-bottom:0.8rem;">Check off what ${escapeHtml(MY_CHARACTER.name)} has this event. Copper cost shown is the weekly upkeep for reference, not a purchase.</p>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Luxury</th><th>Upkeep/Week</th><th>Crafting Skill</th><th>Ingredients</th><th>Time</th><th>Effect</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="6">No Luxuries in the catalog yet.</td></tr>'}</tbody>
          </table>
        </div>
        <p class="reg-error-note" id="ce-lux-error" style="display:none; margin-top:0.6rem;"></p>
      </div>
    </div>
  `;
}

async function ce_luxToggle(itemId, checked){
  const { error } = await membersSupabase.rpc('event_log_toggle_luxury', {
    p_event_slug: EVENT.value, p_character_id: MY_CHARACTER.id, p_item_id: itemId, p_has: checked
  });
  if(error){
    renderLuxuriesHtml();
    showError(document.getElementById('ce-lux-error'), error.message);
    return;
  }

  if(checked) LUX_OWNED.add(itemId); else LUX_OWNED.delete(itemId);
}
