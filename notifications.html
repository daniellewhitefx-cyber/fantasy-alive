<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Notifications</h1>

<div class="reg-section">
<div class="reg-section-label">New Notifications</div>
<div id="notif-new-list"><p class="reg-empty-note">Loading&hellip;</p></div>
</div>

<div class="reg-section">
<div class="reg-section-label">Previous Notifications</div>
<div id="notif-previous-list"><p class="reg-empty-note">Loading&hellip;</p></div>
</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDateTime(iso){
  return new Date(iso).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

async function init(){
  const me = window.faCurrentUser.id;

  const { data: profile } = await membersSupabase.from('profiles').select('activity_last_seen_at').eq('id', me).maybeSingle();
  const lastSeen = profile ? profile.activity_last_seen_at : null;

  const { data: myChars } = await membersSupabase.from('characters').select('id, name').eq('player_id', me);
  const charMap = {};
  (myChars || []).forEach(c => { charMap[c.id] = c.name; });
  const charIds = (myChars || []).map(c => c.id);

  const newItems = [];
  const previousItems = [];
  const isNew = (date) => !lastSeen || new Date(date) > new Date(lastSeen);

  const { data: allMsgs } = await membersSupabase
    .from('messages')
    .select('id, sender_id, recipient_player_id, recipient_department_id, subject, body, created_at, sender_character_id, sender_department_id')
    .order('created_at', { ascending: false })
    .limit(50);
  const { data: reads } = await membersSupabase.from('message_reads').select('message_id').eq('player_id', me);
  const readSet = new Set((reads || []).map(r => r.message_id));

  const { data: profiles } = await membersSupabase.from('profiles').select('id, display_name');
  const profileMap = {};
  (profiles || []).forEach(p => { profileMap[p.id] = p.display_name; });

  const { data: depts } = await membersSupabase.from('departments').select('id, name');
  const deptMap = {};
  (depts || []).forEach(d => { deptMap[d.id] = d.name; });

  const senderCharIds = [...new Set((allMsgs || []).map(m => m.sender_character_id).filter(Boolean))];
  const senderCharMap = {};
  if(senderCharIds.length){
    const { data: senderChars } = await membersSupabase.rpc('character_names').select('id, name').in('id', senderCharIds);
    (senderChars || []).forEach(c => { senderCharMap[c.id] = c.name; });
  }

  (allMsgs || []).forEach(m => {
    if(m.sender_id === me) return;
    const from = m.sender_department_id
      ? (deptMap[m.sender_department_id] || 'a department')
      : m.sender_character_id
        ? (senderCharMap[m.sender_character_id] || 'a character')
        : (profileMap[m.sender_id] || 'Unknown player');
    const via = m.recipient_department_id ? ` to ${escapeHtml(deptMap[m.recipient_department_id] || 'a department')}` : '';
    const entry = {
      type: 'msg',
      date: m.created_at,
      html: `<strong>Message from ${escapeHtml(from)}</strong>${via}<br><em>${escapeHtml(m.subject || 'No subject')}</em><br>${escapeHtml(m.body)}`
    };
    (readSet.has(m.id) ? previousItems : newItems).push(entry);
  });

  if(charIds.length){
    const { data: xpRows } = await membersSupabase.from('xp_transactions').select('character_id, amount, note, created_at').in('character_id', charIds).order('created_at', { ascending: false }).limit(50);
    (xpRows || []).forEach(x => {
      const entry = {
        type: 'xp',
        date: x.created_at,
        html: `<strong>${x.amount > 0 ? '+' : ''}${x.amount} XP</strong> to ${escapeHtml(charMap[x.character_id] || 'a character')}${x.note ? ' - ' + escapeHtml(x.note) : ''}`
      };
      (isNew(x.created_at) ? newItems : previousItems).push(entry);
    });
  }

  const { data: ocRows } = await membersSupabase.from('oc_transactions').select('amount, note, created_at').eq('player_id', me).order('created_at', { ascending: false }).limit(50);
  (ocRows || []).forEach(o => {
    const entry = {
      type: 'oc',
      date: o.created_at,
      html: `<strong>${o.amount > 0 ? '+' : ''}${o.amount} OC</strong>${o.note ? ' - ' + escapeHtml(o.note) : ''}`
    };
    (isNew(o.created_at) ? newItems : previousItems).push(entry);
  });

  const { data: myKudos } = await membersSupabase
    .from('kudos')
    .select('to_character_id, to_player_id, status, decided_at')
    .eq('from_player_id', me)
    .in('status', ['approved', 'denied'])
    .order('decided_at', { ascending: false })
    .limit(50);
  const kudosCharIds = [...new Set((myKudos || []).map(k => k.to_character_id).filter(Boolean))];
  const kudosCharMap = {};
  if(kudosCharIds.length){
    const { data: kc } = await membersSupabase.rpc('character_names').select('id, name').in('id', kudosCharIds);
    (kc || []).forEach(c => { kudosCharMap[c.id] = c.name; });
  }
  (myKudos || []).forEach(k => {
    const target = k.to_player_id ? (profileMap[k.to_player_id] || 'Cast') : (kudosCharMap[k.to_character_id] || 'a character');
    const entry = {
      type: 'kudos',
      date: k.decided_at,
      html: `<strong>Kudos to ${escapeHtml(target)}</strong> ${k.status}`
    };
    (isNew(k.decided_at) ? newItems : previousItems).push(entry);
  });

  const receivedOrParts = [`to_player_id.eq.${me}`];
  if(charIds.length) receivedOrParts.push(`to_character_id.in.(${charIds.join(',')})`);
  const { data: receivedKudos } = await membersSupabase
    .from('kudos')
    .select('from_player_id, message, decided_at')
    .eq('status', 'approved')
    .or(receivedOrParts.join(','))
    .order('decided_at', { ascending: false })
    .limit(50);
  (receivedKudos || []).forEach(k => {
    const entry = {
      type: 'kudos',
      date: k.decided_at,
      html: `<strong>Kudos from ${escapeHtml(profileMap[k.from_player_id] || 'a player')}</strong>: ${escapeHtml(k.message)}`
    };
    (isNew(k.decided_at) ? newItems : previousItems).push(entry);
  });

  const { data: myRemorts } = await membersSupabase
    .from('character_remort_requests')
    .select('character_id, status, decided_at')
    .eq('player_id', me)
    .in('status', ['approved', 'denied'])
    .order('decided_at', { ascending: false })
    .limit(50);
  (myRemorts || []).forEach(r => {
    const link = r.status === 'approved' ? ` &middot; <a href="character-edit.html?id=${encodeURIComponent(r.character_id)}">Continue your remort</a>` : '';
    const entry = {
      type: 'remort',
      date: r.decided_at,
      html: `<strong>Remort request for ${escapeHtml(charMap[r.character_id] || 'a character')}</strong> ${r.status}${link}`
    };
    (isNew(r.decided_at) ? newItems : previousItems).push(entry);
  });

  const { data: bankTxRows } = await membersSupabase
    .from('bank_transactions')
    .select('type, amount, note, counterparty_id, created_by, created_at')
    .eq('player_id', me)
    .order('created_at', { ascending: false })
    .limit(50);
  (bankTxRows || []).forEach(t => {
    if(!t.created_by || t.created_by === me) return;
    const note = t.note ? ' - ' + escapeHtml(t.note) : '';
    let html;
    if(t.type === 'deposit') html = `<strong>+${t.amount} coin</strong> deposited by staff${note}`;
    else if(t.type === 'withdrawal') html = `<strong>-${t.amount} coin</strong> withdrawal fulfilled by staff${note}`;
    else if(t.type === 'transfer_in') html = `<strong>+${t.amount} coin</strong> from ${escapeHtml(profileMap[t.counterparty_id] || 'another player')}${note}`;
    else if(t.type === 'bill_payment_in') html = `<strong>+${t.amount} coin</strong> - ${escapeHtml(profileMap[t.counterparty_id] || 'a player')} paid your bill${note}`;
    else html = `<strong>${t.amount} coin</strong> bank update${note}`;
    (isNew(t.created_at) ? newItems : previousItems).push({ type: 'bank', date: t.created_at, html });
  });

  const { data: newBillRows } = await membersSupabase
    .from('bank_bills')
    .select('from_player_id, amount, note, status, created_at')
    .eq('to_player_id', me)
    .eq('status', 'pending')
    .order('created_at', { ascending: false })
    .limit(50);
  (newBillRows || []).forEach(b => {
    const entry = {
      type: 'bank',
      date: b.created_at,
      html: `<strong>New bill</strong> from ${escapeHtml(profileMap[b.from_player_id] || 'a player')} for ${b.amount} coin${b.note ? ' - ' + escapeHtml(b.note) : ''}`
    };
    (isNew(b.created_at) ? newItems : previousItems).push(entry);
  });

  const { data: declinedBillRows } = await membersSupabase
    .from('bank_bills')
    .select('to_player_id, amount, note, resolved_at')
    .eq('from_player_id', me)
    .eq('status', 'declined')
    .order('resolved_at', { ascending: false })
    .limit(50);
  (declinedBillRows || []).forEach(b => {
    const entry = {
      type: 'bank',
      date: b.resolved_at,
      html: `${escapeHtml(profileMap[b.to_player_id] || 'A player')} declined your bill for ${b.amount} coin${b.note ? ' - ' + escapeHtml(b.note) : ''}`
    };
    (isNew(b.resolved_at) ? newItems : previousItems).push(entry);
  });

  newItems.sort((a, b) => new Date(b.date) - new Date(a.date));
  previousItems.sort((a, b) => new Date(b.date) - new Date(a.date));
  const previousTop10 = previousItems.slice(0, 10);

  const renderList = (targetId, list, emptyMessage) => {
    const target = document.getElementById(targetId);
    target.innerHTML = list.length ? list.map(i => `
      <div class="bank-bill-card">
        <div><span class="log-type ${i.type}">${i.type.toUpperCase()}</span> <span class="bank-request-date">${fmtDateTime(i.date)}</span></div>
        <div style="margin-top:0.4rem;">${i.html}</div>
      </div>
    `).join('') : `<p class="reg-empty-note">${emptyMessage}</p>`;
  };

  renderList('notif-new-list', newItems, 'Nothing new since your last visit.');
  renderList('notif-previous-list', previousTop10, 'No previous notifications yet.');

  await membersSupabase.rpc('notifications_mark_seen');
  const badge = document.getElementById('member-notif-badge');
  if(badge) badge.style.display = 'none';
}

document.addEventListener('fa-members-ready', init);
})();
</script>

</body>
</html>
