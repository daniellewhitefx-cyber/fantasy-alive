<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Info - Fantasy Alive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Account Info</h1>

<div class="reg-section">
  <div class="account-form-grid">
    <div>
      <label class="field-label" for="account-display-name">Display Name</label>
      <input type="text" id="account-display-name" placeholder="Your name">
      <button class="btn-gold" style="margin-top:1rem;" onclick="account_saveDisplayName()">Save Name</button>
      <p class="reg-success-note" id="account-name-success" style="display:none;"></p>
      <p class="reg-error-note" id="account-name-error" style="display:none;"></p>
    </div>
    <div>
      <label class="field-label" for="account-pronouns">Your Pronouns</label>
      <input type="text" id="account-pronouns" placeholder="e.g. she/her, he/him, they/them">
      <button class="btn-gold" style="margin-top:1rem;" onclick="account_savePronouns()">Save Pronouns</button>
      <p class="reg-success-note" id="account-pronouns-success" style="display:none;"></p>
      <p class="reg-error-note" id="account-pronouns-error" style="display:none;"></p>
    </div>
  </div>
</div>

<div class="reg-section">
  <div class="reg-section-label">Change Password</div>
  <div class="account-form-grid">
    <div>
      <label class="field-label" for="account-new-password">New Password</label>
      <input type="password" id="account-new-password" placeholder="At least 6 characters">
    </div>
    <div>
      <label class="field-label" for="account-confirm-password">Confirm New Password</label>
      <input type="password" id="account-confirm-password" placeholder="Retype new password">
    </div>
  </div>
  <button class="btn-gold" style="margin-top:1rem;" onclick="account_savePassword()">Update Password</button>
  <p class="reg-success-note" id="account-password-success" style="display:none;"></p>
  <p class="reg-error-note" id="account-password-error" style="display:none;"></p>
</div>

<div class="reg-section">
  <div class="account-form-grid">
    <div>
      <div class="reg-section-label">Allergies &amp; Dietary Restrictions</div>
      <p class="page-subhead" style="margin-bottom:0.8rem;">Visible to kitchen staff when you submit your registration.</p>
      <label class="field-label" for="account-allergy-notes">Notes</label>
      <textarea id="account-allergy-notes" placeholder="e.g. peanut allergy, vegetarian"></textarea>
      <button class="btn-gold" style="margin-top:1rem;" onclick="account_saveAllergyNotes()">Save Allergies &amp; Dietary Restrictions</button>
      <p class="reg-success-note" id="account-allergy-success" style="display:none;"></p>
      <p class="reg-error-note" id="account-allergy-error" style="display:none;"></p>
    </div>
    <div>
      <div class="reg-section-label">Disability Notes</div>
      <p class="page-subhead" style="margin-bottom:0.8rem;">Visible to logistics when you submit your registration. This helps with planning our events.</p>
      <label class="field-label" for="account-disability-notes">Notes</label>
      <textarea id="account-disability-notes" placeholder="Anything you'd like to note"></textarea>
      <button class="btn-gold" style="margin-top:1rem;" onclick="account_saveDisabilityNotes()">Save Disability Notes</button>
      <p class="reg-success-note" id="account-disability-success" style="display:none;"></p>
      <p class="reg-error-note" id="account-disability-error" style="display:none;"></p>
    </div>
  </div>
</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){

function showSuccess(el, msg){
  el.textContent = msg;
  el.style.display = 'block';
}

function showError(el, msg){
  el.textContent = msg;
  el.style.display = 'block';
}

function hide(el){ el.style.display = 'none'; }

async function loadAccount(){
  const user = window.faCurrentUser;
  if(!user) return;

  const { data: profile } = await membersSupabase
    .from('profiles')
    .select('display_name, pronouns')
    .eq('id', user.id)
    .maybeSingle();

  document.getElementById('account-display-name').value = (profile && profile.display_name) || '';
  document.getElementById('account-pronouns').value = (profile && profile.pronouns) || '';

  const { data: notes } = await membersSupabase
    .from('member_private_notes')
    .select('allergy_notes, disability_notes')
    .eq('id', user.id)
    .maybeSingle();

  document.getElementById('account-allergy-notes').value = (notes && notes.allergy_notes) || '';
  document.getElementById('account-disability-notes').value = (notes && notes.disability_notes) || '';
}

async function account_saveDisplayName(){
  const successEl = document.getElementById('account-name-success');
  const errorEl = document.getElementById('account-name-error');
  hide(successEl); hide(errorEl);

  const name = document.getElementById('account-display-name').value.trim();
  if(!name){ showError(errorEl, 'Display name cannot be empty.'); return; }

  const { error: rpcError } = await membersSupabase.rpc('account_set_display_name', { p_display_name: name });
  if(rpcError){ showError(errorEl, rpcError.message); return; }

  const { error: authError } = await membersSupabase.auth.updateUser({ data: { display_name: name } });
  if(authError){ showError(errorEl, authError.message); return; }

  const nameEl = document.getElementById('member-account-name');
  if(nameEl) nameEl.textContent = name;

  showSuccess(successEl, 'Name saved.');
}

async function account_savePronouns(){
  const successEl = document.getElementById('account-pronouns-success');
  const errorEl = document.getElementById('account-pronouns-error');
  hide(successEl); hide(errorEl);

  const pronouns = document.getElementById('account-pronouns').value.trim();

  const { error } = await membersSupabase.rpc('account_set_pronouns', { p_pronouns: pronouns });
  if(error){ showError(errorEl, error.message); return; }

  showSuccess(successEl, 'Pronouns saved.');
}

async function account_savePassword(){
  const successEl = document.getElementById('account-password-success');
  const errorEl = document.getElementById('account-password-error');
  hide(successEl); hide(errorEl);

  const newPassword = document.getElementById('account-new-password').value;
  const confirmPassword = document.getElementById('account-confirm-password').value;

  if(!newPassword || newPassword.length < 6){ showError(errorEl, 'Password needs to be at least 6 characters.'); return; }
  if(newPassword !== confirmPassword){ showError(errorEl, 'Passwords do not match.'); return; }

  const { error } = await membersSupabase.auth.updateUser({ password: newPassword });
  if(error){ showError(errorEl, error.message); return; }

  document.getElementById('account-new-password').value = '';
  document.getElementById('account-confirm-password').value = '';
  showSuccess(successEl, 'Password updated.');
}

async function account_saveAllergyNotes(){
  const successEl = document.getElementById('account-allergy-success');
  const errorEl = document.getElementById('account-allergy-error');
  hide(successEl); hide(errorEl);

  const notes = document.getElementById('account-allergy-notes').value;

  const { error } = await membersSupabase.rpc('account_set_allergy_notes', { p_notes: notes });
  if(error){ showError(errorEl, error.message); return; }

  showSuccess(successEl, 'Allergies & dietary restrictions saved.');
}

async function account_saveDisabilityNotes(){
  const successEl = document.getElementById('account-disability-success');
  const errorEl = document.getElementById('account-disability-error');
  hide(successEl); hide(errorEl);

  const notes = document.getElementById('account-disability-notes').value;

  const { error } = await membersSupabase.rpc('account_set_disability_notes', { p_notes: notes });
  if(error){ showError(errorEl, error.message); return; }

  showSuccess(successEl, 'Disability notes saved.');
}

window.account_saveDisplayName = account_saveDisplayName;
window.account_savePronouns = account_savePronouns;
window.account_savePassword = account_savePassword;
window.account_saveAllergyNotes = account_saveAllergyNotes;
window.account_saveDisabilityNotes = account_saveDisabilityNotes;

document.addEventListener('fa-members-ready', loadAccount);
})();
</script>

</body>
</html>
