<meta property="og:url" content="https://fantasy-alive.vercel.app/admin-backstories.html">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.ab-row{
  border: 2px solid var(--line);
  background: var(--row-b);
  padding: 1rem 1.2rem;
  margin-bottom: 1rem;
}
.ab-row-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-bottom: 0.6rem;
}
.ab-row-who{ font-family:'Cinzel', serif; font-weight:700; font-size: 1.05rem; }
.ab-row-meta{ font-size: 0.85rem; color: var(--brown-dark); margin-top: 0.15rem; }
.ab-row-body{
  font-family: 'EB Garamond', serif;
  font-size: 0.95rem;
  line-height: 1.5;
  white-space: pre-wrap;
  background: #fff;
  border: 1px solid var(--line);
  padding: 0.7rem 0.9rem;
  max-height: 320px;
  overflow-y: auto;
  margin-bottom: 0.8rem;
}
.ab-review-grid{
  display:flex;
  gap: 1rem;
  flex-wrap: wrap;
  align-items: flex-end;
}
.ab-notes-field{ flex: 1 1 320px; }
.ab-xp-field{ flex: 0 0 120px; }
.ab-review-grid label{
  display:block;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.8rem;
  margin-bottom: 0.3rem;
  color: var(--brown-dark);
}
.ab-review-grid textarea{
  width: 100%;
  min-height: 60px;
  font-family: 'EB Garamond', serif;
  font-size: 0.92rem;
  padding: 0.5rem 0.6rem;
  border: 2px solid var(--gold-dark);
  border-radius: 4px;
  background: #fff;
  color: var(--brown);
  box-sizing: border-box;
  resize: vertical;
}
.ab-review-grid input{
  width: 100%;
  font-family: 'EB Garamond', serif;
  font-size: 0.92rem;
  padding: 0.5rem 0.6rem;
  border: 2px solid var(--gold-dark);
  border-radius: 4px;
  background: #fff;
  color: var(--brown);
  box-sizing: border-box;
}
.ab-row-actions{
  display:flex;
  gap: 0.5rem;
  margin-top: 0.8rem;
  flex-wrap: wrap;
}
.bs-xp-tag{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--good);
}
.ab-past-notes{
  font-family: 'EB Garamond', serif;
  font-size: 0.88rem;
  font-style: italic;
  background: #fff;
  border-left: 3px solid var(--gold-dark);
  padding: 0.5rem 0.8rem;
  margin-top: 0.5rem;
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Backstory Requests</h1>

<div class="reg-already-registered" id="ab-blocked-notice" style="display:none;">
<h3>Lore access required</h3>
<p>This page is only available to the Lore team and site admins.</p>
</div>

<div id="ab-wrap" style="display:none;">

<div class="panel">
<div class="panel-head"><h2>Pending Review</h2></div>
<div class="panel-body">
<div id="ab-pending-list"><p class="reg-empty-note">Loading&hellip;</p></div>
</div>
</div>

<div class="panel">
<div class="panel-head"><h2>Past Decisions</h2></div>
<div class="panel-body">
<div id="ab-past-list"><p class="reg-empty-note">Loading&hellip;</p></div>
</div>
</div>

</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let PENDING = [];
let PAST = [];
const charMap = {};
const profileMap = {};

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<p class="reg-empty-note">${escapeHtml(msg)}</p>`;
}

function fmtDateTime(iso){
  return new Date(iso).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function statusLabel(status){
  if(status === 'revision_requested') return 'Revision Requested';
  return status.charAt(0).toUpperCase() + status.slice(1);
}

async function loadNames(playerIds, characterIds){
  const missingPlayerIds = [...new Set(playerIds)].filter(id => id && !profileMap[id]);
  if(missingPlayerIds.length){
    const { data } = await membersSupabase.from('profiles').select('id, display_name').in('id', missingPlayerIds);
    (data || []).forEach(p => { profileMap[p.id] = p.display_name; });
  }
  const missingCharIds = [...new Set(characterIds)].filter(id => id && !charMap[id]);
  if(missingCharIds.length){
    const { data } = await membersSupabase.from('characters').select('id, name, race').in('id', missingCharIds);
    (data || []).forEach(c => { charMap[c.id] = c; });
  }
}

function nameFor(playerId){ return profileMap[playerId] || 'Unknown player'; }
function charFor(charId){ return charMap[charId] || { name: 'Unknown character', race: '' }; }

async function loadPending(){
  const { data } = await membersSupabase
    .from('character_backstories')
    .select('id, character_id, player_id, body, is_resubmission, submitted_at')
    .eq('status', 'pending')
    .order('submitted_at', { ascending: true });
  PENDING = data || [];
  await loadNames(PENDING.map(r => r.player_id), PENDING.map(r => r.character_id));
  renderPending();
}

function renderPending(){
  const target = document.getElementById('ab-pending-list');
  if(PENDING.length === 0){
    target.innerHTML = emptyState('No backstory submissions awaiting review.');
    return;
  }

  target.innerHTML = PENDING.map(r => {
    const c = charFor(r.character_id);
    return `
      <div class="ab-row">
        <div class="ab-row-head">
          <div>
            <div class="ab-row-who">${escapeHtml(c.name)} (${escapeHtml(c.race || '')})</div>
            <div class="ab-row-meta">Played by ${escapeHtml(nameFor(r.player_id))} &middot; ${r.is_resubmission ? 'Revision' : 'First submission'} &middot; ${fmtDateTime(r.submitted_at)}</div>
          </div>
        </div>
        <div class="ab-row-body">${escapeHtml(r.body)}</div>
        <div class="ab-review-grid">
          <div class="ab-notes-field">
            <label for="ab-notes-${r.id}">Notes to player</label>
            <textarea id="ab-notes-${r.id}" placeholder="Optional notes..."></textarea>
          </div>
          <div class="ab-xp-field">
            <label for="ab-xp-${r.id}">XP to award</label>
            <input type="number" id="ab-xp-${r.id}" min="0" step="1" placeholder="0">
          </div>
        </div>
        <div class="ab-row-actions">
          <button class="btn-gold" data-approve="${escapeHtml(r.id)}">Approve</button>
          <button class="btn-outline" data-revise="${escapeHtml(r.id)}">Request Revisions</button>
          <button class="btn-outline" data-deny="${escapeHtml(r.id)}">Deny</button>
        </div>
      </div>
    `;
  }).join('');

  target.querySelectorAll('[data-approve]').forEach(btn => {
    btn.addEventListener('click', () => decide(btn.dataset.approve, 'approved'));
  });
  target.querySelectorAll('[data-revise]').forEach(btn => {
    btn.addEventListener('click', () => decide(btn.dataset.revise, 'revision_requested'));
  });
  target.querySelectorAll('[data-deny]').forEach(btn => {
    btn.addEventListener('click', () => decide(btn.dataset.deny, 'denied'));
  });
}

async function decide(id, status){
  const notes = document.getElementById('ab-notes-' + id).value.trim();
  let xp = null;
  if(status === 'approved'){
    const xpInput = document.getElementById('ab-xp-' + id);
    xp = parseInt(xpInput.value, 10);
    if(isNaN(xp) || xp < 0){
      alert('Enter the XP to award before approving.');
      return;
    }
  }

  const { error } = await membersSupabase.rpc('lore_decide_backstory', {
    p_id: id,
    p_status: status,
    p_notes: notes,
    p_xp_awarded: xp
  });
  if(error){ alert(error.message); return; }

  await Promise.all([loadPending(), loadPast()]);
  if(typeof refreshBackstoryBadge === 'function') refreshBackstoryBadge();
}

async function loadPast(){
  const { data } = await membersSupabase
    .from('character_backstories')
    .select('id, character_id, player_id, status, xp_awarded, lore_notes, is_resubmission, decided_at')
    .neq('status', 'pending')
    .order('decided_at', { ascending: false })
    .limit(30);
  PAST = data || [];
  await loadNames(PAST.map(r => r.player_id), PAST.map(r => r.character_id));
  renderPast();
}

function renderPast(){
  const target = document.getElementById('ab-past-list');
  if(PAST.length === 0){
    target.innerHTML = emptyState('No decisions yet.');
    return;
  }

  target.innerHTML = PAST.map(r => {
    const c = charFor(r.character_id);
    const xp = (r.status === 'approved' && r.xp_awarded != null) ? ` &middot; <span class="bs-xp-tag">+${r.xp_awarded} XP</span>` : '';
    const notes = r.lore_notes ? `<div class="ab-past-notes">${escapeHtml(r.lore_notes)}</div>` : '';
    return `
      <div class="ab-row">
        <div class="ab-row-head">
          <div>
            <div class="ab-row-who">${escapeHtml(c.name)} (${escapeHtml(c.race || '')})</div>
            <div class="ab-row-meta">Played by ${escapeHtml(nameFor(r.player_id))} &middot; ${r.is_resubmission ? 'Revision' : 'First submission'} &middot; ${fmtDateTime(r.decided_at)}</div>
          </div>
          <div><span class="status-pill ${r.status === 'revision_requested' ? 'revision' : r.status}">${statusLabel(r.status)}</span>${xp}</div>
        </div>
        ${notes}
      </div>
    `;
  }).join('');
}

document.addEventListener('fa-members-ready', async () => {
  const { data: allowed, error } = await membersSupabase.rpc('fa_is_lore_or_admin');
  if(error || !allowed){
    document.getElementById('ab-blocked-notice').style.display = 'block';
    return;
  }
  document.getElementById('ab-wrap').style.display = 'block';

  await Promise.all([loadPending(), loadPast()]);
});
})();
</script>

</body>
</html>
