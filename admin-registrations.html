<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrations (Staff) - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Registrations (Staff) - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/admin-registrations.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Registrations (Staff) - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.ar-note-pill{
  display:inline-block;
  background: var(--bad, #a33);
  color:#fff;
  font-family:'Cinzel', serif;
  font-size:0.7rem;
  font-weight:700;
  padding:0.1rem 0.5rem;
  margin-bottom:0.2rem;
}
.ar-note-pill.disability{ background: var(--gold-dark, #8a6d1f); }
.ar-notes-cell{ min-width:220px; }
.ar-summary-row{
  display:flex;
  flex-wrap:wrap;
  gap:1.2rem;
  margin-bottom:0.6rem;
}
.ar-summary-stat{ font-family:'EB Garamond', serif; }
.ar-summary-stat strong{ font-family:'Cinzel', serif; }
.ar-row-actions{ display:flex; gap:0.4rem; white-space:nowrap; }
.ar-meal-slots label{ display:flex; align-items:center; gap:0.4rem; margin-bottom:0.2rem; cursor:pointer; font-family:'EB Garamond', serif; }
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Registrations</h1>

<div class="reg-already-registered" id="ar-blocked-notice" style="display:none;">
<h3>Staff access required</h3>
<p>This page is only available to site admins and Logistics.</p>
</div>

<div id="ar-wrap" style="display:none;">

<div class="panel">
<div class="panel-head"><h2>Event</h2></div>
<div class="panel-body">
<label class="field-label" for="ar-event-select">Event</label>
<select id="ar-event-select" onchange="ar_loadRoster()"></select>
</div>
</div>

<div class="panel">
<div class="panel-head"><h2>Who's Registered</h2></div>
<div class="panel-body">
<div class="ar-summary-row" id="ar-summary"></div>
<label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.8rem; cursor:pointer;">
<input type="checkbox" id="ar-notes-only" onchange="ar_render()">
Only show registrants with notes for logistics
</label>
<div class="table-scroll">
<table class="data-table">
<thead><tr><th>Character / Cast</th><th>Player</th><th>Who</th><th>Pass</th><th>Meal</th><th>Days</th><th>Payment</th><th>Notes for Logistics</th><th></th></tr></thead>
<tbody id="ar-roster-body"></tbody>
</table>
</div>
</div>
</div>

<div class="panel" id="ar-edit-panel" style="display:none;">
<div class="panel-head"><h2>Edit Registration</h2></div>
<div class="panel-body">
<div class="account-form-grid">
<div>
<label class="field-label" for="ar-edit-who">Who</label>
<select id="ar-edit-who" onchange="ar_editWhoChanged()">
<option value="character">Character</option>
<option value="cast">Cast</option>
<option value="townsperson">Townsperson</option>
</select>
</div>
<div id="ar-edit-character-wrap">
<label class="field-label" for="ar-edit-character">Character</label>
<select id="ar-edit-character"></select>
</div>
<div>
<label class="field-label" for="ar-edit-pass-name">Pass Name</label>
<input type="text" id="ar-edit-pass-name">
</div>
<div>
<label class="field-label" for="ar-edit-pass-price">Pass Price</label>
<input type="number" id="ar-edit-pass-price" min="0">
</div>
<div>
<label class="field-label" for="ar-edit-combat">Combat Status</label>
<select id="ar-edit-combat">
<option value="">-</option>
<option value="Combat">Combat</option>
<option value="Non-Combat">Non-Combat</option>
</select>
</div>
<div>
<label class="field-label" for="ar-edit-days">Days Attending (comma separated)</label>
<input type="text" id="ar-edit-days" placeholder="Friday, Saturday, Sunday">
</div>
<div>
<label class="field-label" for="ar-edit-meal-name">Meal Name</label>
<input type="text" id="ar-edit-meal-name">
</div>
<div>
<label class="field-label" for="ar-edit-meal-price">Meal Price</label>
<input type="number" id="ar-edit-meal-price" min="0">
</div>
<div>
<label class="field-label" for="ar-edit-single-meal">Single Meal Choice</label>
<input type="text" id="ar-edit-single-meal">
</div>
<div>
<label class="field-label">Meal Slots</label>
<div class="ar-meal-slots" id="ar-edit-meal-slots"></div>
</div>
<div>
<label class="field-label" for="ar-edit-total">Total</label>
<input type="number" id="ar-edit-total" min="0">
</div>
<div>
<label class="field-label" for="ar-edit-payment">Payment Method</label>
<select id="ar-edit-payment">
<option value="">-</option>
<option value="Online (paid)">Online (paid)</option>
<option value="At Event">At Event</option>
</select>
</div>
<div>
<label class="field-label" for="ar-edit-allergy">Allergy Notes</label>
<input type="text" id="ar-edit-allergy">
</div>
<div>
<label class="field-label" for="ar-edit-disability">Disability / Access Notes</label>
<input type="text" id="ar-edit-disability">
</div>
</div>
<button class="btn-gold" onclick="ar_saveEdit()">Save Changes</button>
<button class="btn-outline" onclick="ar_cancelEdit()">Cancel</button>
<p class="reg-error-note" id="ar-edit-error" style="display:none;"></p>
</div>
</div>

</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let REGISTRANTS = [];
let EDIT_ID = null;
let EDIT_PLAYER_ID = null;
const MEAL_SLOTS = ['Saturday Breakfast', 'Saturday Lunch', 'Saturday Dinner', 'Sunday Breakfast'];

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}
function fmtWho(who){
  return who === 'character' ? 'Character' : (who === 'cast' ? 'Cast' : 'Townsperson');
}

function populateEventSelect(){
  const sel = document.getElementById('ar-event-select');
  sel.innerHTML = (window.FA_ALL_EVENTS || []).map(e => `<option value="${escapeHtml(e.value)}">${escapeHtml(e.longLabel)}</option>`).join('');
  if(window.FA_NEXT_EVENT) sel.value = window.FA_NEXT_EVENT.value;
}

async function ar_loadRoster(){
  const eventSlug = document.getElementById('ar-event-select').value;
  const body = document.getElementById('ar-roster-body');
  if(!eventSlug) return;

  body.innerHTML = `<tr><td colspan="9"><p class="reg-empty-note">Loading&hellip;</p></td></tr>`;

  const { data, error } = await membersSupabase.rpc('staff_event_registrations', { p_event_slug: eventSlug });
  if(error){
    body.innerHTML = `<tr><td colspan="9"><p class="reg-error-note">Couldn't load registrations: ${escapeHtml(error.message)}</p></td></tr>`;
    return;
  }
  REGISTRANTS = data || [];
  ar_render();
}

function ar_render(){
  const summaryEl = document.getElementById('ar-summary');
  const body = document.getElementById('ar-roster-body');
  const notesOnly = document.getElementById('ar-notes-only').checked;

  const total = REGISTRANTS.length;
  const withMeal = REGISTRANTS.filter(r => r.meal_name).length;
  const withNotes = REGISTRANTS.filter(r => (r.allergy_notes && r.allergy_notes.trim()) || (r.disability_notes && r.disability_notes.trim())).length;

  summaryEl.innerHTML = `
    <div class="ar-summary-stat"><strong>${total}</strong> registered</div>
    <div class="ar-summary-stat"><strong>${withMeal}</strong> with a meal plan</div>
    <div class="ar-summary-stat"><strong>${withNotes}</strong> with logistics notes</div>
  `;

  const rows = notesOnly
    ? REGISTRANTS.filter(r => (r.allergy_notes && r.allergy_notes.trim()) || (r.disability_notes && r.disability_notes.trim()))
    : REGISTRANTS;

  if(rows.length === 0){
    body.innerHTML = `<tr><td colspan="9">${emptyState(notesOnly ? 'No registrants with logistics notes for this event.' : 'No one is registered for this event yet.')}</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(r => {
    const notes = [];
    if(r.allergy_notes && r.allergy_notes.trim()) notes.push(`<div><span class="ar-note-pill">Allergy</span> ${escapeHtml(r.allergy_notes)}</div>`);
    if(r.disability_notes && r.disability_notes.trim()) notes.push(`<div><span class="ar-note-pill disability">Access</span> ${escapeHtml(r.disability_notes)}</div>`);
    return `
      <tr>
        <td>${escapeHtml(r.character_name)}</td>
        <td>${escapeHtml(r.player_name)}</td>
        <td>${fmtWho(r.who)}</td>
        <td>${r.pass_name ? escapeHtml(r.pass_name) : '-'}</td>
        <td>${r.meal_name ? escapeHtml(r.meal_name) : '-'}</td>
        <td>${r.days_attending && r.days_attending.length ? escapeHtml(r.days_attending.join(', ')) : '-'}</td>
        <td>${r.payment_method ? escapeHtml(r.payment_method) : '-'}</td>
        <td class="ar-notes-cell">${notes.length ? notes.join('') : ''}</td>
        <td class="ar-row-actions">
          <button class="btn-outline" onclick="ar_editRegistration('${r.id}')">Edit</button>
          <button class="btn-outline" onclick="ar_deleteRegistration('${r.id}')">Delete</button>
        </td>
      </tr>
    `;
  }).join('');
}

function renderMealSlotCheckboxes(slots){
  const container = document.getElementById('ar-edit-meal-slots');
  const selected = slots || {};
  container.innerHTML = MEAL_SLOTS.map(slot => `
    <label><input type="checkbox" value="${escapeHtml(slot)}" ${selected[slot] ? 'checked' : ''}> ${escapeHtml(slot)}</label>
  `).join('');
}

async function loadCharacterOptionsForEdit(preselectId){
  const sel = document.getElementById('ar-edit-character');
  sel.innerHTML = `<option value="">Loading&hellip;</option>`;
  const { data, error } = await membersSupabase.rpc('staff_player_characters', { p_player_id: EDIT_PLAYER_ID });
  if(error || !data){
    sel.innerHTML = `<option value="">(couldn't load characters)</option>`;
    return;
  }
  sel.innerHTML = data.map(c => `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');
  if(preselectId) sel.value = preselectId;
}

function ar_editWhoChanged(){
  const who = document.getElementById('ar-edit-who').value;
  document.getElementById('ar-edit-character-wrap').style.display = who === 'character' ? 'block' : 'none';
}

function ar_editRegistration(id){
  const r = REGISTRANTS.find(x => x.id === id);
  if(!r) return;

  EDIT_ID = r.id;
  EDIT_PLAYER_ID = r.player_id;

  document.getElementById('ar-edit-who').value = r.who;
  document.getElementById('ar-edit-pass-name').value = r.pass_name || '';
  document.getElementById('ar-edit-pass-price').value = r.pass_price || 0;
  document.getElementById('ar-edit-combat').value = r.combat_status || '';
  document.getElementById('ar-edit-days').value = (r.days_attending || []).join(', ');
  document.getElementById('ar-edit-meal-name').value = r.meal_name || '';
  document.getElementById('ar-edit-meal-price').value = r.meal_price || 0;
  document.getElementById('ar-edit-single-meal').value = r.single_meal_choice || '';
  document.getElementById('ar-edit-total').value = r.total || 0;
  document.getElementById('ar-edit-payment').value = r.payment_method || '';
  document.getElementById('ar-edit-allergy').value = r.allergy_notes || '';
  document.getElementById('ar-edit-disability').value = r.disability_notes || '';

  renderMealSlotCheckboxes(r.meal_slots);
  ar_editWhoChanged();
  if(r.who === 'character') loadCharacterOptionsForEdit(r.character_id);

  document.getElementById('ar-edit-error').style.display = 'none';
  const panel = document.getElementById('ar-edit-panel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function ar_cancelEdit(){
  EDIT_ID = null;
  EDIT_PLAYER_ID = null;
  document.getElementById('ar-edit-panel').style.display = 'none';
}

async function ar_saveEdit(){
  if(!EDIT_ID) return;
  const errEl = document.getElementById('ar-edit-error');
  errEl.style.display = 'none';

  const who = document.getElementById('ar-edit-who').value;
  const characterId = who === 'character' ? (document.getElementById('ar-edit-character').value || null) : null;
  const days = document.getElementById('ar-edit-days').value.split(',').map(s => s.trim()).filter(Boolean);
  const mealSlots = {};
  document.querySelectorAll('#ar-edit-meal-slots input[type="checkbox"]').forEach(cb => {
    if(cb.checked) mealSlots[cb.value] = true;
  });

  const { error } = await membersSupabase.rpc('staff_update_registration', {
    p_id: EDIT_ID,
    p_who: who,
    p_character_id: characterId,
    p_character_name: null,
    p_pass_name: document.getElementById('ar-edit-pass-name').value,
    p_pass_price: Number(document.getElementById('ar-edit-pass-price').value) || 0,
    p_combat_status: document.getElementById('ar-edit-combat').value,
    p_days_attending: days,
    p_meal_name: document.getElementById('ar-edit-meal-name').value,
    p_meal_price: Number(document.getElementById('ar-edit-meal-price').value) || 0,
    p_single_meal_choice: document.getElementById('ar-edit-single-meal').value,
    p_meal_slots: mealSlots,
    p_total: Number(document.getElementById('ar-edit-total').value) || 0,
    p_payment_method: document.getElementById('ar-edit-payment').value,
    p_allergy_notes: document.getElementById('ar-edit-allergy').value,
    p_disability_notes: document.getElementById('ar-edit-disability').value
  });

  if(error){
    errEl.textContent = `Couldn't save changes: ${error.message}`;
    errEl.style.display = 'block';
    return;
  }

  ar_cancelEdit();
  await ar_loadRoster();
}

async function ar_deleteRegistration(id){
  const r = REGISTRANTS.find(x => x.id === id);
  if(!r) return;
  if(!confirm(`Delete the registration for ${r.character_name}? This cannot be undone.`)) return;

  const { data: credited, error } = await membersSupabase.rpc('staff_delete_registration', { p_id: id });
  if(error){
    alert(`Couldn't delete registration: ${error.message}`);
    return;
  }

  if(EDIT_ID === id) ar_cancelEdit();
  alert(credited ? 'Registration deleted. A Flex Pass event credit was issued for the online payment.' : 'Registration deleted.');
  await ar_loadRoster();
}

window.ar_loadRoster = ar_loadRoster;
window.ar_render = ar_render;
window.ar_editRegistration = ar_editRegistration;
window.ar_editWhoChanged = ar_editWhoChanged;
window.ar_saveEdit = ar_saveEdit;
window.ar_cancelEdit = ar_cancelEdit;
window.ar_deleteRegistration = ar_deleteRegistration;

document.addEventListener('fa-members-ready', async () => {
  const { data: allowed, error } = await membersSupabase.rpc('fa_is_logistics_or_admin');
  if(error || !allowed){
    document.getElementById('ar-blocked-notice').style.display = 'block';
    return;
  }
  document.getElementById('ar-wrap').style.display = 'block';
  populateEventSelect();
  await ar_loadRoster();
});
})();
</script>

</body>
</html>
