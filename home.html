<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Fantasy Alive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Home</h1>
<p class="page-subhead">The current auction item and the latest updates, all in one place.</p>

<div class="reg-section">
<div class="reg-section-label">Current Auction Item</div>
<div id="home-auction-wrap"><p class="reg-empty-note">Loading&hellip;</p></div>
</div>

<div class="bank-staff-section" id="home-announce-staff-section" style="display:none;">
<div class="reg-section-label">Post an Update</div>
<label class="field-label" for="home-announce-title">Title</label>
<input type="text" id="home-announce-title" placeholder="What's this about?">
<label class="field-label" for="home-announce-body" style="margin-top:0.7rem;">Update</label>
<textarea id="home-announce-body" placeholder="Write the update..."></textarea>
<button class="btn-gold" style="margin-top:1rem;" onclick="home_postAnnouncement()">Post Update</button>
<p class="reg-error-note" id="home-announce-error" style="display:none;"></p>
</div>

<div class="reg-section">
<div class="reg-section-label">Updates</div>
<div id="home-announce-list"><p class="reg-empty-note">Loading&hellip;</p></div>
</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let profileMap = {};
let isAnnounceStaff = false;

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtMoney(n){ return '$' + Number(n).toFixed(2).replace(/\.00$/, ''); }

function fmtDateTime(iso){
  return new Date(iso).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function nameFor(id){ return profileMap[id] || 'Unknown player'; }

async function loadCurrentAuctionItem(){
  const wrap = document.getElementById('home-auction-wrap');

  const { data: items } = await membersSupabase
    .from('auction_items')
    .select('id, name, description, image_url, starting_bid')
    .eq('status', 'live')
    .limit(1);
  const item = (items && items[0]) || null;

  if(!item){
    wrap.innerHTML = '<p class="reg-empty-note">No auction is currently live.</p>';
    return;
  }

  const { data: bids } = await membersSupabase
    .from('auction_bids')
    .select('player_id, amount')
    .eq('item_id', item.id)
    .order('amount', { ascending: false })
    .limit(1);
  const highest = bids && bids[0];

  wrap.innerHTML = `
    <div class="bank-balance-card">
      ${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="" style="max-width:100%;border-radius:6px;margin-bottom:1rem;">` : ''}
      <div style="font-family:'Cinzel', serif; font-size:1.3rem; color:#fff; margin-bottom:0.4rem;">${escapeHtml(item.name)}</div>
      ${item.description ? `<p style="color:var(--cream); margin-bottom:0.9rem;">${escapeHtml(item.description)}</p>` : ''}
      <div class="bank-balance-label">${highest ? 'Current Highest Bid' : 'Starting Bid'}</div>
      <div class="bank-balance-amount">${fmtMoney(highest ? highest.amount : item.starting_bid)}</div>
      ${highest ? `<p style="color:var(--cream);">Leading: ${escapeHtml(nameFor(highest.player_id))}</p>` : ''}
    </div>
    <a class="btn-gold" href="auction.html" style="display:inline-block; text-decoration:none;">Go to Auction</a>
  `;
}

async function loadAnnouncements(){
  const list = document.getElementById('home-announce-list');
  const { data: rows } = await membersSupabase
    .from('announcements')
    .select('id, title, body, created_by, created_at')
    .order('created_at', { ascending: false });

  if(!rows || rows.length === 0){
    list.innerHTML = '<p class="reg-empty-note">No updates posted yet.</p>';
    return;
  }

  list.innerHTML = rows.map(a => `
    <div class="bank-bill-card" data-id="${escapeHtml(a.id)}">
      <strong>${escapeHtml(a.title)}</strong>
      <span class="bank-request-date" style="float:right;">${fmtDateTime(a.created_at)}</span>
      <p style="margin-top:0.5rem;">${escapeHtml(a.body)}</p>
      <p class="reg-empty-note" style="margin-top:0.3rem;">Posted by ${escapeHtml(nameFor(a.created_by))}</p>
      ${isAnnounceStaff ? `<button class="btn-outline" data-delete-announce="${escapeHtml(a.id)}">Delete</button>` : ''}
    </div>
  `).join('');

  list.querySelectorAll('[data-delete-announce]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Delete this update?')) return;
      const { error } = await membersSupabase.rpc('announcement_delete', { p_id: btn.dataset.deleteAnnounce });
      if(error){ alert(error.message); return; }
      await loadAnnouncements();
    });
  });
}

async function home_postAnnouncement(){
  const errorEl = document.getElementById('home-announce-error');
  errorEl.style.display = 'none';

  const title = document.getElementById('home-announce-title').value.trim();
  const body = document.getElementById('home-announce-body').value.trim();

  const { error } = await membersSupabase.rpc('announcement_post', { p_title: title, p_body: body });
  if(error){
    errorEl.textContent = error.message;
    errorEl.style.display = 'block';
    return;
  }

  document.getElementById('home-announce-title').value = '';
  document.getElementById('home-announce-body').value = '';
  await loadAnnouncements();
}

window.home_postAnnouncement = home_postAnnouncement;

document.addEventListener('fa-members-ready', async (e) => {
  const user = e.detail.user;
  isAnnounceStaff = !!(user.app_metadata && user.app_metadata.announcements_staff);
  document.getElementById('home-announce-staff-section').style.display = isAnnounceStaff ? 'block' : 'none';

  const { data: profiles } = await membersSupabase.from('profiles').select('id, display_name');
  profileMap = {};
  (profiles || []).forEach(p => { profileMap[p.id] = p.display_name; });

  await loadCurrentAuctionItem();
  await loadAnnouncements();
});
})();
</script>

</body>
</html>
