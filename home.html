}

}
.home-hero-name{

  color: var(--ink);

}
.home-hero-tagline{

}
.home-hero-stats{

  gap: 0.6rem;
  flex-shrink:0;
  flex-wrap: wrap;
}
.home-hero-stat{

  padding: 0.5rem 0.8rem;

}

.home-hero-cta{

.home-kpis{

}
.home-kpi{

  padding: 0.9rem 1.1rem;
}
.home-kpi-label{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold-dark);

.home-kpi-value{

  font-weight: 700;

}
.home-kpi-sub{
  font-family: 'EB Garamond', serif;
  font-size: 0.85rem;
  color: var(--brown);
  margin-top: 0.15rem;
}
@media (max-width: 720px){

.home-split{

<script>
(function(){
let profileMap = {};
let isAnnounceStaff = false;

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function fmtMoney(n){ return '$' + Number(n).toFixed(2).replace(/\.00$/, ''); }
function fmtAmount(n){ return Number(n).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }

function fmtDateTime(iso){
  return new Date(iso).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function nameFor(id){ return profileMap[id] || 'Unknown player'; }

/* ---------- hero: primary character spotlight ---------- */

const RACE_STATS = {
  'Curtainborn': { baseLp: 4, maxLp: 10, baseResurrections: 2, baseSe: 5, baseMe: 0 },
  'D\'Shunn': { baseLp: 4, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Dwarf': { baseLp: 6, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Elf': { baseLp: 4, maxLp: 10, baseResurrections: 1, baseSe: 0, baseMe: 5 },
  'Gnome': { baseLp: 4, maxLp: 8, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Goblin': { baseLp: 4, maxLp: 8, baseResurrections: 3, baseSe: 0, baseMe: 0 },
  'Human': { baseLp: 5, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Lizardfolk': { baseLp: 6, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Malkin': { baseLp: 6, maxLp: 12, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Minotaur': { baseLp: 8, maxLp: 20, baseResurrections: 2, baseSe: 0, baseMe: 0 },
  'Orc': { baseLp: 7, maxLp: 15, baseResurrections: 2, baseSe: 0, baseMe: 0 }
};
const MAX_RESURRECTIONS = 5;

function skillLevelTotal(skills, name){
  return skills.filter(s => s.name.trim().toLowerCase() === name.toLowerCase()).reduce((sum, s) => sum + (s.level || 0), 0);
}
function hasSkill(skills, name){
  return skills.some(s => s.name.trim().toLowerCase() === name.toLowerCase());
}
function deriveStats(race, skills){
  const r = RACE_STATS[race] || { baseLp: 5, maxLp: 10, baseResurrections: 2, baseSe: 0, baseMe: 0 };
  const lp = Math.min(r.baseLp + skillLevelTotal(skills, 'Physical Endurance'), r.maxLp);
  const resurrectionsLeft = Math.min(r.baseResurrections + skillLevelTotal(skills, 'Spiritual Endurance'), MAX_RESURRECTIONS);
  const se = r.baseSe + skillLevelTotal(skills, 'Spiritual Energy') + (hasSkill(skills, 'Theology') ? 1 : 0);
  return { lp, se, resurrectionsLeft };
}

function initials(name){
  return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
}

async function loadHero(){
  const hero = document.getElementById('home-hero');
  const me = window.faCurrentUser.id;

  const { data: chars } = await membersSupabase
    .from('characters')
    .select('id, name, race, social_class, created_at')
    .eq('player_id', me)
    .order('created_at', { ascending: true })
    .limit(1);

  const char = chars && chars[0];
  if(!char){
    const { data: profile } = await membersSupabase.from('profiles').select('is_cast, is_townsperson').eq('id', me).maybeSingle();
    if(profile && profile.is_cast){
      hero.innerHTML = `
        <div class="home-hero-body">
          <div class="home-hero-eyebrow">Welcome back</div>
          <div class="home-hero-name">Cast</div>
          <p class="home-hero-tagline">You're set up as Cast. Create a player character any time from the Characters page.</p>
        </div>
        <div class="home-hero-cta">
          <a href="character-creator.html"><button class="btn-gold">Create Character</button></a>
          <div id="home-register-cta"><a href="register.html"><button class="btn-gold">Register for Next Event</button></a></div>
        </div>
      `;
      updateRegisterCta('cast', 'Cast');
      return;
    }
    if(profile && profile.is_townsperson){
      hero.innerHTML = `
        <div class="home-hero-body">
          <div class="home-hero-eyebrow">Welcome back</div>
          <div class="home-hero-name">Townsperson</div>
          <p class="home-hero-tagline">You're set up as a Townsperson. Create a player character any time from the Characters page.</p>
        </div>
        <div class="home-hero-cta">
          <a href="character-creator.html"><button class="btn-gold">Create Character</button></a>
          <div id="home-register-cta"><a href="register.html"><button class="btn-gold">Register for Next Event</button></a></div>
        </div>
      `;
      updateRegisterCta('townsperson', 'Townsperson');
      return;
    }
    hero.innerHTML = `
      <div class="home-hero-body">
        <div class="home-hero-eyebrow">Welcome</div>
        <div class="home-hero-name">No character yet</div>
        <p class="home-hero-tagline">Create your first character to get started.</p>
      </div>
      <div class="home-hero-cta">
        <a href="character-creator.html"><button class="btn-gold">Create Character</button></a>
        <a href="register.html"><button class="btn-gold">Register for Next Event</button></a>
      </div>
    `;
    return;
  }

  const { data: skillRows } = await membersSupabase
    .from('character_skills')
    .select('skill_name, level')
    .eq('character_id', char.id);
  const skills = (skillRows || []).map(sk => ({ name: sk.skill_name, level: sk.level }));
  const stats = deriveStats(char.race, skills);

  hero.innerHTML = `
    <div class="home-hero-badge">${escapeHtml(initials(char.name))}</div>
    <div class="home-hero-body">
      <div class="home-hero-eyebrow">Welcome back</div>
      <div class="home-hero-name">${escapeHtml(char.name)}</div>
      <p class="home-hero-tagline">${escapeHtml(char.race || 'Unknown race')}${char.social_class ? ' &middot; ' + escapeHtml(char.social_class) : ''}</p>
    </div>
    <div class="home-hero-stats">
      <div class="home-hero-stat"><div class="val">${stats.lp}</div><div class="lbl">LP</div></div>
      <div class="home-hero-stat"><div class="val">${stats.se}</div><div class="lbl">SE</div></div>
      <div class="home-hero-stat"><div class="val">${stats.resurrectionsLeft}</div><div class="lbl">Res.</div></div>
    </div>
    <div class="home-hero-cta">
      <a href="characters.html"><button class="btn-gold">View Character</button></a>
      <div id="home-register-cta"><a href="register.html"><button class="btn-gold">Register for Next Event</button></a></div>
    </div>
  `;
  updateRegisterCta('character', char.name);
}

async function updateRegisterCta(who, characterName){
  const el = document.getElementById('home-register-cta');
  if(!el || !window.FA_NEXT_EVENT) return;

  try{
    const user = await faGetCurrentUser();
    if(!user) return;
    const result = await faCheckRegistration(window.FA_NEXT_EVENT.label, who, characterName, user.email);
    if(result.registered){
      el.innerHTML = `<a href="register.html" class="chars-registered-badge">&#10003; You're Registered for ${escapeHtml(window.FA_NEXT_EVENT.label)}</a>`;
    }
  } catch(err){
  }
}

/* ---------- kpi row ---------- */

async function loadKpis(){
  const me = window.faCurrentUser.id;

  if(window.faIsTownspersonOnly || window.faIsCastOnly){
    const bankCard = document.getElementById('home-kpi-bank-card');
    if(bankCard) bankCard.style.display = 'none';
  } else {
    const bankEl = document.getElementById('home-kpi-bank');
    const { data: balance, error: balanceErr } = await membersSupabase.rpc('bank_my_balance');
    bankEl.textContent = balanceErr ? 'Unavailable' : fmtAmount(balance) + ' cp';
  }

  if(window.faIsTownspersonOnly){
    const ocCard = document.getElementById('home-kpi-oc-card');
    if(ocCard) ocCard.style.display = 'none';
  } else {
    const ocEl = document.getElementById('home-kpi-oc');
    const { data: ocRows } = await membersSupabase.from('oc_transactions').select('amount').eq('player_id', me);
    const ocTotal = (ocRows || []).reduce((sum, r) => sum + Number(r.amount || 0), 0);
    ocEl.textContent = fmtAmount(ocTotal) + ' OC';
  }

  const messagesEl = document.getElementById('home-kpi-messages');
  const { data: unread } = await membersSupabase.rpc('message_unread_count');
  const unreadCount = unread || 0;
  messagesEl.textContent = unreadCount > 0 ? unreadCount + ' new' : 'None';

  const eventEl = document.getElementById('home-kpi-event');
  const eventSubEl = document.getElementById('home-kpi-event-sub');
  const nextEvent = window.FA_NEXT_EVENT;
  if(nextEvent){
    eventEl.textContent = nextEvent.label;
    const days = Math.ceil((nextEvent.start - new Date()) / 86400000);
    eventSubEl.textContent = days > 0 ? days + ' day' + (days === 1 ? '' : 's') + ' away' : 'This weekend';
  } else {
    eventEl.textContent = 'TBA';
  }
}

/* ---------- auction spotlight (unchanged behaviour) ---------- */

let currentAuctionItem = null;
let currentAuctionItemClosed = false;
let currentAuctionBids = [];
let myLastAuctionBidAt = null;

function auctionMinNextBid(item, bids){
  const highest = bids.length ? Math.max(...bids.map(b => Number(b.amount))) : null;
  return (highest !== null ? highest : Number(item.starting_bid) - Number(item.min_increment)) + Number(item.min_increment);
}

function auctionCooldownRemainingMs(){
  if(!myLastAuctionBidAt) return 0;
  const readyAt = new Date(myLastAuctionBidAt).getTime() + (60 * 60 * 1000);
  return Math.max(0, readyAt - Date.now());
}

async function loadCurrentAuctionItem(){
  const { data: liveItems } = await membersSupabase
    .from('auction_items')
    .select('id, name, description, image_url, starting_bid, min_increment, ends_at')
    .eq('status', 'live')
    .limit(1);
  let item = (liveItems && liveItems[0]) || null;

  if(item && item.ends_at && new Date(item.ends_at) <= new Date()){
    await membersSupabase.rpc('auction_close', { p_item_id: item.id });
    item = null;
  }

  currentAuctionItemClosed = false;
  if(!item){
    const { data: closedItems } = await membersSupabase
      .from('auction_items')
      .select('id, name, description, image_url, winner_player_id, winning_bid_amount, closed_at')
      .eq('status', 'closed')
      .order('closed_at', { ascending: false })
      .limit(1);
    item = (closedItems && closedItems[0]) || null;
    currentAuctionItemClosed = true;
  }

  currentAuctionItem = item;

  if(currentAuctionItem){
    const { data: bids } = await membersSupabase
      .from('auction_bids')
      .select('player_id, amount')
      .eq('item_id', currentAuctionItem.id)
      .order('amount', { ascending: false });
    currentAuctionBids = bids || [];

    const me = window.faCurrentUser.id;
    const { data: myBids } = await membersSupabase
      .from('auction_bids')
      .select('created_at')
      .eq('player_id', me)
      .order('created_at', { ascending: false })
      .limit(1);
    myLastAuctionBidAt = (myBids && myBids[0]) ? myBids[0].created_at : null;
  } else {
    currentAuctionBids = [];
  }

  renderCurrentAuctionItem();
}

function renderCurrentAuctionItem(){
  const wrap = document.getElementById('home-auction-wrap');
  if(!currentAuctionItem){
    wrap.innerHTML = emptyState('No auction is currently live.');
    return;
  }

  const item = currentAuctionItem;

  if(currentAuctionItemClosed){
    wrap.innerHTML = `
      <div class="auction-item-card">
        ${item.image_url ? `<img class="auction-item-image" src="${escapeHtml(item.image_url)}" alt="">` : ''}
        <div class="auction-item-info">
          <div class="auction-item-label">Auction Ended</div>
          <div class="auction-item-name">${escapeHtml(item.name)}</div>
          ${item.description ? `<p class="auction-item-desc">${escapeHtml(item.description)}</p>` : ''}
          ${item.winner_player_id ? `
            <div class="auction-item-label">Winner</div>
            <div class="auction-item-amount">${escapeHtml(nameFor(item.winner_player_id))} - ${fmtMoney(item.winning_bid_amount)}</div>
          ` : `<p class="auction-item-desc">No bids were placed on this item.</p>`}
        </div>
      </div>
      <a class="btn-outline" href="auction.html" style="display:inline-block; text-decoration:none; margin-top:0.6rem;">Full Bid History</a>
    `;
    return;
  }

  const highest = currentAuctionBids.length ? currentAuctionBids[0] : null;
  const nextMin = auctionMinNextBid(item, currentAuctionBids);
  const cooldownMs = auctionCooldownRemainingMs();

  wrap.innerHTML = `
    <div class="auction-item-card">
      ${item.image_url ? `<img class="auction-item-image" src="${escapeHtml(item.image_url)}" alt="">` : ''}
      <div class="auction-item-info">
        <div class="auction-item-name">${escapeHtml(item.name)}</div>
        ${item.description ? `<p class="auction-item-desc">${escapeHtml(item.description)}</p>` : ''}
        <div class="auction-item-label">${highest ? 'Current Highest Bid' : 'Starting Bid'}</div>
        <div class="auction-item-amount">${fmtMoney(highest ? highest.amount : item.starting_bid)}</div>
        ${highest ? `<p class="auction-item-leading">Leading: ${escapeHtml(nameFor(highest.player_id))}</p>` : ''}
        ${item.ends_at ? `<p class="auction-item-leading">Ends: ${fmtDateTime(item.ends_at)}</p>` : ''}
      </div>
    </div>
    <div class="bank-form-grid">
      <div>
        <label class="field-label" for="home-auction-bid-amount">Amount (minimum ${fmtMoney(nextMin)})</label>
        <input type="number" id="home-auction-bid-amount" min="${nextMin}" step="1" value="${nextMin}" ${cooldownMs > 0 ? 'disabled' : ''}>
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button class="btn-gold" style="width:100%;" onclick="home_placeAuctionBid()" ${cooldownMs > 0 ? 'disabled' : ''}>Place Bid</button>
      </div>
    </div>
    ${cooldownMs > 0 ? `<p class="reg-empty-note">You can bid again at ${new Date(Date.now() + cooldownMs).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}.</p>` : ''}
    <p class="reg-error-note" id="home-auction-bid-error" style="display:none;"></p>
    <a class="btn-outline" href="auction.html" style="display:inline-block; text-decoration:none; margin-top:0.6rem;">Full Bid History</a>
  `;
}

async function home_placeAuctionBid(){
  const input = document.getElementById('home-auction-bid-amount');
  const errorEl = document.getElementById('home-auction-bid-error');
  errorEl.style.display = 'none';

  const amount = parseFloat(input.value);
  if(!amount || amount <= 0){
    errorEl.textContent = 'Enter a valid bid amount.';
    errorEl.style.display = 'block';
    return;
  }

  const { error } = await membersSupabase.rpc('auction_place_bid', { p_item_id: currentAuctionItem.id, p_amount: amount });
  if(error){
    errorEl.textContent = error.message;
    errorEl.style.display = 'block';
    return;
  }

  await loadCurrentAuctionItem();
}

window.home_placeAuctionBid = home_placeAuctionBid;

/* ---------- recent updates (unchanged behaviour) ---------- */

async function loadAnnouncements(){
  const list = document.getElementById('home-announce-list');
  const { data: rows } = await membersSupabase
    .from('announcements')
    .select('id, title, body, created_by, created_at')
    .order('created_at', { ascending: false });

  if(!rows || rows.length === 0){
    list.innerHTML = emptyState('No updates posted yet.');
    return;
  }

  list.innerHTML = rows.map(a => `
    <div class="bank-bill-card" data-id="${escapeHtml(a.id)}">
      <strong>${escapeHtml(a.title)}</strong>
      <span class="bank-request-date" style="float:right;">${fmtDateTime(a.created_at)}</span>
      <p style="margin-top:0.5rem;">${escapeHtml(a.body)}</p>
      <p class="reg-empty-note" style="margin-top:0.3rem;">Posted by ${escapeHtml(nameFor(a.created_by))}</p>
      ${isAnnounceStaff ? `<button class="btn-outline" data-delete-announce="${escapeHtml(a.id)}">Delete</button>` : ''}
    </div>
  `).join('');

  list.querySelectorAll('[data-delete-announce]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Delete this update?')) return;
      const { error } = await membersSupabase.rpc('announcement_delete', { p_id: btn.dataset.deleteAnnounce });
      if(error){ alert(error.message); return; }
      await loadAnnouncements();
    });
  });
}

async function home_postAnnouncement(){
  const errorEl = document.getElementById('home-announce-error');
  errorEl.style.display = 'none';

  const title = document.getElementById('home-announce-title').value.trim();
  const body = document.getElementById('home-announce-body').value.trim();

  const { error } = await membersSupabase.rpc('announcement_post', { p_title: title, p_body: body });
  if(error){
    errorEl.textContent = error.message;
    errorEl.style.display = 'block';
    return;
  }

  document.getElementById('home-announce-title').value = '';
  document.getElementById('home-announce-body').value = '';
  await loadAnnouncements();
}

window.home_postAnnouncement = home_postAnnouncement;

document.addEventListener('fa-members-ready', async (e) => {
  const user = e.detail.user;
  isAnnounceStaff = !!(user.app_metadata && (user.app_metadata.announcements_staff || user.app_metadata.site_admin));
  document.getElementById('home-announce-staff-section').style.display = isAnnounceStaff ? 'block' : 'none';

  const profiles = await faFetchAllRows('profiles', 'id, display_name');
  profileMap = {};
  (profiles || []).forEach(p => { profileMap[p.id] = p.display_name; });

  await loadHero();
  await loadKpis();
  await loadCurrentAuctionItem();
  await loadAnnouncements();
});
})();
</script>
