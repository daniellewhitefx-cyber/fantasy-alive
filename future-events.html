<script>
(function(){
function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function fmtDateTime(d){
  return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

document.addEventListener('fa-members-ready', () => {
  const events = (window.FA_EVENTS || []).slice(1);
  const list = document.getElementById('fe-list');

  if(events.length === 0){
    list.innerHTML = emptyState('No future events scheduled yet.');
    return;
  }

  list.innerHTML = events.map(e => {
    const window_ = window.faLogWindow(e);
    return `<div class="submitted-item"><div class="who">${escapeHtml(e.longLabel)}</div>Log opens ${escapeHtml(fmtDateTime(window_.opensAt))}</div>`;
  }).join('');
});
})();
</script>
