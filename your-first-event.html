<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your First Event - Fantasy Alive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.page-hero{
  display:grid;
  grid-template-columns: 1fr 1fr;
  align-items:center;
  height: 320px;
  overflow: hidden;
}
.page-hero-content{
  padding: 2rem 3rem 2rem 5.5rem;
  text-align: center;
}
.page-hero .logo-img{ width:100%; max-width: 440px; height:auto; display:block; margin: 0 auto; }
.page-hero h1{
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  font-size: 3rem;
  margin: 0.5rem 0 0;
  color: var(--brown);
  text-align: center;
}
.photo-slot{
  border: 2px dashed var(--gold-dark);
  border-radius: 6px;
  background: var(--cream-deep);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0.6rem;
  color: var(--brown-dark);
  font-family:'Cinzel', serif;
  font-weight:700;
  font-size:0.8rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  text-align:center;
  padding:1rem;
}
.photo-slot svg{ width:34px; height:34px; opacity:0.55; }
.photo-slot.hero-slot{ height:100%; min-height:320px; border-radius:0; }
.coming-soon{
  max-width: 700px;
  margin: 0 auto;
  padding: 3.5rem 2rem 4.5rem;
  text-align:center;
}
.coming-soon h2{
  font-size: 1.8rem;
  font-weight: 700;
  margin: 0 0 1rem;
  color: var(--brown-dark);
}
.coming-soon p{
  font-family:'EB Garamond', serif;
  font-size: 1.08rem;
  line-height: 1.6;
  color: #2e2415;
}
@media (max-width: 900px){
  .page-hero{ grid-template-columns: 1fr; height:auto; }
  .page-hero-content{ padding: 1.5rem 1rem; }
  .page-hero h1{ font-size: 2.2rem; }
  .photo-slot.hero-slot{ height:180px; min-height:180px; }
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<section class="page-hero">
<div class="page-hero-content">
<img src="https://i.imgur.com/YUATL72.png" alt="Fantasy Alive" class="logo-img">
<h1>Your First Event</h1>
</div>
<div class="photo-slot hero-slot">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
Add a photo
</div>
</section>

<section class="coming-soon">
<h2>Coming Soon</h2>
<p>We're still writing this guide to what to expect at your first event. Check back soon, or reach out on Discord if you have questions in the meantime.</p>
</section>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
</body>
</html>
