<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Inventory - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/inventory.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Inventory - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.inv-send-modal-overlay{
  position: fixed; inset: 0; z-index: 200;
}
.inv-send-modal-backdrop{
  position: absolute; inset: 0;
  background: rgba(30, 20, 10, 0.55);
}
.inv-send-modal{
  position: relative;
  max-width: 440px;
  margin: 8vh auto 0;
  background: var(--cream);
  border: 3px solid var(--gold);
  box-shadow: 10px 10px 0 0 var(--gold);
  padding: 1.8rem 2rem 2rem;
  font-family: 'EB Garamond', serif;
  color: var(--brown);
}
.inv-send-modal h3{
  font-family: 'Cinzel', serif;
  color: var(--brown-dark);
  margin: 0 0 1.2rem;
}
.inv-send-modal-close{
  position: absolute;
  top: 1.2rem;
  right: 1.4rem;
  background: none;
  border: none;
  font-size: 1.4rem;
  line-height: 1;
  cursor: pointer;
  color: var(--brown-dark);
}
.inv-send-modal label{ margin-top: 0.9rem; }
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<div class="char-switcher" id="inv-char-switcher"></div>

<h1 class="page-title">Inventory</h1>

<div id="inv-content"></div>

<div id="inv-send-modal" class="inv-send-modal-overlay" style="display:none;"></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let CHARACTERS = [];
let activeCharId = null;

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function inv_selectChar(id){
  activeCharId = id;
  render();
}

function render(){
  const switcher = document.getElementById('inv-char-switcher');
  switcher.innerHTML = CHARACTERS.map(ch =>
    `<button class="${ch.id===activeCharId?'active':''}" onclick="inv_selectChar('${ch.id}')">${escapeHtml(ch.name)}</button>`
  ).join('');

  const content = document.getElementById('inv-content');
  const c = CHARACTERS.find(ch => ch.id === activeCharId);

  if(!c){
    content.innerHTML = `<div class="panel"><div class="panel-body">${emptyState('You have no characters yet.')}</div></div>`;
    return;
  }

  if(c.loadError){
    content.innerHTML = `<div class="panel"><div class="panel-body"><p class="reg-error-note">Couldn't load inventory: ${escapeHtml(c.loadError)}</p></div></div>`;
    return;
  }

  if(!c.items.length){
    content.innerHTML = `<div class="panel"><div class="panel-body">${emptyState('No inventory yet. Buy Material/Equipment items from the Shoppe or craft items during an event.')}</div></div>`;
    return;
  }

  const nextEvent = window.FA_NEXT_EVENT;

  const rows = c.items.map(item => {
    const request = c.requests.find(r => r.item_name.trim().toLowerCase() === item.material_name.trim().toLowerCase());
    const nameEsc = item.material_name.replace(/'/g, "\\'");

    let actionCell;
    if(request && request.status === 'pending'){
      actionCell = `
        <span class="reg-empty-note" style="display:inline;">Tag requested for ${escapeHtml(request.event_slug)}</span>
        <button class="btn-outline" onclick="inv_cancelRequest('${request.id}')" title="Skip a tag for this item">Don't Need a Tag</button>
      `;
    } else if(request && request.status === 'cancelled'){
      actionCell = `
        <span class="reg-empty-note" style="display:inline;">Skipping a tag for ${escapeHtml(request.event_slug)}</span>
        <button class="btn-outline" onclick="inv_requestTag('${c.id}', '${nameEsc}', ${item.balance})">Request Tag After All</button>
      `;
    } else if(!nextEvent){
      actionCell = `<span class="reg-empty-note">No upcoming event scheduled</span>`;
    } else {
      actionCell = `<span class="reg-empty-note">Queuing a tag&hellip;</span>`;
    }

    return `
      <tr>
        <td>${escapeHtml(item.material_name)}</td>
        <td>${item.balance}</td>
        <td>${actionCell}</td>
        <td style="text-align:right;"><button class="btn-outline" onclick="inv_openSend('${c.id}', '${nameEsc}', ${item.balance})">Send</button></td>
      </tr>
    `;
  }).join('');

  content.innerHTML = `
    <div class="panel">
      <div class="panel-body">
        <p class="reg-empty-note" style="margin-bottom:0.8rem;">Everything on hand automatically gets a tag queued for the next event -- use "Don't Need a Tag" for anything you don't want printed.</p>
        <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Item</th><th>On Hand</th><th>Tag Status</th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <p class="reg-error-note" id="inv-error" style="display:none; margin-top:0.6rem;"></p>
      </div>
    </div>
  `;
}

async function inv_requestTag(characterId, itemName, quantity){
  const errorEl = document.getElementById('inv-error');
  errorEl.style.display = 'none';
  const qty = Math.max(1, parseInt(quantity, 10) || 1);
  const nextEvent = window.FA_NEXT_EVENT;
  if(!nextEvent) return;

  const { error } = await membersSupabase.rpc('character_request_tag', {
    p_character_id: characterId,
    p_item_name: itemName,
    p_quantity: qty,
    p_event_slug: nextEvent.value
  });
  if(error){ errorEl.textContent = error.message; errorEl.style.display = 'block'; return; }

  await loadCharacterInventory(characterId);
  render();
}

async function inv_cancelRequest(requestId){
  const { error } = await membersSupabase.rpc('character_cancel_tag_request', { p_request_id: requestId });
  if(error){ alert(error.message); return; }

  const c = CHARACTERS.find(ch => ch.id === activeCharId);
  if(c) await loadCharacterInventory(c.id);
  render();
}

async function loadCharacterInventory(characterId){
  const c = CHARACTERS.find(ch => ch.id === characterId);
  if(!c) return;

  c.loadError = null;
  try{
    const nextEvent = window.FA_NEXT_EVENT;
    if(nextEvent){
      const { error: ensureError } = await membersSupabase.rpc('character_ensure_tag_requests', {
        p_character_id: characterId, p_event_slug: nextEvent.value
      });
      if(ensureError) throw new Error(ensureError.message);
    }

    const [invRes, reqRes] = await Promise.all([
      membersSupabase.rpc('character_material_inventory', { p_character_id: characterId }),
      membersSupabase.from('character_tag_requests').select('id, item_name, quantity, event_slug, status')
        .eq('character_id', characterId).in('status', ['pending', 'cancelled'])
    ]);
    if(invRes.error) throw new Error(invRes.error.message);
    if(reqRes.error) throw new Error(reqRes.error.message);
    c.items = invRes.data || [];
    c.requests = reqRes.data || [];
  } catch(err){
    c.loadError = err.message;
    c.items = [];
    c.requests = [];
  }
}

let ALL_CHARACTERS = [];
let PROFILE_MAP = {};

async function loadRecipientData(){
  const [{ data: chars }, profiles] = await Promise.all([
    membersSupabase.rpc('character_names'),
    faFetchAllRows('profiles', 'id, display_name')
  ]);
  ALL_CHARACTERS = chars || [];
  PROFILE_MAP = {};
  (profiles || []).forEach(p => { PROFILE_MAP[p.id] = p.display_name; });
}

function inv_openSend(characterId, itemName, balance){
  const modal = document.getElementById('inv-send-modal');
  const recipients = ALL_CHARACTERS
    .filter(c => c.id !== characterId)
    .map(c => ({ id: c.id, label: `${c.name} (${PROFILE_MAP[c.player_id] || 'Unknown player'})` }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const options = recipients.length
    ? recipients.map(r => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.label)}</option>`).join('')
    : '';

  modal.style.display = 'block';
  modal.innerHTML = `
    <div class="inv-send-modal-backdrop" onclick="inv_closeSend()"></div>
    <div class="inv-send-modal">
      <button class="inv-send-modal-close" onclick="inv_closeSend()">&times;</button>
      <h3>Send ${escapeHtml(itemName)}</h3>
      ${recipients.length ? '' : '<p class="reg-empty-note">No other characters to send to yet.</p>'}
      <input type="hidden" id="inv-send-from-char" value="${escapeHtml(characterId)}">
      <input type="hidden" id="inv-send-item-name" value="${escapeHtml(itemName)}">
      <label class="field-label" for="inv-send-to">Send to</label>
      <select id="inv-send-to">
        <option value="">Choose a character</option>
        ${options}
      </select>
      <label class="field-label" for="inv-send-qty">Quantity (you have ${balance})</label>
      <input type="number" id="inv-send-qty" min="1" max="${balance}" value="1">
      <label class="field-label" for="inv-send-note">Note (optional)</label>
      <textarea id="inv-send-note" placeholder="Anything to include with it..."></textarea>
      <button class="btn-gold" style="margin-top:1.2rem;" onclick="inv_submitSend()" ${recipients.length ? '' : 'disabled'}>Send</button>
      <p class="reg-error-note" id="inv-send-error" style="display:none; margin-top:0.6rem;"></p>
    </div>
  `;
}

function inv_closeSend(){
  const modal = document.getElementById('inv-send-modal');
  modal.style.display = 'none';
  modal.innerHTML = '';
}

async function inv_submitSend(){
  const errorEl = document.getElementById('inv-send-error');
  errorEl.style.display = 'none';

  const fromCharId = document.getElementById('inv-send-from-char').value;
  const itemName = document.getElementById('inv-send-item-name').value;
  const toCharId = document.getElementById('inv-send-to').value;
  const qty = parseInt(document.getElementById('inv-send-qty').value, 10);
  const note = document.getElementById('inv-send-note').value.trim();

  if(!toCharId){ errorEl.textContent = 'Choose who to send this to.'; errorEl.style.display = 'block'; return; }
  if(!qty || qty < 1){ errorEl.textContent = 'Enter a quantity of at least 1.'; errorEl.style.display = 'block'; return; }

  const { error } = await membersSupabase.rpc('character_send_item', {
    p_from_character_id: fromCharId,
    p_to_character_id: toCharId,
    p_item_name: itemName,
    p_quantity: qty,
    p_note: note || null
  });
  if(error){ errorEl.textContent = error.message; errorEl.style.display = 'block'; return; }

  inv_closeSend();
  await loadCharacterInventory(fromCharId);
  render();
}

async function loadCharacters(){
  const me = window.faCurrentUser.id;

  const { data: chars } = await membersSupabase
    .from('characters')
    .select('id, name')
    .eq('player_id', me)
    .order('created_at', { ascending: true });

  CHARACTERS = (chars || []).map(ch => ({ id: ch.id, name: ch.name, items: [], requests: [], loadError: null }));
  activeCharId = CHARACTERS.length ? CHARACTERS[0].id : null;

  await loadRecipientData();

  if(CHARACTERS.length){
    await Promise.all(CHARACTERS.map(ch => loadCharacterInventory(ch.id)));
  }

  render();
}

window.inv_selectChar = inv_selectChar;
window.inv_requestTag = inv_requestTag;
window.inv_cancelRequest = inv_cancelRequest;
window.inv_openSend = inv_openSend;
window.inv_closeSend = inv_closeSend;
window.inv_submitSend = inv_submitSend;
document.addEventListener('fa-members-ready', loadCharacters);
})();
</script>

</body>
</html>
