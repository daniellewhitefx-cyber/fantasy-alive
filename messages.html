<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Messages - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/messages.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Messages - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Messages</h1>

<div class="msg-layout">

<div class="msg-folder-rail" id="msg-folder-rail"></div>

<div class="msg-list-pane">
<div class="msg-list-pane-header">
<button class="btn-gold" style="width:100%;" onclick="msg_startCompose()">+ New Message</button>
</div>
<div class="msg-list-items" id="msg-conversation-list"><p class="reg-empty-note" style="padding:1rem;">Loading&hellip;</p></div>
</div>

<div class="msg-reading-pane" id="msg-reading-pane">
<p class="msg-reading-empty">Select a conversation, or start a new message.</p>
</div>

</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let profileMap = {};
let charsByPlayer = {};
let departments = [];
let myCharacters = [];
let myDepartments = [];
let charNameMap = {};
let allMessages = [];
let conversations = [];
let folders = [];
let folderAssignments = {};
let activeConversationKey = null;
let activeView = 'inbox';
let draggedKey = null;
let composeTarget = null;

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function fmtDateTime(iso){
  return new Date(iso).toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function nameFor(playerId){
  const base = profileMap[playerId] || 'Unknown player';
  const chars = charsByPlayer[playerId];
  return chars && chars.length ? `${base} (${chars.join(', ')})` : base;
}
function deptName(id){ const d = departments.find(x => x.id === id); return d ? d.name : 'Unknown department'; }
function charNameFor(id){ return charNameMap[id] || 'Unknown character'; }

function senderLabel(m, me){
  let label;
  if(m.sender_department_id) label = deptName(m.sender_department_id);
  else if(m.sender_character_id) label = charNameFor(m.sender_character_id);
  else label = nameFor(m.sender_id);
  return m.sender_id === me ? `${label} (You)` : label;
}

function fromSelectorOptionsHtml(){
  const me = window.faCurrentUser.id;
  let html = `<option value="player">${escapeHtml(nameFor(me))} (You)</option>`;
  html += myCharacters.map(c => `<option value="character:${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join('');
  html += myDepartments.map(d => `<option value="department:${escapeHtml(d.id)}">${escapeHtml(d.name)}</option>`).join('');
  return html;
}

function playerSelectOptionsHtml(){
  const me = window.faCurrentUser.id;
  return Object.keys(profileMap)
    .filter(id => id !== me)
    .map(id => ({ id, label: nameFor(id) }))
    .sort((a, b) => a.label.localeCompare(b.label))
    .map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.label)}</option>`)
    .join('');
}

function msg_pickPlayerFromSelect(id){
  composeTarget = id ? { type: 'player', id } : null;
}

function parseFromValue(val){
  if(val && val.startsWith('character:')) return { characterId: val.slice('character:'.length), departmentId: null };
  if(val && val.startsWith('department:')) return { characterId: null, departmentId: val.slice('department:'.length) };
  return { characterId: null, departmentId: null };
}

function msg_startCompose(){
  activeConversationKey = null;
  composeTarget = null;
  renderConversationList();

  document.getElementById('msg-reading-pane').innerHTML = `
    <div class="msg-thread-title">New Message</div>
    <label class="field-label" for="msg-compose-from">From</label>
    <select id="msg-compose-from" style="margin-bottom:1rem;">
      ${fromSelectorOptionsHtml()}
    </select>
    <label class="field-label" for="msg-compose-type">Send To</label>
    <select id="msg-compose-type" onchange="msg_composeTypeChange()" style="margin-bottom:1rem;">
      <option value="player">A Player</option>
      <option value="department">A Department</option>
    </select>
    <div id="msg-compose-target-wrap">
      <label class="field-label" for="msg-compose-player-select">Player</label>
      <select id="msg-compose-player-select" onchange="msg_pickPlayerFromSelect(this.value)">
        <option value="">Choose a player</option>
        ${playerSelectOptionsHtml()}
      </select>
    </div>
    <label class="field-label" for="msg-compose-subject" style="margin-top:1rem;">Subject</label>
    <input type="text" id="msg-compose-subject" placeholder="What's this about?" maxlength="120">
    <label class="field-label" for="msg-compose-body" style="margin-top:1rem;">Message</label>
    <textarea id="msg-compose-body" placeholder="Write your message..."></textarea>
    <button class="btn-gold" style="margin-top:1rem;" onclick="msg_send()">Send</button>
    <p class="reg-success-note" id="msg-compose-success" style="display:none;"></p>
    <p class="reg-error-note" id="msg-compose-error" style="display:none;"></p>
  `;
}

function msg_composeTypeChange(){
  const type = document.getElementById('msg-compose-type').value;
  const wrap = document.getElementById('msg-compose-target-wrap');
  composeTarget = null;

  if(type === 'player'){
    wrap.innerHTML = `
      <label class="field-label" for="msg-compose-player-select">Player</label>
      <select id="msg-compose-player-select" onchange="msg_pickPlayerFromSelect(this.value)">
        <option value="">Choose a player</option>
        ${playerSelectOptionsHtml()}
      </select>
    `;
  } else {
    wrap.innerHTML = `
      <label class="field-label" for="msg-compose-department">Department</label>
      <select id="msg-compose-department" onchange="msg_pickDepartment(this.value)">
        <option value="">Choose a department</option>
        ${departments.map(d => `<option value="${d.id}">${escapeHtml(d.name)}</option>`).join('')}
      </select>
    `;
  }
}

function msg_pickDepartment(id){
  composeTarget = id ? { type: 'department', id } : null;
}

async function msg_send(){
  const successEl = document.getElementById('msg-compose-success');
  const errorEl = document.getElementById('msg-compose-error');
  successEl.style.display = 'none';
  errorEl.style.display = 'none';

  const body = document.getElementById('msg-compose-body').value.trim();
  const subject = document.getElementById('msg-compose-subject').value.trim();
  if(!body){ errorEl.textContent = 'Message cannot be empty.'; errorEl.style.display = 'block'; return; }
  if(!composeTarget){ errorEl.textContent = 'Choose who to send this to.'; errorEl.style.display = 'block'; return; }

  const from = parseFromValue(document.getElementById('msg-compose-from').value);

  const { data: newId, error } = await membersSupabase.rpc('message_send', {
    p_recipient_player_id: composeTarget.type === 'player' ? composeTarget.id : null,
    p_recipient_department_id: composeTarget.type === 'department' ? composeTarget.id : null,
    p_body: body,
    p_subject: subject,
    p_sender_character_id: from.characterId,
    p_sender_department_id: from.departmentId
  });
  if(error){ errorEl.textContent = error.message; errorEl.style.display = 'block'; return; }

  successEl.textContent = 'Sent.';
  successEl.style.display = 'block';

  await loadMessages();
  const sent = allMessages.find(m => m.id === newId);
  if(sent) await msg_openConversation(sent.thread_key);
}

function buildConversations(){
  const me = window.faCurrentUser.id;
  const byKey = {};

  allMessages.forEach(m => {
    const key = m.thread_key;
    let label, isDept, otherId, deptId;
    if(m.recipient_department_id){
      isDept = true;
      deptId = m.recipient_department_id;
      label = deptName(deptId);
    } else {
      isDept = false;
      otherId = m.sender_id === me ? m.recipient_player_id : m.sender_id;
      label = nameFor(otherId);
    }
    if(!byKey[key]) byKey[key] = { key, label, subject: m.subject, isDept, otherId, deptId, messages: [] };
    byKey[key].messages.push(m);
  });

  conversations = Object.values(byKey).map(c => {
    c.messages.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    const last = c.messages[c.messages.length - 1];
    c.lastAt = last.created_at;
    c.lastBody = last.body;
    c.unreadCount = c.messages.filter(m => m.sender_id !== me && !m.readByMe).length;
    c.folderId = folderAssignments[c.key] || null;
    return c;
  }).sort((a, b) => new Date(b.lastAt) - new Date(a.lastAt));
}

function conversationView(c){
  return c.folderId || 'inbox';
}

function renderConversationList(){
  const target = document.getElementById('msg-conversation-list');
  const visible = conversations.filter(c => conversationView(c) === activeView);
  if(visible.length === 0){
    target.innerHTML = emptyState('No conversations here.');
    return;
  }
  target.innerHTML = visible.map(c => `
    <button class="msg-list-item ${c.unreadCount ? 'unread' : ''} ${c.key === activeConversationKey ? 'active' : ''}" data-key="${escapeHtml(c.key)}" draggable="true">
      <div class="msg-list-item-top">
        <span class="msg-list-name">${c.unreadCount ? '<span class="msg-list-dot"></span>' : ''}${escapeHtml(c.label)}</span>
        <span class="msg-list-date">${fmtDateTime(c.lastAt)}</span>
      </div>
      <div class="msg-list-subject">${escapeHtml(c.subject)}</div>
      <div class="msg-list-snippet">${escapeHtml(c.lastBody)}</div>
    </button>
  `).join('');
  target.querySelectorAll('.msg-list-item').forEach(btn => {
    btn.addEventListener('click', () => msg_openConversation(btn.dataset.key));
    btn.addEventListener('dragstart', (e) => {
      draggedKey = btn.dataset.key;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', btn.dataset.key);
      btn.classList.add('dragging');
    });
    btn.addEventListener('dragend', () => { btn.classList.remove('dragging'); draggedKey = null; });
  });
}

function setupFolderDropTarget(el, folderId){
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    el.classList.remove('drag-over');
    const key = draggedKey || e.dataTransfer.getData('text/plain');
    if(key) msg_assignFolder(key, folderId);
    draggedKey = null;
  });
}

function renderFolderRail(){
  const rail = document.getElementById('msg-folder-rail');
  const countBadge = (n) => n > 0 ? ` <span class="msg-folder-count">${n}</span>` : '';
  const inboxUnread = conversations.filter(c => conversationView(c) === 'inbox').reduce((s, c) => s + c.unreadCount, 0);

  rail.innerHTML = `
    <button class="msg-folder-item ${activeView === 'inbox' ? 'active' : ''}" data-view="inbox">Inbox${countBadge(inboxUnread)}</button>
    <div class="msg-folder-divider"></div>
    ${folders.map(f => {
      const count = conversations.filter(c => conversationView(c) === f.id).reduce((s, c) => s + c.unreadCount, 0);
      return `
        <div class="msg-folder-row" data-folder-drop="${escapeHtml(f.id)}">
          <button class="msg-folder-item ${activeView === f.id ? 'active' : ''}" data-view="${escapeHtml(f.id)}">${escapeHtml(f.name)}${countBadge(count)}</button>
          <button class="msg-folder-action" data-rename="${escapeHtml(f.id)}" data-name="${escapeHtml(f.name)}" title="Rename folder">&#9998;</button>
          <button class="msg-folder-action" data-delete="${escapeHtml(f.id)}" data-name="${escapeHtml(f.name)}" title="Delete folder">&times;</button>
        </div>
      `;
    }).join('')}
    <div class="msg-folder-new">
      <input type="text" id="msg-new-folder-name" placeholder="New folder name">
      <button class="btn-gold" id="msg-new-folder-btn">Add</button>
    </div>
  `;
  rail.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => msg_selectView(btn.dataset.view));
  });
  rail.querySelectorAll('[data-rename]').forEach(btn => {
    btn.addEventListener('click', () => msg_renameFolder(btn.dataset.rename, btn.dataset.name));
  });
  rail.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', () => msg_deleteFolder(btn.dataset.delete, btn.dataset.name));
  });
  document.getElementById('msg-new-folder-btn').addEventListener('click', msg_createFolder);

  setupFolderDropTarget(rail.querySelector('[data-view="inbox"]'), null);
  rail.querySelectorAll('[data-folder-drop]').forEach(row => {
    setupFolderDropTarget(row, row.dataset.folderDrop);
  });
}

function refreshThreadFolderSelect(){
  const select = document.getElementById('msg-thread-folder-select');
  if(!select || !activeConversationKey) return;
  const convo = conversations.find(c => c.key === activeConversationKey);
  if(!convo) return;
  select.innerHTML = `
    <option value="">No folder</option>
    ${folders.map(f => `<option value="${escapeHtml(f.id)}" ${convo.folderId === f.id ? 'selected' : ''}>${escapeHtml(f.name)}</option>`).join('')}
  `;
}

function msg_selectView(view){
  activeView = view;
  renderFolderRail();
  renderConversationList();
}

async function msg_createFolder(){
  const input = document.getElementById('msg-new-folder-name');
  const name = input.value.trim();
  if(!name) return;

  const { error } = await membersSupabase.rpc('message_folder_create', { p_name: name });
  if(error){ alert(error.message); return; }

  await loadFolders();
  buildConversations();
  renderFolderRail();
  renderConversationList();
  refreshThreadFolderSelect();
}

async function msg_renameFolder(folderId, oldName){
  const name = prompt('Rename folder', oldName);
  if(name === null) return;
  const trimmed = name.trim();
  if(!trimmed) return;

  const { error } = await membersSupabase.rpc('message_folder_rename', { p_folder_id: folderId, p_name: trimmed });
  if(error){ alert(error.message); return; }

  await loadFolders();
  renderFolderRail();
  refreshThreadFolderSelect();
}

async function msg_deleteFolder(folderId, name){
  if(!confirm(`Delete the "${name}" folder? Conversations inside move back to Inbox.`)) return;

  const { error } = await membersSupabase.rpc('message_folder_delete', { p_folder_id: folderId });
  if(error){ alert(error.message); return; }

  if(activeView === folderId) activeView = 'inbox';
  await loadFolders();
  buildConversations();
  renderFolderRail();
  renderConversationList();
  refreshThreadFolderSelect();
}

async function msg_assignFolder(threadKey, folderId){
  const { error } = await membersSupabase.rpc('message_set_folder', { p_thread_key: threadKey, p_folder_id: folderId });
  if(error){ alert(error.message); return; }

  await loadFolders();
  buildConversations();
  renderFolderRail();
  renderConversationList();
  refreshThreadFolderSelect();
}

async function msg_moveConversation(folderId){
  if(!activeConversationKey) return;
  await msg_assignFolder(activeConversationKey, folderId || null);
}

async function msg_openConversation(key){
  activeConversationKey = key;
  const convo = conversations.find(c => c.key === key);
  if(!convo) return;

  renderConversationList();

  const me = window.faCurrentUser.id;
  document.getElementById('msg-reading-pane').innerHTML = `
    <div class="msg-thread-header">
      <div>
        <div class="msg-thread-title">${escapeHtml(convo.subject)}</div>
        <div class="msg-thread-subhead">${escapeHtml(convo.label)}</div>
      </div>
      <select id="msg-thread-folder-select">
        <option value="">No folder</option>
        ${folders.map(f => `<option value="${escapeHtml(f.id)}" ${convo.folderId === f.id ? 'selected' : ''}>${escapeHtml(f.name)}</option>`).join('')}
      </select>
    </div>
    <div id="msg-thread-body">
      ${convo.messages.map(m => `
        <div class="msg-bubble ${m.sender_id === me ? 'mine' : ''}">
          <div class="msg-bubble-meta">${escapeHtml(senderLabel(m, me))} &middot; ${fmtDateTime(m.created_at)}</div>
          <div>${escapeHtml(m.body)}</div>
        </div>
      `).join('')}
    </div>
    <label class="field-label" for="msg-reply-from" style="margin-top:0.6rem;">From</label>
    <select id="msg-reply-from">
      ${fromSelectorOptionsHtml()}
    </select>
    <label class="field-label" for="msg-reply-body" style="margin-top:0.6rem;">Reply</label>
    <textarea id="msg-reply-body" placeholder="Write a reply..."></textarea>
    <button class="btn-gold" style="margin-top:1rem;" onclick="msg_reply()">Reply</button>
    <p class="reg-error-note" id="msg-reply-error" style="display:none;"></p>
  `;
  document.getElementById('msg-thread-folder-select').addEventListener('change', (e) => msg_moveConversation(e.target.value));

  const unreadIds = convo.messages.filter(m => m.sender_id !== me && !m.readByMe).map(m => m.id);
  if(unreadIds.length){
    await Promise.all(unreadIds.map(id => membersSupabase.rpc('message_mark_read', { p_message_id: id })));
    await loadMessages(key);
    renderFolderRail();
    if(typeof refreshMessagesBadge === 'function') refreshMessagesBadge();
  }
}

async function msg_reply(){
  const errorEl = document.getElementById('msg-reply-error');
  errorEl.style.display = 'none';

  const convo = conversations.find(c => c.key === activeConversationKey);
  if(!convo) return;
  const body = document.getElementById('msg-reply-body').value.trim();
  if(!body){ errorEl.textContent = 'Reply cannot be empty.'; errorEl.style.display = 'block'; return; }

  const from = parseFromValue(document.getElementById('msg-reply-from').value);

  const { error } = await membersSupabase.rpc('message_send', {
    p_recipient_player_id: convo.isDept ? null : convo.otherId,
    p_recipient_department_id: convo.isDept ? convo.deptId : null,
    p_body: body,
    p_subject: convo.subject,
    p_sender_character_id: from.characterId,
    p_sender_department_id: from.departmentId
  });
  if(error){ errorEl.textContent = error.message; errorEl.style.display = 'block'; return; }

  await loadMessages(activeConversationKey);
}

async function loadFolders(){
  const me = window.faCurrentUser.id;

  const { data: fldrs } = await membersSupabase.from('message_folders').select('id, name').order('name');
  folders = fldrs || [];

  const { data: assigns } = await membersSupabase.from('message_folder_assignments').select('thread_key, folder_id').eq('player_id', me);
  folderAssignments = {};
  (assigns || []).forEach(a => { folderAssignments[a.thread_key] = a.folder_id; });
}

async function loadMessages(reopenKey){
  const me = window.faCurrentUser.id;

  const { data: msgs } = await membersSupabase
    .from('messages')
    .select('id, sender_id, recipient_player_id, recipient_department_id, subject, thread_key, body, created_at, sender_character_id, sender_department_id')
    .order('created_at', { ascending: true });

  const { data: reads } = await membersSupabase
    .from('message_reads')
    .select('message_id')
    .eq('player_id', me);
  const readSet = new Set((reads || []).map(r => r.message_id));

  allMessages = (msgs || []).map(m => ({ ...m, readByMe: readSet.has(m.id) }));

  const charIds = [...new Set(allMessages.map(m => m.sender_character_id).filter(Boolean))];
  const missingCharIds = charIds.filter(id => !charNameMap[id]);
  if(missingCharIds.length){
    const { data: chars } = await membersSupabase.rpc('character_names').select('id, name').in('id', missingCharIds);
    (chars || []).forEach(c => { charNameMap[c.id] = c.name; });
  }

  buildConversations();

  if(reopenKey && conversations.some(c => c.key === reopenKey)){
    await msg_openConversation(reopenKey);
  } else {
    renderConversationList();
  }
}

async function init(){
  const me = window.faCurrentUser.id;

  const [profiles, { data: allChars }] = await Promise.all([
    faFetchAllRows('profiles', 'id, display_name'),
    membersSupabase.rpc('character_names').select('name, player_id')
  ]);
  profileMap = {};
  (profiles || []).forEach(p => { profileMap[p.id] = p.display_name; });
  charsByPlayer = {};
  (allChars || []).forEach(c => {
    (charsByPlayer[c.player_id] = charsByPlayer[c.player_id] || []).push(c.name);
  });

  const { data: depts } = await membersSupabase.from('departments').select('id, name').order('name');
  departments = depts || [];

  const { data: chars } = await membersSupabase.from('characters').select('id, name').eq('player_id', me);
  myCharacters = chars || [];

  const { data: myDeptRows } = await membersSupabase.from('department_members').select('department_id').eq('player_id', me);
  myDepartments = (myDeptRows || []).map(r => ({ id: r.department_id, name: deptName(r.department_id) }));

  await loadFolders();
  await loadMessages();
  renderFolderRail();
}

window.msg_startCompose = msg_startCompose;
window.msg_composeTypeChange = msg_composeTypeChange;
window.msg_pickDepartment = msg_pickDepartment;
window.msg_pickPlayerFromSelect = msg_pickPlayerFromSelect;
window.msg_send = msg_send;
window.msg_reply = msg_reply;

document.addEventListener('fa-members-ready', init);
})();
</script>

</body>
</html>
