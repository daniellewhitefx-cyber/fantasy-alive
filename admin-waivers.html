<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waivers & Contacts (Staff) - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Waivers & Contacts (Staff) - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/admin-waivers.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Waivers & Contacts (Staff) - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.aw-summary-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 0.8rem;
  margin-bottom: 1.2rem;
}
.aw-summary-tile{
  border: 2px solid var(--line);
  padding: 0.7rem 0.9rem;
  background: var(--row-b);
}
.aw-summary-tile .val{ font-family:'Cinzel', serif; font-weight:700; font-size: 1.4rem; }
.aw-summary-tile .lbl{ font-size: 0.78rem; color: var(--brown-dark); }
.aw-detail-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}
.aw-detail-field{ margin-bottom: 0.6rem; }
.aw-detail-field .k{ font-family:'Cinzel', serif; font-size: 0.72rem; text-transform:uppercase; letter-spacing:0.03em; color: var(--gold-dark); }
.aw-detail-field .v{ font-family:'EB Garamond', serif; font-size: 1rem; }
.aw-detail-field .v.empty{ color: var(--brown-dark); font-style:italic; }
@media (max-width: 700px){
  .aw-detail-grid{ grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Waivers &amp; Contacts</h1>

<div class="reg-already-registered" id="aw-blocked-notice" style="display:none;">
<h3>Staff access required</h3>
<p>This page is only available to site admins and Logistics.</p>
</div>

<div id="aw-wrap" style="display:none;">

<div class="aw-summary-grid" id="aw-summary"></div>

<div class="reg-section">
<label class="field-label" for="aw-search">Search by player name or email</label>
<input type="text" id="aw-search" placeholder="Start typing..." oninput="aw_renderTable()">
<div class="table-scroll" style="margin-top:0.8rem;">
<table class="data-table" id="aw-results-table">
<thead><tr><th>Player</th><th>Waiver</th><th>Emergency Contact</th><th></th></tr></thead>
<tbody id="aw-results"></tbody>
</table>
</div>
</div>

<div id="aw-detail" style="display:none;">

<div class="reg-section">
<div class="reg-section-label" id="aw-detail-name"></div>

<h3 style="font-family:'Cinzel', serif; font-size:1.05rem; margin:0.8rem 0 0.6rem;">Liability Waiver</h3>
<div class="aw-detail-grid" id="aw-waiver-fields"></div>

<h3 style="font-family:'Cinzel', serif; font-size:1.05rem; margin:1.4rem 0 0.6rem;">Emergency Contact</h3>
<div class="aw-detail-grid" id="aw-contact-fields"></div>

<button class="btn-outline" style="margin-top:1rem;" onclick="aw_closeDetail()">Close</button>
</div>

</div>

</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let ROSTER = [];

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}

function formatDate(iso){
  if(!iso) return null;
  return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}

async function aw_load(){
  const summaryEl = document.getElementById('aw-summary');
  summaryEl.innerHTML = '<p class="reg-empty-note">Loading roster&hellip;</p>';

  const { data, error } = await membersSupabase.rpc('admin_list_waiver_status');
  if(error){
    summaryEl.innerHTML = `<p class="reg-error-note">Couldn't load waiver status: ${escapeHtml(error.message)}</p>`;
    return;
  }
  ROSTER = data || [];

  const waiverSigned = ROSTER.filter(r => r.waiver_signed_at).length;
  const contactOnFile = ROSTER.filter(r => r.contact_updated_at).length;
  summaryEl.innerHTML = `
    <div class="aw-summary-tile"><div class="val">${ROSTER.length}</div><div class="lbl">Total Players</div></div>
    <div class="aw-summary-tile"><div class="val">${waiverSigned}</div><div class="lbl">Waiver Signed</div></div>
    <div class="aw-summary-tile"><div class="val">${ROSTER.length - waiverSigned}</div><div class="lbl">Waiver Missing</div></div>
    <div class="aw-summary-tile"><div class="val">${contactOnFile}</div><div class="lbl">Contact On File</div></div>
    <div class="aw-summary-tile"><div class="val">${ROSTER.length - contactOnFile}</div><div class="lbl">Contact Missing</div></div>
  `;

  aw_renderTable();
}

function aw_renderTable(){
  const tbody = document.getElementById('aw-results');
  const query = document.getElementById('aw-search').value.trim().toLowerCase();
  const rows = ROSTER.filter(r =>
    !query || (r.display_name || '').toLowerCase().includes(query) || (r.email || '').toLowerCase().includes(query)
  );

  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="4">${emptyState(ROSTER.length === 0 ? 'No players found.' : 'No players match that search.')}</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${escapeHtml(r.display_name)}</td>
      <td>${r.waiver_signed_at ? `<span class="status-pill approved">Signed ${escapeHtml(formatDate(r.waiver_signed_at))}</span>` : '<span class="status-pill denied">Missing</span>'}</td>
      <td>${r.contact_updated_at ? `<span class="status-pill approved">On File ${escapeHtml(formatDate(r.contact_updated_at))}</span>` : '<span class="status-pill denied">Missing</span>'}</td>
      <td style="text-align:right;"><button class="btn-gold" onclick="aw_viewDetail('${r.player_id}')">View</button></td>
    </tr>
  `).join('');
}

function detailField(label, value){
  const has = value !== null && value !== undefined && String(value).trim() !== '';
  return `<div class="aw-detail-field"><div class="k">${escapeHtml(label)}</div><div class="v${has ? '' : ' empty'}">${has ? escapeHtml(value) : 'Not provided'}</div></div>`;
}

function aw_viewDetail(playerId){
  const r = ROSTER.find(x => x.player_id === playerId);
  if(!r) return;

  document.getElementById('aw-detail-name').textContent = `${r.display_name} (${r.email})`;

  document.getElementById('aw-waiver-fields').innerHTML = r.waiver_signed_at ? [
    detailField('Signed', formatDate(r.waiver_signed_at)),
    detailField('Legal Name', r.waiver_legal_name),
    detailField('Signature', r.waiver_signature_name),
    detailField('Guardian Signature', r.waiver_guardian_signature_name)
  ].join('') : `<p class="reg-empty-note">No liability waiver on file yet.</p>`;

  document.getElementById('aw-contact-fields').innerHTML = r.contact_updated_at ? [
    detailField('Full Name', r.contact_full_name),
    detailField('Character(s)', r.contact_characters),
    detailField('Home Address', r.contact_home_address),
    detailField('City', r.contact_city),
    detailField('Postal Code', r.contact_postal_code),
    detailField('Phone', r.contact_phone),
    detailField('Contact 1 Name', r.contact1_name),
    detailField('Contact 1 Phone', r.contact1_phone),
    detailField('Contact 1 Relationship', r.contact1_relationship),
    detailField('Contact 1 Email', r.contact1_email),
    detailField('Contact 2 Name', r.contact2_name),
    detailField('Contact 2 Phone', r.contact2_phone),
    detailField('Contact 2 Relationship', r.contact2_relationship),
    detailField('Contact 2 Email', r.contact2_email),
    detailField('Medical Conditions', r.medical_conditions),
    detailField('Other Notes', r.other_notes)
  ].join('') : `<p class="reg-empty-note">No emergency contact form on file yet.</p>`;

  document.getElementById('aw-detail').style.display = 'block';
  document.getElementById('aw-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function aw_closeDetail(){
  document.getElementById('aw-detail').style.display = 'none';
}

window.aw_renderTable = aw_renderTable;
window.aw_viewDetail = aw_viewDetail;
window.aw_closeDetail = aw_closeDetail;

document.addEventListener('fa-members-ready', async () => {
  const { data: allowed, error } = await membersSupabase.rpc('fa_is_logistics_or_admin');
  if(error || !allowed){
    document.getElementById('aw-blocked-notice').style.display = 'block';
    return;
  }
  document.getElementById('aw-wrap').style.display = 'block';
  await aw_load();
});
})();
</script>

</body>
</html>
