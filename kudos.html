<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kudos - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Kudos - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/kudos.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kudos - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Kudos</h1>

<div class="bank-recipient-picker" data-picker="kudos">
<label class="field-label" for="kudos-recipient-select">Give kudos to</label>
<select id="kudos-recipient-select" onchange="kudos_pickFromSelect(this.value)">
<option value="">Select a player or character...</option>
</select>
</div>

<div class="section-block">
<label class="field-label" for="kudos-kudos-text">Your feedback</label>
<textarea id="kudos-kudos-text" placeholder="Say what they did well..."></textarea>
</div>

<button class="btn-gold" onclick="kudos_submitKudos()">Submit Kudos</button>
<p class="reg-error-note" id="kudos-error" style="display:none;"></p>

<div class="submitted-list" id="kudos-received-list"></div>

<div class="submitted-list" id="kudos-submitted-list"></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let selectedRecipient = null;
let ALL_CANDIDATES = [];

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadAllCandidates(){
  const myUserId = window.faCurrentUser ? window.faCurrentUser.id : null;

  const [{ data: chars }, { data: profiles }, { data: castRows }] = await Promise.all([
    membersSupabase.rpc('character_names').select('id, name, player_id'),
    membersSupabase.from('profiles').select('id, display_name'),
    membersSupabase.from('profiles').select('id, display_name').eq('is_cast', true)
  ]);

  const nameByPlayer = {};
  (profiles || []).forEach(p => { nameByPlayer[p.id] = p.display_name; });

  const charOwnerIds = new Set((chars || []).map(c => c.player_id));

  const charCandidates = (chars || [])
    .filter(c => c.player_id !== myUserId)
    .map(c => ({
      type: 'character',
      id: c.id,
      name: c.name,
      playerName: nameByPlayer[c.player_id] || 'Unknown player',
      label: `${c.name} [${nameByPlayer[c.player_id] || 'Unknown player'}]`
    }));

  const castCandidates = (castRows || [])
    .filter(p => p.id !== myUserId && !charOwnerIds.has(p.id))
    .map(p => ({
      type: 'player',
      id: p.id,
      name: p.display_name,
      playerName: p.display_name,
      label: `${p.display_name} (Cast)`
    }));

  ALL_CANDIDATES = [...charCandidates, ...castCandidates].sort((a, b) => a.name.localeCompare(b.name));
  renderCandidates();
}

function renderCandidates(){
  const selectEl = document.getElementById('kudos-recipient-select');
  selectEl.innerHTML = '<option value="">Select a player or character...</option>' +
    ALL_CANDIDATES.map(c => `<option value="${c.type}:${escapeHtml(c.id)}">${escapeHtml(c.label)}</option>`).join('');
}

function kudos_pickFromSelect(value){
  if(!value){ selectedRecipient = null; return; }
  const [type, id] = value.split(':');
  const found = ALL_CANDIDATES.find(c => c.type === type && String(c.id) === id);
  selectedRecipient = found ? { type: found.type, id: found.id, label: found.label } : null;
}

async function kudos_submitKudos(){
  const errorEl = document.getElementById('kudos-error');
  errorEl.style.display = 'none';
  const text = document.getElementById('kudos-kudos-text').value.trim();

  if(!selectedRecipient){ showError(errorEl, 'Select who you\'re giving kudos to.'); return; }
  if(!text){ showError(errorEl, 'Write a quick note before submitting.'); return; }

  const { error } = await membersSupabase.from('kudos').insert({
    from_player_id: window.faCurrentUser.id,
    to_character_id: selectedRecipient.type === 'character' ? selectedRecipient.id : null,
    to_player_id: selectedRecipient.type === 'player' ? selectedRecipient.id : null,
    message: text
  });
  if(error){ showError(errorEl, error.message); return; }

  selectedRecipient = null;
  document.getElementById('kudos-recipient-select').value = '';
  document.getElementById('kudos-kudos-text').value = '';
  await loadSubmitted();
}

function showError(el, msg){
  el.textContent = msg;
  el.style.display = 'block';
}

async function loadSubmitted(){
  const list = document.getElementById('kudos-submitted-list');
  const { data: rows } = await membersSupabase
    .from('kudos')
    .select('id, to_character_id, to_player_id, message, status, created_at')
    .eq('from_player_id', window.faCurrentUser.id)
    .order('created_at', { ascending: false });

  if(!rows || rows.length === 0){ list.innerHTML = ''; return; }

  const charIds = [...new Set(rows.map(r => r.to_character_id).filter(Boolean))];
  const { data: chars } = await membersSupabase.rpc('character_names').select('id, name, player_id').in('id', charIds);
  const charById = {};
  (chars || []).forEach(c => { charById[c.id] = c; });

  const castPlayerIds = [...new Set(rows.map(r => r.to_player_id).filter(Boolean))];
  const playerIds = [...new Set([...(chars || []).map(c => c.player_id), ...castPlayerIds])];
  const { data: profiles } = await membersSupabase.from('profiles').select('id, display_name').in('id', playerIds);
  const nameByPlayer = {};
  (profiles || []).forEach(p => { nameByPlayer[p.id] = p.display_name; });

  list.innerHTML = `<h3>Kudos You've Given</h3>` + rows.map(r => {
    let who;
    if(r.to_player_id){
      who = `${nameByPlayer[r.to_player_id] || 'Unknown player'} (Cast)`;
    } else {
      const c = charById[r.to_character_id];
      who = c ? `${c.name} [${nameByPlayer[c.player_id] || 'Unknown player'}]` : 'Unknown character';
    }
    const statusClass = r.status === 'approved' ? 'approved' : r.status === 'denied' ? 'denied' : 'pending';
    const statusLabel = r.status === 'approved' ? 'Approved' : r.status === 'denied' ? 'Denied' : 'Pending review';
    return `<div class="submitted-item"><div class="who">${escapeHtml(who)} <span class="status-pill ${statusClass}" style="float:right;">${statusLabel}</span></div>${escapeHtml(r.message)}</div>`;
  }).join('');
}

async function loadReceived(){
  const list = document.getElementById('kudos-received-list');
  const me = window.faCurrentUser.id;

  const { data: myChars } = await membersSupabase.from('characters').select('id').eq('player_id', me);
  const myCharIds = (myChars || []).map(c => c.id);

  const orParts = [`to_player_id.eq.${me}`];
  if(myCharIds.length) orParts.push(`to_character_id.in.(${myCharIds.join(',')})`);

  const { data: rows } = await membersSupabase
    .from('kudos')
    .select('id, from_player_id, to_character_id, message, status, created_at')
    .or(orParts.join(','))
    .order('created_at', { ascending: false });

  if(!rows || rows.length === 0){ list.innerHTML = ''; return; }

  const fromPlayerIds = [...new Set(rows.map(r => r.from_player_id).filter(Boolean))];
  const { data: profiles } = await membersSupabase.from('profiles').select('id, display_name').in('id', fromPlayerIds);
  const nameByPlayer = {};
  (profiles || []).forEach(p => { nameByPlayer[p.id] = p.display_name; });

  const charIds = [...new Set(rows.map(r => r.to_character_id).filter(Boolean))];
  const { data: chars } = await membersSupabase.rpc('character_names').select('id, name').in('id', charIds);
  const charById = {};
  (chars || []).forEach(c => { charById[c.id] = c; });

  list.innerHTML = `<h3>Kudos You've Received</h3>` + rows.map(r => {
    const from = nameByPlayer[r.from_player_id] || 'Unknown player';
    const to = r.to_character_id ? charById[r.to_character_id] : null;
    const statusClass = r.status === 'approved' ? 'approved' : r.status === 'denied' ? 'denied' : 'pending';
    const statusLabel = r.status === 'approved' ? 'Approved' : r.status === 'denied' ? 'Denied' : 'Pending review';
    return `<div class="submitted-item"><div class="who">${escapeHtml(from)}${to ? ` &rarr; ${escapeHtml(to.name)}` : ''} <span class="status-pill ${statusClass}" style="float:right;">${statusLabel}</span></div>${escapeHtml(r.message)}</div>`;
  }).join('');
}

async function init(){
  await loadAllCandidates();
  await loadReceived();
  await loadSubmitted();
}

window.kudos_pickFromSelect = kudos_pickFromSelect;
window.kudos_submitKudos = kudos_submitKudos;
document.addEventListener('fa-members-ready', init);
})();
</script>

</body>
</html>
