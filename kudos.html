<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kudos - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Kudos - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/kudos.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kudos - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Kudos</h1>
<p class="page-subhead">Give a quick pat on the back to a player. Search for anyone in the player base to give them kudos.</p>

<div class="bank-recipient-picker" data-picker="kudos">
<label class="field-label" for="kudos-search-input">Give kudos to</label>
<input type="text" id="kudos-search-input" placeholder="Search player or character name..." autocomplete="off"
  oninput="kudos_search(this.value)">
<div class="bank-recipient-results" id="kudos-search-results"></div>
<p class="bank-selected-recipient" id="kudos-selected" style="display:none;"></p>
</div>

<div class="section-block">
<label class="field-label" for="kudos-kudos-text">Your feedback</label>
<textarea id="kudos-kudos-text" placeholder="Say what they did well..."></textarea>
</div>

<button class="btn-gold" onclick="kudos_submitKudos()">Submit Kudos</button>
<p class="reg-error-note" id="kudos-error" style="display:none;"></p>

<div class="submitted-list" id="kudos-submitted-list"></div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
(function(){
let selectedRecipient = null;

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function kudos_search(query){
  const q = query.trim();
  const resultsEl = document.getElementById('kudos-search-results');
  if(!q){ resultsEl.innerHTML = ''; return; }

  const myUserId = window.faCurrentUser ? window.faCurrentUser.id : null;

  const [{ data: charMatches }, { data: profileMatches }] = await Promise.all([
    membersSupabase.from('character_names').select('id, name, player_id').ilike('name', `%${q}%`).limit(8),
    membersSupabase.from('profiles').select('id, display_name').ilike('display_name', `%${q}%`).limit(8)
  ]);

  const charById = {};
  (charMatches || []).forEach(c => { charById[c.id] = c; });

  const matchedPlayerIds = [...new Set((profileMatches || []).map(p => p.id))];
  if(matchedPlayerIds.length){
    const { data: theirChars } = await membersSupabase.from('character_names').select('id, name, player_id').in('player_id', matchedPlayerIds);
    (theirChars || []).forEach(c => { charById[c.id] = c; });
  }

  const candidates = Object.values(charById).filter(c => c.player_id !== myUserId).slice(0, 8);
  if(candidates.length === 0){
    resultsEl.innerHTML = '<div class="bank-recipient-empty">No matching characters.</div>';
    return;
  }

  const playerIds = [...new Set(candidates.map(c => c.player_id))];
  const { data: profiles } = await membersSupabase.from('profiles').select('id, display_name').in('id', playerIds);
  const nameByPlayer = {};
  (profiles || []).forEach(p => { nameByPlayer[p.id] = p.display_name; });

  resultsEl.innerHTML = candidates.map(c => {
    const label = `${c.name} [${nameByPlayer[c.player_id] || 'Unknown player'}]`;
    return `<button class="bank-recipient-result" onclick="kudos_pickPerson('${c.id}', '${label.replace(/'/g, "\\'")}')">${escapeHtml(label)}</button>`;
  }).join('');
}

function kudos_pickPerson(charId, label){
  selectedRecipient = { id: charId, label };
  document.getElementById('kudos-search-input').value = '';
  document.getElementById('kudos-search-results').innerHTML = '';
  const selectedEl = document.getElementById('kudos-selected');
  selectedEl.style.display = 'block';
  selectedEl.textContent = `Selected: ${label}`;
}

async function kudos_submitKudos(){
  const errorEl = document.getElementById('kudos-error');
  errorEl.style.display = 'none';
  const text = document.getElementById('kudos-kudos-text').value.trim();

  if(!selectedRecipient){ showError(errorEl, 'Search for and select who you\'re giving kudos to.'); return; }
  if(!text){ showError(errorEl, 'Write a quick note before submitting.'); return; }

  const { error } = await membersSupabase.from('kudos').insert({
    from_player_id: window.faCurrentUser.id,
    to_character_id: selectedRecipient.id,
    message: text
  });
  if(error){ showError(errorEl, error.message); return; }

  selectedRecipient = null;
  document.getElementById('kudos-selected').style.display = 'none';
  document.getElementById('kudos-kudos-text').value = '';
  await loadSubmitted();
}

function showError(el, msg){
  el.textContent = msg;
  el.style.display = 'block';
}

async function loadSubmitted(){
  const list = document.getElementById('kudos-submitted-list');
  const { data: rows } = await membersSupabase
    .from('kudos')
    .select('id, to_character_id, message, created_at')
    .order('created_at', { ascending: false });

  if(!rows || rows.length === 0){ list.innerHTML = ''; return; }

  const charIds = [...new Set(rows.map(r => r.to_character_id))];
  const { data: chars } = await membersSupabase.from('character_names').select('id, name, player_id').in('id', charIds);
  const charById = {};
  (chars || []).forEach(c => { charById[c.id] = c; });

  const playerIds = [...new Set((chars || []).map(c => c.player_id))];
  const { data: profiles } = await membersSupabase.from('profiles').select('id, display_name').in('id', playerIds);
  const nameByPlayer = {};
  (profiles || []).forEach(p => { nameByPlayer[p.id] = p.display_name; });

  list.innerHTML = `<h3>Kudos You've Given</h3>` + rows.map(r => {
    const c = charById[r.to_character_id];
    const who = c ? `${c.name} [${nameByPlayer[c.player_id] || 'Unknown player'}]` : 'Unknown character';
    return `<div class="submitted-item"><div class="who">${escapeHtml(who)}</div>${escapeHtml(r.message)}</div>`;
  }).join('');
}

window.kudos_search = kudos_search;
window.kudos_pickPerson = kudos_pickPerson;
window.kudos_submitKudos = kudos_submitKudos;
document.addEventListener('fa-members-ready', loadSubmitted);
})();
</script>

</body>
</html>
