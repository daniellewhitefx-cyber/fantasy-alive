<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register for an Event - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Register for an Event - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/register.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Register for an Event - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<h1 class="page-title">Register for an Event</h1>

<div class="reg-section" id="reg-date-section">
<div class="reg-section-label">Event Date</div>
<select class="reg-date-select" id="reg-date-select" onchange="reg_selectEvent(this.value)"></select>
<p class="page-subhead" id="reg-registered-count" style="margin-top:0.6rem;"></p>
</div>

<div class="reg-section" id="reg-who-section">
<div class="reg-section-label">Who's this registration for?</div>
<div class="reg-pass-grid" id="reg-who-grid"></div>
<p class="reg-who-hint" id="reg-who-hint" style="display:none;"></p>
</div>

<div id="reg-rest-of-form" style="display:none;">

<p class="reg-empty-note" id="reg-checking-note" style="display:none;">Checking your registration status&hellip;</p>
<div class="reg-already-registered" id="reg-already-registered" style="display:none;"></div>

<div class="reg-section" id="reg-flex-banner-wrap"></div>

<div class="reg-section">
<div class="reg-section-label">Event Pass</div>
<div class="reg-pass-grid" id="reg-pass-grid"></div>
</div>

<div class="reg-section" id="reg-combat-section">
<div class="reg-section-label">Combat or Non-Combat</div>
<div class="reg-pass-grid" id="reg-combat-grid"></div>
</div>

<div class="reg-section">
<div class="reg-section-label">Days Attending</div>
<div class="reg-days-row" id="reg-days-row"></div>
</div>

<div class="reg-section" id="reg-meal-section">
<div class="reg-section-label">Meal Plan</div>
<div id="reg-meal-content"></div>
</div>

<div class="reg-section" id="reg-payment-section">
<div class="reg-section-label">Payment Method</div>
<div class="reg-pass-grid" id="reg-payment-grid"></div>
</div>

<div class="reg-summary" id="reg-summary-wrap">
<div class="reg-summary-row"><span id="reg-summary-pass-name">No pass selected</span><span id="reg-summary-pass-price">N/A</span></div>
<div class="reg-summary-row" id="reg-summary-meal-row" style="display:none;"><span id="reg-summary-meal-name"></span><span id="reg-summary-meal-price"></span></div>
<div class="reg-summary-row total"><span>Total</span><span id="reg-summary-total">$0</span></div>
<button class="reg-pay-btn" id="reg-pay-btn" disabled onclick="reg_submit()">Select a pass to continue</button>
<p class="reg-error-note" id="reg-error-note" style="display:none;"></p>
</div>

<div class="reg-success" id="reg-success" style="display:none;"></div>

</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/members-auth.js"></script>
<script src="js/registration-status.js"></script>
<script>
(function(){
const REGISTRATION_ENDPOINT = window.FA_REGISTRATION_ENDPOINT;

const ACCOUNT = {
  firstTime: true,
  flexEventCredits: 0
};

let CHARACTERS = [];

const EVENTS = window.FA_EVENTS;

const PASSES = [
  { id:'regular', name:'Regular Weekend', price:97, grants:'45 XP', modes:['character'], show: s => !s.firstTime },
  { id:'bonusitem', name:'Bonus Item Event', price:111, grants:'45 XP + 3 item-tag draws at check-in', modes:['character'], show: s => !s.firstTime },
  { id:'bonusxp', name:'Bonus XP Event', price:142, grants:'50 XP', modes:['character'], show: s => !s.firstTime },
  { id:'supporter', name:'FA Supporter Event', price:226, grants:'45 XP + 50 XP + 50 OC + 3 item-tag draws', modes:['character'], show: s => !s.firstTime },
  { id:'townsfolk', name:'Townsfolk Weekend Entry', price:25, grants:'RP only, no character or log', modes:['character','townsperson'], show: s => true },
  { id:'first-free', name:'First-Time FREE Weekend', price:0, grants:'45 XP', modes:['character'], show: s => s.firstTime, badge:'First-Time' },
  { id:'first-wellfed', name:'First-Time Well-Fed Weekend', price:60, grants:'45 XP + Full Meal Plan (included)', modes:['character'], show: s => s.firstTime, badge:'First-Time', bundlesMeal:true },
  { id:'first-vip', name:'First-Time VIP Weekend', price:80, grants:'45 XP + 50 XP + Full Meal Plan (included)', modes:['character'], show: s => s.firstTime, badge:'First-Time', bundlesMeal:true },
  { id:'cast', name:'Casting Weekend Event', price:0, grants:'Free entry, plus an OC bonus awarded after the event', modes:['cast'], show: s => true, badge:'Cast', marksCast:true }
];

const COMBAT_OPTIONS = [
  { id:'combat', name:'Combat', grants:'You can be called into physical (boffer) combat encounters.' },
  { id:'noncombat', name:'Non-Combat', grants:'You will not be placed into physical combat encounters.' }
];

const SINGLE_MEAL_OPTIONS = ['Saturday Breakfast', 'Saturday Lunch', 'Saturday Dinner', 'Sunday Breakfast'];

const MEALS = [
  { id:'full', name:'Full Meal Plan', price:73, flavor:'Saturday Breakfast, Lunch, Dinner (including dessert!), and Breakfast Sunday.', slots:['Saturday Breakfast','Saturday Lunch','Saturday Dinner','Sunday Breakfast'], show: s => s.who === 'character' || s.who === 'townsperson' },
  { id:'half', name:'Half Meal Plan', price:48, flavor:'Saturday Lunch, and Dinner (including dessert!).', slots:['Saturday Lunch','Saturday Dinner'], show: s => s.who === 'character' || s.who === 'townsperson' },
  { id:'single', name:'Single Meal', price:24, flavor:'One of the meals listed in Full Meal Plan. Please specify which meal.', slots:[], show: s => s.who === 'character' || s.who === 'townsperson' },
  { id:'castmeal', name:'Cast Meal Plan', price:40, flavor:'Saturday Breakfast, Lunch, Dinner (including dessert!), and Breakfast Sunday.', slots:['Saturday Breakfast','Saturday Lunch','Saturday Dinner','Sunday Breakfast'], show: s => s.who === 'cast' }
];

const requestedEventValue = new URLSearchParams(location.search).get('event');
const requestedEvent = requestedEventValue ? EVENTS.find(e => e.value === requestedEventValue) : null;

const state = {
  firstTime: ACCOUNT.firstTime,
  isCast: false,
  flexEvent: ACCOUNT.flexEventCredits,
  who: null,
  character: null,
  event: requestedEvent || EVENTS[0] || null
};

const PAYMENT_METHODS = [
  { id:'online', name:'Pay Online', flavor:'Pay now with a card. You\'ll get a payment link before the event.' },
  { id:'event', name:'Pay at Event', flavor:'Settle up in person when you arrive.' }
];

let selectedPass = null;
let selectedCombat = null;
let selectedPayment = null;
let selectedMeal = null;
let singleMealChoice = null;
let selectedDays = new Set();
let submitting = false;
let submitted = false;
let currentUser = null;
let existingRegistration = null;
let checkingRegistration = false;

function reg_selectEvent(value){
  state.event = EVENTS.find(e => e.value === value) || EVENTS[0] || null;
  selectedDays = state.event ? new Set(state.event.days.map(d => d.id)) : new Set();
  existingRegistration = null;
  render();
  refreshRegisteredCount();
  if(state.who) checkExistingRegistration();
}

async function refreshRegisteredCount(){
  const el = document.getElementById('reg-registered-count');
  if(!REGISTRATION_ENDPOINT || !el || !state.event) return;
  try{
    const res = await fetch(REGISTRATION_ENDPOINT + '?action=count&event=' + encodeURIComponent(state.event.label), { cache: 'no-store' });
    if(!res.ok) throw new Error('count failed');
    const data = await res.json();
    if(typeof data.count !== 'number') throw new Error('count not available yet');
    el.textContent = `${data.count} player${data.count === 1 ? '' : 's'} registered so far.`;
  } catch(err){
    el.textContent = '';
  }
}

function reg_selectWho(mode, characterId){
  state.who = mode;
  state.character = mode === 'character' ? characterId : null;
  state.isCast = (mode === 'cast');
  selectedPass = null;
  selectedMeal = null;
  selectedCombat = null;
  selectedPayment = null;
  existingRegistration = null;
  render();
  checkExistingRegistration();
}

async function checkExistingRegistration(){
  const character = CHARACTERS.find(c => c.id === state.character);
  const characterName = state.who === 'cast' ? 'Cast' : (state.who === 'townsperson' ? 'Townsperson' : (character ? character.name : ''));
  if(!characterName) return;

  checkingRegistration = true;
  render();

  try{
    const user = await faGetCurrentUser();
    if(!user) return;
    const result = await faCheckRegistration(state.event.label, state.who, characterName, user.email);
    existingRegistration = result.registered ? (result.registration || {}) : null;
  } catch(err){
    existingRegistration = null;
  } finally {
    checkingRegistration = false;
    render();
  }
}

function reg_selectPass(id){
  selectedPass = id;
  selectedMeal = null;
  render();
}

function reg_selectCombat(id){
  selectedCombat = id;
  render();
}

function reg_selectPayment(id){
  selectedPayment = id;
  render();
}

function reg_toggleDay(id){
  if(selectedDays.has(id)) selectedDays.delete(id);
  else selectedDays.add(id);
  render();
}

function reg_selectMeal(id){
  selectedMeal = id;
  singleMealChoice = null;
  render();
}

function reg_setSingleMealChoice(val){
  singleMealChoice = val;
  render();
}

function reg_useFlex(){
  selectedPass = 'flex-used';
  selectedMeal = null;
  singleMealChoice = null;
  render();
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function render(){
  const dateSelect = document.getElementById('reg-date-select');

  if(!EVENTS.length){
    dateSelect.style.display = 'none';
    document.getElementById('reg-who-section').style.display = 'none';
    document.getElementById('reg-rest-of-form').style.display = 'none';
    document.getElementById('reg-registered-count').textContent = 'No upcoming events are scheduled right now. Check back soon.';
    return;
  }

  if(!dateSelect.options.length){
    dateSelect.innerHTML = EVENTS.map(e => `<option value="${e.value}">${escapeHtml(e.label)}</option>`).join('');
    dateSelect.value = state.event.value;
  }

  const whoGrid = document.getElementById('reg-who-grid');
  const whoHint = document.getElementById('reg-who-hint');
  const restOfForm = document.getElementById('reg-rest-of-form');

  const whoCards = [
    ...CHARACTERS.map(c => `
      <div class="reg-pass-card ${state.who==='character' && state.character===c.id ? 'selected':''}" onclick="reg_selectWho('character','${c.id}')">
        <div class="pname">${escapeHtml(c.name)}</div>
        <p class="pgrants">Play as this character. XP and log actions apply to them</p>
      </div>`),
    `<div class="reg-pass-card ${state.who==='cast' ? 'selected':''}" onclick="reg_selectWho('cast', null)">
       <div class="badge cast">Cast</div>
       <div class="pname">Cast / NPC this weekend</div>
       <p class="pgrants">Not tied to a character. You'll play monsters and NPCs and earn OC instead of XP</p>
     </div>`,
    `<div class="reg-pass-card ${state.who==='townsperson' ? 'selected':''}" onclick="reg_selectWho('townsperson', null)">
       <div class="badge townsperson">Townsperson</div>
       <div class="pname">Townsperson (RP only)</div>
       <p class="pgrants">No character needed. Pure roleplay, no combat, no downtime log. You can create a character later if you want one</p>
     </div>`
  ];
  whoGrid.innerHTML = whoCards.join('');

  if(state.who === 'character'){
    const c = CHARACTERS.find(ch => ch.id === state.character);
    whoHint.style.display = 'block';
    whoHint.textContent = `Registering as ${c ? c.name : 'a new character'}. Any XP granted below will apply to this character.`;
    restOfForm.style.display = 'block';
  } else if(state.who === 'cast'){
    whoHint.style.display = 'block';
    whoHint.textContent = `Registering to Cast this event. This isn't tied to a character. You'll be marked Cast for this date and see Cast-only options below.`;
    restOfForm.style.display = 'block';
  } else if(state.who === 'townsperson'){
    whoHint.style.display = 'block';
    whoHint.textContent = `Registering as a Townsperson for this event. No character needed - this is pure roleplay, no combat, no downtime log.`;
    restOfForm.style.display = 'block';
  } else {
    whoHint.style.display = 'none';
    restOfForm.style.display = 'none';
    return;
  }

  const checkingNote = document.getElementById('reg-checking-note');
  const alreadyRegisteredWrap = document.getElementById('reg-already-registered');
  const formSections = [
    ...document.querySelectorAll('#reg-rest-of-form > .reg-section'),
    document.getElementById('reg-summary-wrap')
  ];

  checkingNote.style.display = checkingRegistration ? 'block' : 'none';

  if(existingRegistration){
    const r = existingRegistration;
    alreadyRegisteredWrap.style.display = 'block';
    alreadyRegisteredWrap.innerHTML = `
      <h3>&#10003; You're Registered!</h3>
      <p>${escapeHtml(state.who === 'cast' || state.who === 'townsperson' ? 'You' : (CHARACTERS.find(c=>c.id===state.character)||{}).name || 'This character')}
      ${state.who === 'cast' || state.who === 'townsperson' ? "are" : "is"} already signed up for <strong>${escapeHtml(state.event.label)}</strong>
      ${r.passName ? ` with the <strong>${escapeHtml(r.passName)}</strong> pass` : ''}.</p>
      ${r.mealName && r.mealName !== 'None' ? `<p>Meal plan: ${escapeHtml(r.mealName)}</p>` : ''}
      ${r.daysAttending ? `<p>Days attending: ${escapeHtml(r.daysAttending)}</p>` : ''}
      <p class="reg-empty-note">Need to change something? Contact us directly - there's no self-serve edit yet.</p>
    `;
    formSections.forEach(el => { if(el) el.style.display = 'none'; });
    document.getElementById('reg-pay-btn').disabled = true;
    return;
  } else {
    alreadyRegisteredWrap.style.display = 'none';
    alreadyRegisteredWrap.innerHTML = '';
  }

  if(checkingRegistration){
    formSections.forEach(el => { if(el) el.style.display = 'none'; });
    return;
  }
  formSections.forEach(el => { if(el) el.style.display = ''; });

  const flexWrap = document.getElementById('reg-flex-banner-wrap');
  if(state.who === 'character' && state.flexEvent > 0){
    flexWrap.innerHTML = `
      <div class="reg-flex-banner">
        <div class="ftext">You have <strong>${state.flexEvent}</strong> Flex event credit${state.flexEvent===1?'':'s'} available.</div>
        <button onclick="reg_useFlex()">Use Flex Pass</button>
      </div>`;
  } else {
    flexWrap.innerHTML = '';
  }

  const grid = document.getElementById('reg-pass-grid');
  const visible = PASSES.filter(p => p.modes.includes(state.who) && p.show(state));
  grid.innerHTML = visible.map(p => `
    <div class="reg-pass-card ${selectedPass===p.id?'selected':''}" onclick="reg_selectPass('${p.id}')">
      ${p.badge ? `<div class="badge ${p.badge==='Cast'?'cast':'first'}">${p.badge}</div>` : ''}
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pprice">${p.price===0?'Free':'$'+p.price}</div>
      <p class="pgrants">${escapeHtml(p.grants)}</p>
    </div>
  `).join('');

  const combatSection = document.getElementById('reg-combat-section');
  if(state.who === 'character'){
    combatSection.style.display = 'block';
    document.getElementById('reg-combat-grid').innerHTML = COMBAT_OPTIONS.map(c => `
      <div class="reg-pass-card ${selectedCombat===c.id?'selected':''}" onclick="reg_selectCombat('${c.id}')">
        <div class="pname">${escapeHtml(c.name)}</div>
        <p class="pgrants">${escapeHtml(c.grants)}</p>
      </div>
    `).join('');
  } else {
    combatSection.style.display = 'none';
    selectedCombat = null;
  }

  document.getElementById('reg-days-row').innerHTML = state.event.days.map(d => `
    <label class="reg-day-check">
      <input type="checkbox" ${selectedDays.has(d.id)?'checked':''} onchange="reg_toggleDay('${d.id}')">
      ${escapeHtml(d.label)}
    </label>
  `).join('');

  const passObj = PASSES.find(p => p.id === selectedPass);
  const mealContent = document.getElementById('reg-meal-content');
  if(passObj && passObj.bundlesMeal){
    mealContent.innerHTML = `<p class="reg-meal-note">A Full Meal Plan is already included with this pass. No need to add one separately.</p>`;
  } else {
    const visibleMeals = MEALS.filter(m => m.show(state));
    let mealHtml = `<div class="reg-pass-grid">` + visibleMeals.map(m => `
      <div class="reg-pass-card ${selectedMeal===m.id?'selected':''}" onclick="reg_selectMeal('${m.id}')">
        <div class="pname">${escapeHtml(m.name)}</div>
        <div class="pprice">$${m.price}</div>
        <p class="pgrants">${escapeHtml(m.flavor)}</p>
      </div>
    `).join('') + `</div>`;

    if(selectedMeal === 'single'){
      mealHtml += `
        <div class="reg-single-meal-picker">
          <label for="reg-single-meal-select">Which meal?</label>
          <select id="reg-single-meal-select" onchange="reg_setSingleMealChoice(this.value)">
            <option value="" ${!singleMealChoice ? 'selected' : ''} disabled>Choose one</option>
            ${SINGLE_MEAL_OPTIONS.map(opt => `<option value="${opt}" ${singleMealChoice===opt?'selected':''}>${opt}</option>`).join('')}
          </select>
        </div>`;
    }
    mealContent.innerHTML = mealHtml;
  }

  const passName = document.getElementById('reg-summary-pass-name');
  const passPrice = document.getElementById('reg-summary-pass-price');
  const mealRow = document.getElementById('reg-summary-meal-row');
  const mealName = document.getElementById('reg-summary-meal-name');
  const mealPrice = document.getElementById('reg-summary-meal-price');
  const total = document.getElementById('reg-summary-total');
  const payBtn = document.getElementById('reg-pay-btn');

  let sum = 0;
  if(selectedPass === 'flex-used'){
    passName.textContent = 'Flex Pass redeemed (1 credit used)';
    passPrice.textContent = 'Free';
  } else if(passObj){
    passName.textContent = passObj.name + (passObj.marksCast ? ' (marks you Cast for this date)' : '');
    passPrice.textContent = passObj.price===0 ? 'Free' : '$'+passObj.price;
    sum += passObj.price;
  } else {
    passName.textContent = 'No pass selected';
    passPrice.textContent = 'N/A';
  }

  const mealObj = MEALS.find(m => m.id === selectedMeal);
  const bundled = passObj && passObj.bundlesMeal;
  if(mealObj && selectedPass !== 'flex-used' && !bundled){
    mealRow.style.display = 'flex';
    mealName.textContent = mealObj.id === 'single' && singleMealChoice
      ? `${mealObj.name} (${singleMealChoice})`
      : mealObj.name;
    mealPrice.textContent = '$'+mealObj.price;
    sum += mealObj.price;
  } else {
    mealRow.style.display = 'none';
  }

  const singleMealIncomplete = selectedMeal === 'single' && !singleMealChoice && selectedPass !== 'flex-used';
  const combatIncomplete = state.who === 'character' && !selectedCombat;
  const daysIncomplete = selectedDays.size === 0;
  const havePass = !!selectedPass;

  total.textContent = '$'+sum;

  const paymentSection = document.getElementById('reg-payment-section');
  const paymentNeeded = sum > 0;
  if(paymentNeeded){
    paymentSection.style.display = 'block';
    document.getElementById('reg-payment-grid').innerHTML = PAYMENT_METHODS.map(pm => `
      <div class="reg-pass-card ${selectedPayment===pm.id?'selected':''}" onclick="reg_selectPayment('${pm.id}')">
        <div class="pname">${escapeHtml(pm.name)}</div>
        <p class="pgrants">${escapeHtml(pm.flavor)}</p>
      </div>
    `).join('');
  } else {
    paymentSection.style.display = 'none';
    selectedPayment = null;
  }

  const paymentIncomplete = paymentNeeded && !selectedPayment;

  payBtn.disabled = !havePass || singleMealIncomplete || combatIncomplete || daysIncomplete || paymentIncomplete || submitting;

  if(!havePass){
    payBtn.textContent = 'Select a pass to continue';
  } else if(combatIncomplete){
    payBtn.textContent = 'Choose Combat or Non-Combat to continue';
  } else if(daysIncomplete){
    payBtn.textContent = 'Choose at least one day to continue';
  } else if(singleMealIncomplete){
    payBtn.textContent = 'Choose a meal to continue';
  } else if(paymentIncomplete){
    payBtn.textContent = 'Choose a payment method to continue';
  } else if(submitting){
    payBtn.textContent = 'Submitting...';
  } else if(sum === 0){
    payBtn.textContent = 'Confirm Free Registration';
  } else if(selectedPayment === 'online'){
    payBtn.textContent = `Complete Registration - Pay Online ($${sum})`;
  } else {
    payBtn.textContent = `Complete Registration ($${sum} due at event)`;
  }
}

function mealSlotsFor(passObj, mealObj){
  const slots = {};
  SINGLE_MEAL_OPTIONS.forEach(s => slots[s] = false);
  if(passObj && passObj.bundlesMeal){
    SINGLE_MEAL_OPTIONS.forEach(s => slots[s] = true);
    return slots;
  }
  if(!mealObj) return slots;
  if(mealObj.id === 'single'){
    if(singleMealChoice) slots[singleMealChoice] = true;
  } else {
    mealObj.slots.forEach(s => slots[s] = true);
  }
  return slots;
}

const PENDING_REGISTRATION_KEY = 'fa_pending_registration';

async function buildRegistrationPayload(){
  const passObj = PASSES.find(p => p.id === selectedPass);
  const mealObj = MEALS.find(m => m.id === selectedMeal);
  const bundled = passObj && passObj.bundlesMeal;
  const character = CHARACTERS.find(c => c.id === state.character);
  const sumEl = document.getElementById('reg-summary-total');

  currentUser = await faGetCurrentUser();

  let allergyNotes = '', disabilityNotes = '';
  if(currentUser){
    const { data: notes } = await membersSupabase
      .from('member_private_notes')
      .select('allergy_notes, disability_notes')
      .eq('id', currentUser.id)
      .maybeSingle();
    allergyNotes = (notes && notes.allergy_notes) || '';
    disabilityNotes = (notes && notes.disability_notes) || '';
  }

  return {
    eventValue: state.event.value,
    eventLabel: state.event.label,
    playerEmail: currentUser ? currentUser.email : '',
    playerName: currentUser && currentUser.user_metadata && currentUser.user_metadata.display_name
      ? currentUser.user_metadata.display_name
      : (currentUser ? currentUser.email : ''),
    who: state.who,
    characterName: state.who === 'character' ? (character ? character.name : '') : (state.who === 'cast' ? 'Cast' : 'Townsperson'),
    passId: selectedPass,
    passName: selectedPass === 'flex-used' ? 'Flex Pass' : (passObj ? passObj.name : ''),
    passPrice: selectedPass === 'flex-used' ? 0 : (passObj ? passObj.price : 0),
    combatStatus: selectedCombat === 'combat' ? 'Combat' : (selectedCombat === 'noncombat' ? 'Non-Combat' : ''),
    daysAttending: state.event.days.filter(d => selectedDays.has(d.id)).map(d => d.label),
    mealName: bundled ? (passObj.name + ' (included)') : (mealObj ? mealObj.name : ''),
    mealPrice: bundled ? 0 : (mealObj ? mealObj.price : 0),
    singleMealChoice: (mealObj && mealObj.id === 'single') ? (singleMealChoice || '') : '',
    mealSlots: mealSlotsFor(passObj, mealObj),
    total: parseInt(sumEl.textContent.replace('$',''), 10) || 0,
    paymentMethod: selectedPayment === 'online' ? 'Online (paid)' : (selectedPayment === 'event' ? 'At Event' : ''),
    allergyNotes: allergyNotes,
    disabilityNotes: disabilityNotes
  };
}

function showRegistrationSuccess(payload){
  submitted = true;
  const dateSection = document.getElementById('reg-date-section');
  const whoSection = document.getElementById('reg-who-section');
  if(dateSection) dateSection.style.display = 'none';
  if(whoSection) whoSection.style.display = 'none';

  const restForm = document.getElementById('reg-rest-of-form');
  if(restForm){
    restForm.style.display = 'block';
    restForm.querySelectorAll('.reg-section, #reg-summary-wrap, #reg-already-registered, #reg-checking-note').forEach(el => el.style.display = 'none');
  }
  const success = document.getElementById('reg-success');
  success.style.display = 'block';

  let paymentLine = 'This is a free entry - see you there!';
  if(payload.total > 0){
    paymentLine = payload.paymentMethod === 'Online (paid)'
      ? `Your payment of $${payload.total} went through - you're all set.`
      : `$${payload.total} will be due at the event.`;
  }
  success.innerHTML = `
    <h3>You're registered!</h3>
    <p>${escapeHtml(payload.characterName)} is signed up for <strong>${escapeHtml(payload.eventLabel)}</strong>.
    ${paymentLine}</p>
  `;
}

async function submitRegistrationToSheet(payload){
  const errorNote = document.getElementById('reg-error-note');

  if(!REGISTRATION_ENDPOINT){
    errorNote.textContent = "Registration isn't connected to the spreadsheet yet - this part still needs a one-time setup step.";
    errorNote.style.display = 'block';
    return false;
  }

  const res = await fetch(REGISTRATION_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('Request failed (' + res.status + ')');
  return true;
}

async function reg_submit(){
  const errorNote = document.getElementById('reg-error-note');
  errorNote.style.display = 'none';

  if(!REGISTRATION_ENDPOINT){
    errorNote.textContent = "Registration isn't connected to the spreadsheet yet - this part still needs a one-time setup step.";
    errorNote.style.display = 'block';
    return;
  }

  const payload = await buildRegistrationPayload();

  submitting = true;
  render();

  try{
    if(selectedPayment === 'online' && payload.total > 0){
      localStorage.setItem(PENDING_REGISTRATION_KEY, JSON.stringify(payload));
      const base = location.origin + location.pathname;
      const { data, error } = await membersSupabase.functions.invoke('create-checkout-session', {
        body: {
          amount: payload.total,
          description: `${payload.eventLabel} - ${payload.passName}`,
          successUrl: base + '?paid=1&session_id={CHECKOUT_SESSION_ID}',
          cancelUrl: base + '?cancelled=1'
        }
      });
      if(error || !data || !data.url){
        throw new Error((data && data.error) || 'Could not start checkout');
      }
      window.location.href = data.url;
      return;
    }

    await submitRegistrationToSheet(payload);
    showRegistrationSuccess(payload);
  } catch(err){
    localStorage.removeItem(PENDING_REGISTRATION_KEY);
    errorNote.textContent = "Something went wrong submitting your registration. Please try again.";
    errorNote.style.display = 'block';
  } finally {
    submitting = false;
    render();
  }
}

async function handlePaymentReturn(){
  const params = new URLSearchParams(location.search);

  if(params.get('cancelled') === '1'){
    localStorage.removeItem(PENDING_REGISTRATION_KEY);
    history.replaceState({}, '', location.pathname);
    alert('Payment was cancelled. You can try again or choose Pay at Event.');
    return;
  }

  const sessionId = params.get('session_id');
  if(params.get('paid') !== '1' || !sessionId) return;

  history.replaceState({}, '', location.pathname);
  const pendingRaw = localStorage.getItem(PENDING_REGISTRATION_KEY);
  if(!pendingRaw) return;
  const payload = JSON.parse(pendingRaw);

  try{
    const { data, error } = await membersSupabase.functions.invoke('verify-checkout-session', { body: { sessionId } });
    if(error || !data || !data.paid){
      throw new Error('Payment could not be confirmed');
    }
    localStorage.removeItem(PENDING_REGISTRATION_KEY);
    await submitRegistrationToSheet(payload);
    showRegistrationSuccess(payload);
  } catch(err){
    localStorage.removeItem(PENDING_REGISTRATION_KEY);
    alert("We couldn't confirm your payment went through. Please contact us before trying to register again.");
  }
}

window.reg_selectEvent = reg_selectEvent;
window.reg_selectWho = reg_selectWho;
window.reg_selectPass = reg_selectPass;
window.reg_selectCombat = reg_selectCombat;
window.reg_selectPayment = reg_selectPayment;
window.reg_toggleDay = reg_toggleDay;
window.reg_selectMeal = reg_selectMeal;
window.reg_setSingleMealChoice = reg_setSingleMealChoice;
window.reg_useFlex = reg_useFlex;
window.reg_submit = reg_submit;

selectedDays = state.event ? new Set(state.event.days.map(d => d.id)) : new Set();

async function loadCharacters(){
  const { data } = await membersSupabase
    .from('characters')
    .select('id, name')
    .eq('player_id', window.faCurrentUser.id)
    .order('created_at', { ascending: true });
  CHARACTERS = data || [];
  render();
  refreshRegisteredCount();
}

document.addEventListener('fa-members-ready', async () => {
  await loadCharacters();
  await handlePaymentReturn();
});
})();
</script>
