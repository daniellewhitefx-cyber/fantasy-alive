<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Log In - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/login.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Log In - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
:root{
  --cream: #ece1cd;
  --ink: #14120f;
  --brown: #5b4321;
  --brown-dark: #4a3619;
  --gold: #e8a622;
  --gold-dark: #c98f1c;
  --bad: #a33b2f;
}
*{ box-sizing: border-box; }
html, body{
  margin:0; padding:0;
  background: var(--cream);
  color: var(--brown);
  font-family: 'EB Garamond', serif;
  min-height: 100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.auth-box{
  width: 100%;
  max-width: 420px;
  background: #fff;
  border: 3px solid var(--gold);
  box-shadow: 10px 10px 0 0 var(--gold);
  padding: 2.4rem 2.2rem;
  margin: 2rem;
}
h1{
  font-family: 'Cinzel', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--brown-dark);
  margin: 0 0 1.6rem;
  text-align:center;
}
label{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.03em;
  display:block;
  margin-bottom: 0.4rem;
}
input{
  width:100%;
  font-family: 'EB Garamond', serif;
  font-size: 1.05rem;
  padding: 0.7rem 0.9rem;
  border: 2px solid var(--gold);
  border-radius: 4px;
  margin-bottom: 1.2rem;
}
button{
  width:100%;
  background: var(--gold);
  color: var(--ink);
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1.05rem;
  padding: 0.85rem;
  border:none;
  border-radius: 4px;
  cursor:pointer;
}
button:hover{ background: var(--gold-dark); }
button:disabled{ opacity: 0.6; cursor: not-allowed; }
.msg{
  margin-top: 1.1rem;
  font-size: 0.95rem;
  text-align:center;
}
.msg.error{ color: var(--bad); }
.msg.success{ color: #3f7a3f; }
.switch-link{
  margin-top: 1.4rem;
  text-align:center;
  font-size: 0.95rem;
}
.switch-link a{ color: var(--gold-dark); }
</style>
</head>
<body>

<div class="auth-box">
  <h1>Log In</h1>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Your password">

  <button id="login-btn" onclick="handleLogin()">Log In</button>

  <div id="message" class="msg"></div>

  <div class="switch-link">Need an account? <a href="signup.html">Sign up</a></div>
</div>

<script>
const SUPABASE_URL = 'https://xdchluuvicuuqyqsejnq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_JL4nY9-fcOAwYzwpwiJa9w_nypZCt99';

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function handleLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('message');
  const btn = document.getElementById('login-btn');

  msg.textContent = '';
  msg.className = 'msg';

  if(!email || !password){
    msg.textContent = 'Fill in both fields.';
    msg.classList.add('error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  btn.disabled = false;
  btn.textContent = 'Log In';

  if(error){
    msg.textContent = error.message;
    msg.classList.add('error');
    return;
  }

  msg.textContent = 'Logged in! Redirecting...';
  msg.classList.add('success');

  window.location.href = 'characters.html';
}

supabaseClient.auth.getSession().then(({ data }) => {
  if(data.session) window.location.href = 'characters.html';
});
</script>

</body>
</html>
