<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipes - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Recipes - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/recipes.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Recipes - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
:root{
  --recipe-row-a: #ece1cd;
  --recipe-row-b: #f0d99a;
}

.recipe-page-hero{
  display:grid;
  grid-template-columns: 1fr 1fr;
  align-items:center;
  height: 320px;
  overflow: hidden;
}
.recipe-page-hero-content{
  padding: 2rem 3rem 2rem 5.5rem;
  text-align: center;
}
.recipe-page-hero-content img{
  width:100%; max-width: 440px; height:auto; display:block; margin: 0 auto;
}
.recipe-page-hero-content h1{
  font-family: 'EB Garamond', serif;
  font-weight: 500;
  font-size: 3rem;
  margin: 0.5rem 0 0;
  color: var(--brown);
  text-align: center;
}
.recipe-page-hero-image{
  position:relative;
  overflow:hidden;
  height: 100%;
  min-height: 320px;
}
.recipe-page-hero-image::after{
  content:"";
  position:absolute;
  top:0; left:0;
  width: 45%; height:100%;
  background: linear-gradient(to left, rgba(236,225,205,0) 0%, var(--cream) 100%);
  pointer-events: none;
}
.recipe-page-hero-image img{
  width:100%; height:100%; object-fit:cover; display:block;
}
.recipe-page{
  display:grid;
  grid-template-columns: 280px 1fr;
  gap: 1.5rem;
  padding: 1.5rem 2rem 3rem;
  align-items:start;
  max-width: 1400px;
  margin: 0 auto;
  background: var(--cream);
  color: var(--brown);
  font-family: 'Cinzel', serif;
}

.recipe-sidebar{
  border: 2px solid var(--gold-dark);
  border-radius: 4px;
  overflow:hidden;
  position: sticky;
  top: 1.5rem;
}
.recipe-category-list{
  display: flex;
  flex-direction: column;
}
.recipe-category-btn{
  display:block;
  width:100%;
  text-align:left;
  background: var(--ink);
  border: none;
  border-bottom: 1px solid var(--gold-dark);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.9rem;
  padding: 0.65rem 1rem;
  cursor:pointer;
  transition: background 0.15s ease, color 0.15s ease;
  white-space: nowrap;
}
.recipe-category-btn:last-child{ border-bottom: none; }
.recipe-category-btn.active{
  background: var(--gold);
  color: var(--ink);
}
.recipe-category-btn:not(.active):hover{
  background: var(--gold-dark);
  color: var(--cream);
}

.recipe-search{
  padding: 0.6rem;
  background: var(--ink);
  border-bottom: 3px solid var(--gold);
}
.recipe-search input{
  width:100%;
  font-family: 'EB Garamond', serif;
  font-size: 0.9rem;
  padding: 0.45rem 0.6rem;
  border: 2px solid var(--gold);
  border-radius: 4px;
  background: #fff;
  color: var(--brown);
}
.recipe-search-results{
  display:flex;
  flex-direction: column;
}
.recipe-search-result{
  display:block;
  width:100%;
  text-align:left;
  background: var(--cream-deep);
  border: none;
  border-bottom: 1px dotted var(--gold-dark);
  color: var(--brown);
  padding: 0.55rem 0.8rem;
  cursor:pointer;
}
.recipe-search-result:last-child{ border-bottom:none; }
.recipe-search-result:hover{ background: var(--gold); }
.recipe-search-result .rsr-title{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 0.1rem;
}
.recipe-search-result .rsr-cat{
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 0.2rem;
}
.recipe-search-result .rsr-excerpt{
  font-family: 'EB Garamond', serif;
  font-size: 0.82rem;
  line-height: 1.35;
  color: var(--brown-dark);
}
.recipe-search-result mark{
  background: var(--gold);
  color: var(--ink);
  padding: 0 1px;
}
.recipe-search-empty{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 0.85rem;
  color: var(--brown-dark);
  padding: 0.8rem;
}

.recipe-article{ background: transparent; }
.recipe-article h2{
  font-size: 1.6rem;
  font-weight: 700;
  margin: 0 0 0.8rem;
  color: var(--brown-dark);
}

.recipe-table-wrap{
  width: 100%;
  box-shadow: 6px 6px 0 0 var(--gold);
  overflow-x: auto;
}
.recipe-table{
  width:100%;
  border-collapse: collapse;
  border: 2px solid var(--gold);
  background: var(--recipe-row-a);
}
.recipe-table th{
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 0.85rem;
  padding: 0.5rem 0.4rem;
  border-bottom: 3px solid var(--gold);
  text-align: center;
  color: var(--brown-dark);
  white-space: nowrap;
}
.recipe-table th:not(:last-child),
.recipe-table td:not(:last-child){
  border-right: 1px dotted var(--gold-dark);
}
.recipe-table td{
  font-family: 'EB Garamond', serif;
  font-size: 0.92rem;
  padding: 0.45rem 0.5rem;
  text-align: center;
  line-height: 1.3;
  color: var(--brown-dark);
}
.recipe-table td.col-name{
  font-family: 'Cinzel', serif;
  font-weight: 600;
  font-size: 0.85rem;
  text-align: left;
  white-space: nowrap;
}
.recipe-table td.col-ingredients,
.recipe-table td.col-effect,
.recipe-table td.col-desc{
  text-align: left;
}

.recipe-table tbody tr:nth-child(odd){ background: var(--recipe-row-b); }
.recipe-table tbody tr:nth-child(even){ background: var(--recipe-row-a); }

.recipe-table tr.highlighted{
  background-color: var(--gold) !important;
  color: var(--ink) !important;
}

.recipe-empty{
  font-family: 'EB Garamond', serif;
  font-style: italic;
  color: var(--brown-dark);
  padding: 1.5rem;
}

@media (max-width: 850px){
  .recipe-page-hero{ grid-template-columns: 1fr; height: auto; }
  .recipe-page-hero-content{ padding: 1.5rem 1rem; }
  .recipe-page-hero-content h1{ font-size: 2.2rem; }
  .recipe-page-hero-image{ height: 180px; min-height: 180px; }
  .recipe-page-hero-image::after{
    width: 100%; height: 50%;
    background: linear-gradient(to bottom, var(--cream) 0%, rgba(236,225,205,0) 100%);
  }

  .recipe-page{ grid-template-columns: 1fr; padding: 1rem; gap: 1rem; }
  .recipe-sidebar{ position: static; }
  .recipe-category-list{ flex-direction: row; }
  .recipe-category-btn{ border-bottom: none; border-right: 1px solid var(--gold-dark); padding: 0.6rem 0.9rem; text-align: center; flex: 1; }
}

@media (max-width: 600px){
  .recipe-table-wrap{ box-shadow: 3px 3px 0 0 var(--gold); }
  .recipe-table, .recipe-table thead, .recipe-table tbody, .recipe-table th, .recipe-table td, .recipe-table tr{ display: block; }
  .recipe-table thead{ display: none; }
  .recipe-table tr{ margin-bottom: 0.8rem; border: 1px solid var(--gold-dark); padding: 0.6rem; }
  .recipe-table td{ text-align: left !important; padding: 0.25rem 0; border-right: none !important; }
  .recipe-table td.col-name{
    font-size: 1rem;
    color: var(--brown-dark);
    border-bottom: 1px solid var(--gold-dark);
    padding-bottom: 0.4rem;
    margin-bottom: 0.4rem;
    white-space: normal;
  }
  .recipe-table td::before{
    content: attr(data-label);
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--gold-dark);
    display: block;
    text-transform: uppercase;
  }
  .recipe-table td.col-name::before{ display: none; }
}
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<section class="recipe-page-hero">
<div class="recipe-page-hero-content">
<img src="https://i.imgur.com/zcnx0lm.png" alt="Fantasy Alive">
<h1>Recipes</h1>
</div>
<div class="recipe-page-hero-image">
<img src="https://i.imgur.com/RLJCgxQ.jpeg" alt="Glowing bottles of alchemical and herbal mixtures on a windowsill">
</div>
</section>

<div class="recipe-page" id="recipe-page">
<nav class="recipe-sidebar">
<div class="recipe-search">
<input type="text" id="recipe-search-input" placeholder="Search recipe name..." oninput="recipe_search(this.value)">
</div>
<div id="recipe-sidebar-content"><p class="recipe-empty" style="padding:1rem;">Loading recipe sections&hellip;</p></div>
</nav>
<article class="recipe-article" id="recipe-display">
<p class="recipe-empty">Loading the recipe list from the spreadsheet&hellip;</p>
</article>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/skills-data.js"></script>
<script src="js/recipes-data.js"></script>
<script>
(function(){
const CATEGORY_ORDER = RECIPE_CATEGORY_ORDER;
const CATEGORY_LABELS = RECIPE_CATEGORY_LABELS;

let activeCategory = 'Alchemical';
let highlightedRecipe = null;
let allRecipes = [];
let loadError = null;

function labelFor(cat){ return CATEGORY_LABELS[cat] || cat; }

async function loadRecipes(){
  try{
    allRecipes = await recipesLoadFromSheet();
    const categories = orderedCategories();
    if(categories.length && !categories.includes(activeCategory)) activeCategory = categories[0];
  } catch(err){
    loadError = err;
  }

  const params = new URLSearchParams(location.search);
  const openTitle = params.get('open');
  if(openTitle && allRecipes.some(r => r.title === openTitle)){
    recipe_selectSearchResult(params.get('cat') || activeCategory, openTitle);
    return;
  }

  renderSidebar();
  renderDisplay();
}

function recipe_selectCategory(category, recipeToHighlight){
  if(recipeToHighlight === undefined) recipeToHighlight = null;
  activeCategory = category;
  highlightedRecipe = recipeToHighlight;
  renderDisplay();
  renderSidebar();

  if(highlightedRecipe){
    const targetRow = document.getElementById('recipe-row-' + highlightedRecipe.replace(/[^a-zA-Z0-9]/g, '-'));
    if(targetRow) targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function recipe_selectSearchResult(category, recipeTitle){
  recipe_selectCategory(category, recipeTitle);
  const searchInput = document.getElementById('recipe-search-input');
  if(searchInput) searchInput.value = '';
}

function recipesByCategory(){
  const byCategory = {};
  allRecipes.forEach(r => {
    if(!byCategory[r.category]) byCategory[r.category] = [];
    byCategory[r.category].push(r);
  });
  return byCategory;
}

function orderedCategories(){
  return recipesOrderedCategories(allRecipes);
}

function renderSidebar(){
  const target = document.getElementById('recipe-sidebar-content');
  const searchInput = document.getElementById('recipe-search-input');
  if(searchInput && searchInput.value.trim()) return;

  if(loadError){
    target.innerHTML = '<p class="recipe-empty" style="padding:1rem;">Couldn\'t load the recipe list. Refresh to try again.</p>';
    return;
  }

  const categories = orderedCategories();
  if(categories.length === 0){
    target.innerHTML = '<p class="recipe-empty" style="padding:1rem;">No recipes found in the spreadsheet yet.</p>';
    return;
  }

  target.innerHTML = `
    <div class="recipe-category-list">
      ${categories.map(cat => `
        <button class="recipe-category-btn ${cat === activeCategory ? 'active' : ''}"
          onclick="recipe_selectCategory('${cat.replace(/'/g, "\\'")}')">
          ${escapeHtml(labelFor(cat))}
        </button>
      `).join('')}
    </div>
  `;
}

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function makeExcerpt(text, query){
  const lower = text.toLowerCase();
  const idx = lower.indexOf(query.toLowerCase());
  if(idx === -1) return escapeHtml(text.slice(0, 140)) + (text.length > 140 ? '&hellip;' : '');
  const start = Math.max(0, idx - 50);
  const end = Math.min(text.length, idx + query.length + 90);
  const before = escapeHtml(text.slice(start, idx));
  const match = escapeHtml(text.slice(idx, idx + query.length));
  const after = escapeHtml(text.slice(idx + query.length, end));
  return (start > 0 ? '&hellip;' : '') + before + '<mark>' + match + '</mark>' + after + (end < text.length ? '&hellip;' : '');
}

function recipe_search(rawQuery){
  const query = rawQuery.trim();
  const target = document.getElementById('recipe-sidebar-content');

  if(!query){
    renderSidebar();
    return;
  }

  const lowerQuery = query.toLowerCase();
  const results = allRecipes.map(r => {
    const bodyText = (r.desc + ' ' + r.ingredients + ' ' + r.effect).replace(/\s+/g, ' ').trim();
    const titleMatch = r.title.toLowerCase().includes(lowerQuery);
    const bodyMatch = bodyText.toLowerCase().includes(lowerQuery);
    if(!titleMatch && !bodyMatch) return null;
    return { category: r.category, title: r.title, bodyText, rank: titleMatch ? 0 : 1 };
  }).filter(Boolean).sort((a, b) => a.rank - b.rank || a.title.localeCompare(b.title));

  if(results.length === 0){
    target.innerHTML = '<p class="recipe-search-empty">No recipes found matching &ldquo;' + escapeHtml(query) + '&rdquo;.</p>';
    return;
  }

  target.innerHTML = '<div class="recipe-search-results">' + results.map(r => `
    <button class="recipe-search-result" onclick="recipe_selectSearchResult('${r.category.replace(/'/g, "\\'")}', '${r.title.replace(/'/g, "\\'")}')">
      <div class="rsr-cat">${escapeHtml(labelFor(r.category))}</div>
      <div class="rsr-title">${escapeHtml(r.title)}</div>
      <div class="rsr-excerpt">${r.rank === 0 ? escapeHtml(r.bodyText.slice(0, 140)) + (r.bodyText.length > 140 ? '&hellip;' : '') : makeExcerpt(r.bodyText, query)}</div>
    </button>
  `).join('') + '</div>';
}

function renderDisplay(){
  const display = document.getElementById('recipe-display');

  if(loadError){
    display.innerHTML = '<p class="recipe-empty">Couldn\'t load the recipe list from the spreadsheet. Refresh to try again.</p>';
    return;
  }

  const recipes = recipesByCategory()[activeCategory] || [];
  if(recipes.length === 0){
    display.innerHTML = '<p class="recipe-empty">Select a recipe section or search for a recipe name to begin.</p>';
    return;
  }

  const tableRows = recipes.map(r => {
    const isHighlighted = r.title === highlightedRecipe;
    const rowId = 'recipe-row-' + r.title.replace(/[^a-zA-Z0-9]/g, '-');
    return `
      <tr id="${rowId}" class="${isHighlighted ? 'highlighted' : ''}">
        <td class="col-name" data-label="Name">${escapeHtml(r.title)}</td>
        <td data-label="Level">${escapeHtml(r.level)}</td>
        <td class="col-effect" data-label="Effect">${escapeHtml(r.effect)}</td>
        <td data-label="Type">${escapeHtml(r.type)}</td>
        <td data-label="Mixed with Gas">${escapeHtml(r.mixedWithGas)}</td>
        <td class="col-ingredients" data-label="Ingredients">${escapeHtml(r.ingredients)}</td>
        <td class="col-desc" data-label="Description">${escapeHtml(r.desc)}</td>
      </tr>
    `;
  }).join('');

  display.innerHTML = `
    <h2>${escapeHtml(labelFor(activeCategory))} Recipes</h2>
    <div class="recipe-table-wrap">
      <table class="recipe-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Level</th>
            <th>Effect</th>
            <th>Type</th>
            <th>Mixed with Gas</th>
            <th>Ingredients</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody>
          ${tableRows}
        </tbody>
      </table>
    </div>
  `;
}

window.recipe_selectCategory = recipe_selectCategory;
window.recipe_selectSearchResult = recipe_selectSearchResult;
window.recipe_search = recipe_search;

function init(){
  loadRecipes();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
})();
</script>

</body>
</html>
