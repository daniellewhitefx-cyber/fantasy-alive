<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends - Fantasy Alive</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/ktGEBJP.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Friends - Fantasy Alive">
<meta property="og:description" content="Don't be afraid to live more than once!">
<meta property="og:image" content="https://i.imgur.com/ljFTAph.png">
<meta property="og:url" content="https://fantasy-alive.vercel.app/friends.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Friends - Fantasy Alive">
<meta name="twitter:description" content="Don't be afraid to live more than once!">
<meta name="twitter:image" content="https://i.imgur.com/ljFTAph.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/members.css">
<script src="js/vendor/supabase-js.min.js"></script>
<style>
.friends-card-row{
  display:flex;
  align-items:center;
  gap: 0.7rem;
}
.friends-avatar{
  width: 52px; height: 52px;
  flex-shrink:0;
  border: 2px solid var(--brown-dark);
  background: var(--ink);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 1.1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.friends-avatar img{ width:100%; height:100%; object-fit:cover; }
.friends-card-body{ flex:1; min-width:0; }
</style>
</head>
<body>

<div data-include="partials/header.html"></div>

<div class="dashboard">

<div data-include="partials/members-sidebar.html"></div>

<div>

<div class="char-switcher" id="char-switcher"></div>

<h1 class="page-title">Friends</h1>

<div class="section-block">
<div class="bank-recipient-picker" data-picker="friends">
<label class="field-label" for="friends-search-input">Send a friend request</label>
<input type="text" id="friends-search-input" placeholder="Search player or character name..." autocomplete="off"
  oninput="friends_search(this.value)" onfocus="friends_search(this.value)" onblur="friends_hideResults()">
<div class="member-search-list" id="friends-search-results"></div>
</div>
</div>

<div class="section-block" id="friends-incoming-block" style="display:none;">
<h3>Friend Requests</h3>
<div class="card-grid" id="friends-incoming-list"></div>
</div>

<div class="section-block" id="friends-outgoing-block" style="display:none;">
<h3>Sent Requests</h3>
<div class="card-grid" id="friends-outgoing-list"></div>
</div>

<div class="section-block">
<h3>Current Friends</h3>
<div class="card-grid" id="friends-list"></div>
</div>

</div>
</div>

<div data-include="partials/footer.html"></div>

<script src="js/include.js"></script>
<script src="js/registration-status.js"></script>
<script src="js/members-auth.js"></script>
<script>
let CHARACTERS = [];
let activeCharId = null;
let ALL_CANDIDATES = [];

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function emptyState(msg){
  return `<div class="empty-state"><svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><p>${escapeHtml(msg)}</p></div>`;
}
function initials(name){
  return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
}

function selectChar(id){
  activeCharId = id;
  document.getElementById('friends-search-input').value = '';
  document.getElementById('friends-search-results').innerHTML = '';
  renderSwitcher();
  loadFriends();
}

function renderSwitcher(){
  const switcher = document.getElementById('char-switcher');
  switcher.innerHTML = CHARACTERS.map(ch =>
    `<button class="${ch.id===activeCharId?'active':''}" onclick="selectChar('${ch.id}')">${escapeHtml(ch.name)}</button>`
  ).join('');
}

let EXCLUDED_CANDIDATE_IDS = new Set();

async function loadAllCandidates(){
  const myUserId = window.faCurrentUser ? window.faCurrentUser.id : null;

  const [{ data: chars }, profiles] = await Promise.all([
    membersSupabase.rpc('character_names').select('id, name, player_id'),
    faFetchAllRows('profiles', 'id, display_name')
  ]);

  const nameByPlayer = {};
  (profiles || []).forEach(p => { nameByPlayer[p.id] = p.display_name; });

  ALL_CANDIDATES = (chars || [])
    .filter(c => c.player_id !== myUserId)
    .map(c => ({
      id: c.id,
      name: c.name,
      playerName: nameByPlayer[c.player_id] || 'Unknown player',
      label: `${c.name} [${nameByPlayer[c.player_id] || 'Unknown player'}]`
    }))
    .sort((a, b) => a.name.localeCompare(b.name));
}

function renderCandidates(query){
  const q = query.trim().toLowerCase();
  const resultsEl = document.getElementById('friends-search-results');

  const matches = (q
    ? ALL_CANDIDATES.filter(c => c.name.toLowerCase().includes(q) || c.playerName.toLowerCase().includes(q))
    : ALL_CANDIDATES
  ).filter(c => !EXCLUDED_CANDIDATE_IDS.has(c.id));

  if(matches.length === 0){
    resultsEl.innerHTML = '<div class="bank-recipient-empty">No matching characters.</div>';
    return;
  }

  resultsEl.innerHTML = matches.map(c =>
    `<button class="bank-recipient-result" onclick="friends_sendRequest('${c.id}')">${escapeHtml(c.label)}</button>`
  ).join('');
}

function friends_search(query){
  renderCandidates(query);
}

function friends_hideResults(){
  setTimeout(() => {
    document.getElementById('friends-search-results').innerHTML = '';
  }, 150);
}

async function friends_sendRequest(charId){
  if(!activeCharId) return;

  // If they already sent us a pending request, sending one back just accepts theirs.
  const { data: reverse } = await membersSupabase.from('character_friends')
    .select('status')
    .eq('character_id', charId).eq('friend_character_id', activeCharId)
    .maybeSingle();

  if(reverse && reverse.status === 'pending'){
    const { error } = await membersSupabase.from('character_friends')
      .update({ status: 'accepted' })
      .eq('character_id', charId).eq('friend_character_id', activeCharId);
    if(error){ alert('Could not accept friend request: ' + error.message); return; }
  } else {
    const { error } = await membersSupabase.from('character_friends')
      .upsert({ character_id: activeCharId, friend_character_id: charId, status: 'pending' }, { onConflict: 'character_id,friend_character_id', ignoreDuplicates: true });
    if(error){ alert('Could not send friend request: ' + error.message); return; }
  }
  document.getElementById('friends-search-input').value = '';
  document.getElementById('friends-search-results').innerHTML = '';
  await loadFriends();
}

async function friends_acceptRequest(requesterId){
  if(!activeCharId) return;
  const { error } = await membersSupabase.from('character_friends')
    .update({ status: 'accepted' })
    .eq('character_id', requesterId).eq('friend_character_id', activeCharId);
  if(error){ alert('Could not accept friend request: ' + error.message); return; }
  await loadFriends();
}

async function friends_declineRequest(requesterId){
  if(!activeCharId) return;
  const { error } = await membersSupabase.from('character_friends')
    .delete()
    .eq('character_id', requesterId).eq('friend_character_id', activeCharId);
  if(error){ alert('Could not decline friend request: ' + error.message); return; }
  await loadFriends();
}

async function friends_cancelRequest(targetId){
  if(!activeCharId) return;
  const { error } = await membersSupabase.from('character_friends')
    .delete()
    .eq('character_id', activeCharId).eq('friend_character_id', targetId);
  if(error){ alert('Could not cancel friend request: ' + error.message); return; }
  await loadFriends();
}

async function friends_removeFriend(otherCharId){
  if(!activeCharId) return;
  const { error } = await membersSupabase.from('character_friends')
    .delete()
    .or(`and(character_id.eq.${activeCharId},friend_character_id.eq.${otherCharId}),and(character_id.eq.${otherCharId},friend_character_id.eq.${activeCharId})`);
  if(error){ alert('Could not remove friend: ' + error.message); return; }
  await loadFriends();
}

function friends_renderNamedCards(ids, charById, nameByPlayer, buttonsFor){
  return ids.map(id => {
    const c = charById[id];
    if(!c) return '';
    const avatar = c.portrait_url
      ? `<img src="${escapeHtml(c.portrait_url)}" alt="${escapeHtml(c.name)} portrait">`
      : escapeHtml(initials(c.name));
    return `
    <div class="info-card">
      <div class="friends-card-row">
        <div class="friends-avatar">${avatar}</div>
        <div class="friends-card-body">
          <div>${escapeHtml(c.name)}</div>
          <div class="friends-player-name">${escapeHtml(nameByPlayer[c.player_id] || 'Unknown player')}</div>
        </div>
      </div>
      ${buttonsFor(id)}
    </div>`;
  }).join('');
}

async function loadFriends(){
  const listEl = document.getElementById('friends-list');
  const incomingBlock = document.getElementById('friends-incoming-block');
  const outgoingBlock = document.getElementById('friends-outgoing-block');
  const incomingList = document.getElementById('friends-incoming-list');
  const outgoingList = document.getElementById('friends-outgoing-list');

  if(!activeCharId){
    listEl.innerHTML = '';
    incomingBlock.style.display = 'none';
    outgoingBlock.style.display = 'none';
    EXCLUDED_CANDIDATE_IDS = new Set();
    return;
  }

  const { data: rows } = await membersSupabase.from('character_friends')
    .select('character_id, friend_character_id, status')
    .or(`character_id.eq.${activeCharId},friend_character_id.eq.${activeCharId}`);

  const accepted = [];
  const incoming = [];
  const outgoing = [];
  (rows || []).forEach(r => {
    const otherId = r.character_id === activeCharId ? r.friend_character_id : r.character_id;
    if(r.status === 'accepted') accepted.push(otherId);
    else if(r.friend_character_id === activeCharId) incoming.push(r.character_id);
    else outgoing.push(r.friend_character_id);
  });

  EXCLUDED_CANDIDATE_IDS = new Set([...accepted, ...incoming, ...outgoing]);

  const allIds = [...EXCLUDED_CANDIDATE_IDS];
  if(allIds.length === 0){
    listEl.innerHTML = emptyState('No friends added yet for this character.');
    incomingBlock.style.display = 'none';
    outgoingBlock.style.display = 'none';
    return;
  }

  const { data: chars } = await membersSupabase.rpc('character_names').select('id, name, player_id, portrait_url').in('id', allIds);
  const playerIds = [...new Set((chars || []).map(c => c.player_id))];
  const { data: profiles } = await membersSupabase.from('profiles').select('id, display_name').in('id', playerIds);
  const nameByPlayer = {};
  (profiles || []).forEach(p => { nameByPlayer[p.id] = p.display_name; });
  const charById = {};
  (chars || []).forEach(c => { charById[c.id] = c; });

  if(incoming.length){
    incomingBlock.style.display = '';
    incomingList.innerHTML = friends_renderNamedCards(incoming, charById, nameByPlayer, id => `
      <div class="row-inline" style="margin:0.7rem 0 0;">
        <button class="btn-gold friends-remove-btn" onclick="friends_acceptRequest('${id}')">Accept</button>
        <button class="btn-outline friends-remove-btn" onclick="friends_declineRequest('${id}')">Decline</button>
      </div>`);
  } else {
    incomingBlock.style.display = 'none';
  }

  if(outgoing.length){
    outgoingBlock.style.display = '';
    outgoingList.innerHTML = friends_renderNamedCards(outgoing, charById, nameByPlayer, id =>
      `<button class="btn-outline friends-remove-btn" onclick="friends_cancelRequest('${id}')">Cancel Request</button>`);
  } else {
    outgoingBlock.style.display = 'none';
  }

  if(accepted.length){
    listEl.innerHTML = friends_renderNamedCards(accepted, charById, nameByPlayer, id =>
      `<button class="btn-outline friends-remove-btn" onclick="friends_removeFriend('${id}')">Remove</button>`);
  } else {
    listEl.innerHTML = emptyState('No friends added yet for this character.');
  }
}

async function loadCharacters(){
  const { data } = await membersSupabase
    .from('characters')
    .select('id, name')
    .eq('player_id', window.faCurrentUser.id)
    .order('created_at', { ascending: true });
  CHARACTERS = data || [];
  activeCharId = CHARACTERS.length ? CHARACTERS[0].id : null;
  renderSwitcher();
  await loadAllCandidates();
  await loadFriends();
}

window.selectChar = selectChar;
window.friends_search = friends_search;
window.friends_hideResults = friends_hideResults;
window.friends_sendRequest = friends_sendRequest;
window.friends_acceptRequest = friends_acceptRequest;
window.friends_declineRequest = friends_declineRequest;
window.friends_cancelRequest = friends_cancelRequest;
window.friends_removeFriend = friends_removeFriend;
document.addEventListener('fa-members-ready', loadCharacters);
</script>

</body>
</html>
